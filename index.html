    * { box-sizing: border-box; }
    body {

      background-color: #181a1b;
      color: #f3f4f6;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 560px;
      user-select: none;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }
    .sq-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .sq-piece {
      width: 84%;
      height: 84%;
      pointer-events: auto;
      cursor: grab;
      transition: transform 0.08s ease;
    }
    .sq-piece:active { cursor: grabbing; transform: scale(1.06); }
    .move-dot {
      width: 28%;
      height: 28%;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.22);
      pointer-events: none;
    }
    .capture-ring {
      position: absolute;
      inset: 6%;
      border-radius: 9999px;
      border: 4px solid rgba(0, 0, 0, 0.24);
      pointer-events: none;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #181a1b; }
    ::-webkit-scrollbar-thumb { background: #363b40; border-radius: 999px; }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeJsAttr(str) {
      return String(str ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function normalizeNick(str) {
      return String(str || '').trim().replace(/^@+/, '').toLowerCase();
    }

    function isUserOnline(u) {
      if (!u) return false;
      if (u.online === true && u.lastSeen && Date.now() - u.lastSeen < 120000) return true;
      return Boolean(u.lastSeen && Date.now() - u.lastSeen < 45000);
    }

    function getUserTitlesArray(u) {
      if (!u) return [];
      const raw = Array.isArray(u) ? u : (Array.isArray(u.titles) ? u.titles : (u.title ? [u.title] : []));
      return [...new Set(raw.map(t => String(t || '').trim().toUpperCase()).filter(t => CHESS_TITLES.includes(t)))];
    }

    function renderTitleBadge(u) {
      const list = getUserTitlesArray(u);
      if (list.length === 0) return '';
      return list.map(t => `<span class="inline-flex items-center px-1.5 py-0.5 rounded bg-[#991b1b] text-white text-[10px] font-black tracking-wide leading-none mr-1">${escapeHtml(t)}</span>`).join('');
    }

    function getUserRatingForTime(u, tc) {
      if (!u) return 500;
      const key = `elo${tc}`;
      return typeof u[key] === 'number' ? u[key] : 500;
    }

    function getActiveBan(uid) {
      if (!uid || !state.bansMap) return null;
      const b = state.bansMap[uid];
      if (!b) return null;
      if (b.expiresAt !== 'forever' && Number(b.expiresAt) <= Date.now()) return null;
      return b;
    }

    function formatBanDuration(exp) {
      if (exp === 'forever') return 'Навсегда';
      const diff = Number(exp) - Date.now();
      if (diff <= 0) return 'Истёк';
      const hours = Math.ceil(diff / 3600000);
      if (hours < 24) return `осталось ~${hours} ч.`;
      const days = Math.ceil(diff / 86400000);
      return `осталось ~${days} дн.`;
    }

    function showToast(msg, type = 'ok') {

      el.textContent = msg;
      root.appendChild(el);
      setTimeout(() => { el.remove(); }, 3400);
    }

    function saveLocalSession(userObj) {
      try {
        if (userObj) localStorage.setItem(LS_LOCAL_USER, JSON.stringify(userObj));
        else localStorage.removeItem(LS_LOCAL_USER);
      } catch (e) {}
    }

    function loadLocalSession() {
      try {
        const raw = localStorage.getItem(LS_LOCAL_USER);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    async function ensureGlobalEloResetOnce(usersObj) {
      try {
        if (localStorage.getItem(LS_ELO_RESET_DONE) === ELO_RESET_VERSION) return;
        const flagSnap = await get(ref(rtdb, `bc_meta/${ELO_RESET_VERSION}`));
        if (!flagSnap.exists() && usersObj) {
          const updates = {};
          Object.keys(usersObj).forEach(uid => {
            updates[`bc_users/${uid}/elo1`] = 500;
            updates[`bc_users/${uid}/elo3`] = 500;
            updates[`bc_users/${uid}/elo10`] = 500;
            updates[`bc_users/${uid}/gamesPlayed`] = 0;
          });
          updates[`bc_meta/${ELO_RESET_VERSION}`] = Date.now();
          await update(ref(rtdb), updates);
        }
        localStorage.setItem(LS_ELO_RESET_DONE, ELO_RESET_VERSION);
      } catch (e) {}
    }

    function initRealtimeListeners() {
      onValue(ref(rtdb, 'bc_users'), (snap) => {
        const data = snap.val() || {};
        state.usersMap = data;
        ensureGlobalEloResetOnce(data);
        if (state.currentUser && data[state.currentUser.uid]) {
          const prevFriends = state.currentUser.friends || {};
          const merged = { ...state.currentUser, ...data[state.currentUser.uid] };
          state.currentUser = merged;
          saveLocalSession(merged);
          const nextFriends = merged.friends || {};
          Object.keys(nextFriends).forEach(fUid => {
            if (!prevFriends[fUid] && !shownFriendNotifs.has(fUid)) {
              shownFriendNotifs.add(fUid);
              const friendUser = data[fUid];
              if (friendUser && friendUser.nick) {
                showFriendPopup(friendUser);
              }
            }
          });
        }
        renderApp();
      });

      onValue(ref(rtdb, 'bc_bans'), (snap) => {
        state.bansMap = snap.val() || {};
        renderApp();
      });

      onValue(ref(rtdb, 'bc_archives'), (snap) => {
        state.userArchives = snap.val() || {};
        if (state.path.startsWith('/@')) renderApp();
      });

      onValue(ref(rtdb, 'bc_challenges'), (snap) => {
        if (!state.currentUser) return;
        const list = snap.val() || {};
        const myUid = state.currentUser.uid;
        const incoming = Object.values(list).filter(c => c && c.toUid === myUid && c.status === 'pending');
        renderChallengePopups(incoming);
      });

      onValue(ref(rtdb, 'bc_rematches'), (snap) => {
        if (!state.currentUser) return;
        const list = snap.val() || {};
        const myUid = state.currentUser.uid;
        const incoming = Object.values(list).filter(r => r && r.toUid === myUid && r.status === 'pending');
        renderRematchPopups(incoming);
      });

      onValue(ref(rtdb, 'bc_games'), (snap) => {
        if (!state.currentUser) return;
        const games = snap.val() || {};
        const myUid = state.currentUser.uid;
        const myActive = Object.values(games).find(
          g => g && g.status === 'active' && (g.whiteUid === myUid || g.blackUid === myUid)
        );
        if (myActive && state.activeGameId !== myActive.id) {
          joinActiveGameListener(myActive.id);
        }
      });
    }

    window.handleGoogleSignIn = async function() {
      try {
        const provider = new GoogleAuthProvider();
        const res = await signInWithPopup(auth, provider);
        const fbUser = res.user;
        const snap = await get(ref(rtdb, `bc_users/${fbUser.uid}`));
        if (snap.exists()) {
          const existing = snap.val();
          state.currentUser = existing;
          saveLocalSession(existing);
          setupPresence(existing.uid);
          if (!existing.nick) state.onboardingStep = 'nick';
          else if (!existing.coachId) state.onboardingStep = 'coach';
          else state.onboardingStep = null;
        } else {
          const draft = {
            uid: fbUser.uid,
            email: fbUser.email || '',
            nick: '',
            password: '',
            coachId: '',
            boardStyle: 'green',
            publicArchive: true,
            elo1: 500,
            elo3: 500,
            elo10: 500,
            gamesPlayed: 0,
            titles: [],
            friends: {},
            createdAt: Date.now(),
            lastSeen: Date.now(),
            online: true
          };
          await set(ref(rtdb, `bc_users/${fbUser.uid}`), draft);
          state.currentUser = draft;
          saveLocalSession(draft);
          setupPresence(draft.uid);
          state.onboardingStep = 'nick';
        }
        renderApp();
      } catch (err) {
        showToast('Ошибка входа Google: ' + (err?.message || ''), 'error');
      }
    };

    window.handleCredentialsLogin = async function(event) {
      if (event) event.preventDefault();
      const idVal = (document.getElementById('login-identifier')?.value || '').trim();
      const passVal = (document.getElementById('login-password')?.value || '').trim();
      if (!idVal || !passVal) return;

      const lower = idVal.toLowerCase();
      const matched = Object.values(state.usersMap).find(u =>
        u && ((u.nick && u.nick.toLowerCase() === lower) || (u.email && u.email.toLowerCase() === lower))
      );

      if (matched && matched.password === passVal) {
        state.currentUser = matched;
        saveLocalSession(matched);
        setupPresence(matched.uid);
        state.onboardingStep = !matched.nick ? 'nick' : (!matched.coachId ? 'coach' : null);
        showToast(`Добро пожаловать, ${matched.nick || 'игрок'}!`);
        renderApp();
        return;
      }

      if (idVal.includes('@')) {
        try {
          const cred = await signInWithEmailAndPassword(auth, idVal, passVal);
          const snap = await get(ref(rtdb, `bc_users/${cred.user.uid}`));
          if (snap.exists()) {
            state.currentUser = snap.val();
            saveLocalSession(state.currentUser);
            setupPresence(state.currentUser.uid);
            renderApp();
            return;
          }
        } catch (e) {}
      }

      showToast('Неверный никнейм, почта или пароль', 'error');
    };

    window.submitOnboardingNick = async function(event) {
      if (event) event.preventDefault();
      if (!state.currentUser) return;
      const nick = (document.getElementById('onboard-nick')?.value || '').trim().replace(/^@+/, '');
      const pass = (document.getElementById('onboard-pass')?.value || '').trim();
      if (!/^[a-zA-Zа-яА-ЯёЁ0-9_]{3,10}$/.test(nick)) {
        showToast('Ник должен содержать от 3 до 10 символов', 'error');
        return;
      }
      if (pass.length < 4) {
        showToast('Пароль должен быть не короче 4 символов', 'error');
        return;
      }
      const taken = Object.values(state.usersMap).some(
        u => u && u.uid !== state.currentUser.uid && normalizeNick(u.nick) === normalizeNick(nick)
      );
      if (taken) {
        showToast('Этот никнейм уже занят', 'error');
        return;
      }
      const updated = { ...state.currentUser, nick, nickLower: normalizeNick(nick), password: pass };
      await update(ref(rtdb, `bc_users/${state.currentUser.uid}`), {
        nick,
        nickLower: normalizeNick(nick),
        password: pass
      });
      state.currentUser = updated;
      saveLocalSession(updated);
      state.onboardingStep = 'coach';
      renderApp();
    };

    window.selectOnboardingCoach = async function(coachId) {
      if (!state.currentUser) return;
      await update(ref(rtdb, `bc_users/${state.currentUser.uid}`), { coachId });
      state.currentUser = { ...state.currentUser, coachId };
      saveLocalSession(state.currentUser);
      state.onboardingStep = null;
      showToast('Тренер выбран!');
      renderApp();
    };

    window.handleLogout = async function() {
      if (state.currentUser?.uid) {
        try {
          await update(ref(rtdb, `bc_users/${state.currentUser.uid}`), { online: false, lastSeen: Date.now() });
        } catch (e) {}
      }
      try { await signOut(auth); } catch (e) {}
      state.currentUser = null;
      state.onboardingStep = null;
      saveLocalSession(null);
      window.navigate('/');
    };

    function setupPresence(uid) {
      if (!uid) return;
      const uRef = ref(rtdb, `bc_users/${uid}`);
      update(uRef, { online: true, lastSeen: Date.now() }).catch(() => {});
      try {
        onDisconnect(uRef).update({ online: false, lastSeen: Date.now() });
      } catch (e) {}
    }

    setInterval(() => {
      if (state.currentUser?.uid) {
        update(ref(rtdb, `bc_users/${state.currentUser.uid}`), { online: true, lastSeen: Date.now() }).catch(() => {});
      }
    }, 25000);

    window.adminUpdateBanSearch = function(val) {
      state.adminBanSearch = val;
      state.adminBanTargetUid = null;
      const q = normalizeNick(val);

    async function createMultiplayerGame(whiteUid, blackUid, timeControl, rated) {
      const gameRef = push(ref(rtdb, 'bc_games'));
      const gameId = gameRef.key;
      const initialSec = timeControl * 60;
      const gameObj = {
        id: gameId,
        mode: 'pvp',
        status: 'active',
        whiteUid,
        blackUid,
        timeControl,
        rated,
        fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
        moves: [],
        lastMove: null,
        whiteTimeMs: initialSec * 1000,
        blackTimeMs: initialSec * 1000,
        lastTurnTimestamp: Date.now(),
        createdAt: Date.now(),
        chat: {},
        fmPlayer: { playing: false, positionSec: 0, updatedAt: Date.now() }
      };
      await set(gameRef, gameObj);
      joinActiveGameListener(gameId);
    }

    // =========================================================================
    // ИГРА С БОТАМИ (МИНИМАКС + АЛЬФА-БЕТА ПОИСК)
    // =========================================================================
    const PIECE_VALS = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

    function evaluateBoard(chess) {
      if (chess.in_checkmate()) return chess.turn() === 'w' ? -99999 : 99999;
      if (chess.in_draw()) return 0;
      const board = chess.board();
      let score = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (!p) continue;
          const val = PIECE_VALS[p.type] || 0;
          const centerBonus = (3.5 - Math.abs(3.5 - r)) * 4 + (3.5 - Math.abs(3.5 - c)) * 4;
          score += p.color === 'w' ? (val + centerBonus) : -(val + centerBonus);
        }
      }
      return score;
    }

    function minimax(chess, depth, alpha, beta, isMaximizing) {
      if (depth === 0 || chess.game_over()) return evaluateBoard(chess);
      const moves = chess.moves({ verbose: true });
      if (isMaximizing) {
        let maxEval = -Infinity;
        for (const m of moves) {
          chess.move(m);
          const ev = minimax(chess, depth - 1, alpha, beta, false);
          chess.undo();
          if (ev > maxEval) maxEval = ev;
          if (ev > alpha) alpha = ev;
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const m of moves) {
          chess.move(m);
          const ev = minimax(chess, depth - 1, alpha, beta, true);
          chess.undo();
          if (ev < minEval) minEval = ev;
          if (ev < beta) beta = ev;
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function computeBotMove(fen, botConfig) {
      const chess = new Chess(fen);
      const moves = chess.moves({ verbose: true });
      if (moves.length === 0) return null;
      if (botConfig.randomness > 0 && Math.random() < botConfig.randomness) {
        return moves[Math.floor(Math.random() * moves.length)];
      }
      const isWhite = chess.turn() === 'w';
      let bestMove = moves[0];
      let bestScore = isWhite ? -Infinity : Infinity;
      for (const m of moves) {
        chess.move(m);
        const score = minimax(chess, botConfig.depth - 1, -Infinity, Infinity, !isWhite);
        chess.undo();
        if (isWhite ? score > bestScore : score < bestScore) {
          bestScore = score;
          bestMove = m;
        }
      }
      return bestMove;
    }

    // =========================================================================
    // УПРАВЛЕНИЕ АКТИВНОЙ ПАРТИЕЙ, ЧАСОМ И РЕЙТИНГОМ ЭЛО
    // =========================================================================
    function joinActiveGameListener(gameId) {
      if (unsubGame) unsubGame();
      state.activeGameId = gameId;
      state.replayMoveIndex = null;
      state.selectedSquare = null;
      state.legalTargets = [];
      state.showGameSummaryModal = false;

      unsubGame = onValue(ref(rtdb, `bc_games/${gameId}`), (snap) => {
        if (!snap.exists()) return;
        const g = snap.val();
        const prevStatus = state.activeGame?.status;
        state.activeGame = g;

        if (g.fmPlayer?.playing && !fmIsLocallyPlaying) {
          startFmSynthPlayback(g.fmPlayer.positionSec || 0);
        } else if (!g.fmPlayer?.playing && fmIsLocallyPlaying) {
          stopFmSynthPlayback();
        }

        if (prevStatus === 'active' && g.status === 'finished') {
          state.showGameSummaryModal = true;
          stopFmSynthPlayback();
        }

        if (!state.path.startsWith(`/game/${gameId}`)) {
          window.navigate(`/game/${gameId}`);
        } else {
          renderApp();
        }
      });

      startClockTicker();
    }

    function startClockTicker() {
      if (clockInterval) clearInterval(clockInterval);
      clockInterval = setInterval(async () => {
        const g = state.activeGame;
        if (!g || g.status !== 'active' || g.mode === 'bot' || g.unlimitedTime) return;
        const chess = new Chess(g.fen);
        const turn = chess.turn();
        const elapsed = Date.now() - (g.lastTurnTimestamp || Date.now());

        if (elapsed >= 30000) {
          const winner = turn === 'w' ? 'black' : 'white';
          await finishGameWithResult(g, winner, 'Бездействие более 30 секунд');
          return;
        }

        const rem = (turn === 'w' ? g.whiteTimeMs : g.blackTimeMs) - elapsed;
        if (rem <= 0) {
          const winner = turn === 'w' ? 'black' : 'white';
          await finishGameWithResult(g, winner, 'Время вышло');
          return;
        }

        const topClock = document.getElementById('clock-top');
        const botClock = document.getElementById('clock-bottom');
        if (topClock && botClock) {
          const amWhite = g.whiteUid === state.currentUser?.uid;
          const wNow = turn === 'w' ? Math.max(0, g.whiteTimeMs - elapsed) : g.whiteTimeMs;
          const bNow = turn === 'b' ? Math.max(0, g.blackTimeMs - elapsed) : g.blackTimeMs;
          botClock.textContent = formatMs(amWhite ? wNow : bNow);
          topClock.textContent = formatMs(amWhite ? bNow : wNow);
        }
      }, 250);
    }

    function formatMs(ms) {
      const totalSec = Math.max(0, Math.ceil(ms / 1000));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function calculateEloDelta(myElo, oppElo, score, gamesPlayed) {
      const expected = 1 / (1 + Math.pow(10, (oppElo - myElo) / 400));
      const isCalibration = gamesPlayed < 8;
      if (score === 1) {
        const baseWin = isCalibration ? 95 : 22;
        const upsetBonus = Math.max(0, Math.round((oppElo - myElo) / 14));
        const jitter = Math.floor(Math.random() * (isCalibration ? 45 : 9));
        return Math.min(isCalibration ? 195 : 48, Math.max(8, baseWin + upsetBonus + jitter));
      } else if (score === 0) {
        const baseLoss = isCalibration ? 65 : 20;
        const favPenalty = Math.max(0, Math.round((myElo - oppElo) / 16));
        const jitter = Math.floor(Math.random() * (isCalibration ? 25 : 7));
        return -Math.min(isCalibration ? 140 : 45, Math.max(7, baseLoss + favPenalty + jitter));
      }
      return Math.round((isCalibration ? 40 : 12) * (0.5 - expected));
    }

    function computeBotThinkDelayMs(fen, botCfg) {
      const chess = new Chess(fen);
      const legalCount = chess.moves().length;
      const inCheck = chess.in_check();
      const baseByBot = {
        larry: 500,
        goblin: 950,
        mittens: 1500,
        boris: 2300
      };
      const base = baseByBot[botCfg.id] || 1000;
      const complexityFactor = Math.min(1800, legalCount * 38) + (inCheck ? 450 : 0);
      const variance = Math.floor(Math.random() * 750);
      return base + complexityFactor + variance;
    }

    async function finishGameWithResult(g, winnerSide, reasonText) {
      if (!g || g.status !== 'active') return;
      const movesArr = Array.isArray(g.moves) ? g.moves : [];
      const brilliant = Math.min(3, Math.floor(movesArr.length / 18));
      const best = Math.max(1, Math.floor(movesArr.length / 4));
      const good = Math.max(1, Math.floor(movesArr.length / 3));
      const durationSec = Math.max(1, Math.round((Date.now() - (g.createdAt || Date.now())) / 1000));

      let whiteDelta = 0;
      let blackDelta = 0;
      const wUser = state.usersMap[g.whiteUid];
      const bUser = state.usersMap[g.blackUid];

      if (g.rated && g.mode === 'pvp' && wUser && bUser) {
        const tc = g.timeControl || 10;
        const wElo = getUserRatingForTime(wUser, tc);
        const bElo = getUserRatingForTime(bUser, tc);
        const wScore = winnerSide === 'white' ? 1 : (winnerSide === 'draw' ? 0.5 : 0);
        const bScore = 1 - wScore;
        whiteDelta = calculateEloDelta(wElo, bElo, wScore, wUser.gamesPlayed || 0);
        blackDelta = calculateEloDelta(bElo, wElo, bScore, bUser.gamesPlayed || 0);

        await update(ref(rtdb), {
          [`bc_users/${wUser.uid}/elo${tc}`]: Math.max(100, wElo + whiteDelta),
          [`bc_users/${wUser.uid}/gamesPlayed`]: (wUser.gamesPlayed || 0) + 1,
          [`bc_users/${bUser.uid}/elo${tc}`]: Math.max(100, bElo + blackDelta),
          [`bc_users/${bUser.uid}/gamesPlayed`]: (bUser.gamesPlayed || 0) + 1
        });
      }

      const summary = {
        winner: winnerSide,
        reason: reasonText,
        brilliant,
        best,
        good,
        durationSec,
        whiteDelta,
        blackDelta
      };

      await update(ref(rtdb, `bc_games/${g.id}`), {
        status: 'finished',
        summary
      });

      const archiveRecord = {
        gameId: g.id,
        whiteUid: g.whiteUid,
        blackUid: g.blackUid,
        whiteNick: wUser?.nick || 'Игрок',
        blackNick: g.mode === 'bot' ? (BOTS.find(b => b.id === g.botId)?.name || 'Бот') : (bUser?.nick || 'Игрок'),
        winner: winnerSide,
        timeControl: g.timeControl,
        moves: movesArr,
        createdAt: Date.now()
      };

      if (wUser) await set(ref(rtdb, `bc_archives/${wUser.uid}/${g.id}`), archiveRecord);
      if (bUser) await set(ref(rtdb, `bc_archives/${bUser.uid}/${g.id}`), archiveRecord);
    }

    window.handleSquareClick = function(sq) {
      const g = state.activeGame;
      if (!g || g.status !== 'active' || state.replayMoveIndex !== null) return;
      const chess = new Chess(g.fen);
      const amWhite = g.whiteUid === state.currentUser?.uid;
      const myColor = amWhite ? 'w' : 'b';
      if (chess.turn() !== myColor) return;

      if (state.selectedSquare) {
        if (state.legalTargets.includes(sq)) {
          executePlayerMove(state.selectedSquare, sq);
          return;
        }
      }

      const piece = chess.get(sq);
      if (piece && piece.color === myColor) {
        state.selectedSquare = sq;
        state.legalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to);
      } else {
        state.selectedSquare = null;
        state.legalTargets = [];
      }
      renderApp();
    };

    window.handlePieceDragStart = function(ev, sq) {
      state.dragFromSquare = sq;
      state.selectedSquare = sq;
      const g = state.activeGame;
      if (g) {
        const chess = new Chess(g.fen);
        state.legalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to);
      }
      if (ev.dataTransfer) ev.dataTransfer.setData('text/plain', sq);
    };

    window.handleSquareDrop = function(ev, targetSq) {
      ev.preventDefault();
      const fromSq = state.dragFromSquare || ev.dataTransfer?.getData('text/plain');
      state.dragFromSquare = null;
      if (fromSq && fromSq !== targetSq) {
        executePlayerMove(fromSq, targetSq);
      }
    };

    async function executePlayerMove(fromSq, toSq) {
      const g = state.activeGame;
      if (!g || g.status !== 'active') return;
      const chess = new Chess(g.fen);
      const amWhite = g.whiteUid === state.currentUser?.uid;
      const myColor = amWhite ? 'w' : 'b';
      if (chess.turn() !== myColor) return;

      const moveRes = chess.move({ from: fromSq, to: toSq, promotion: 'q' });
      if (!moveRes) {
        state.selectedSquare = null;
        state.legalTargets = [];
        renderApp();
        return;
      }

      const now = Date.now();
      const elapsed = now - (g.lastTurnTimestamp || now);
      const newWhiteMs = amWhite ? Math.max(0, g.whiteTimeMs - elapsed) : g.whiteTimeMs;
      const newBlackMs = !amWhite ? Math.max(0, g.blackTimeMs - elapsed) : g.blackTimeMs;
      const prevMoves = Array.isArray(g.moves) ? g.moves : [];
      const nextMoves = [...prevMoves, { from: fromSq, to: toSq, san: moveRes.san, fen: chess.fen() }];

      state.selectedSquare = null;
      state.legalTargets = [];

      await update(ref(rtdb, `bc_games/${g.id}`), {
        fen: chess.fen(),
        moves: nextMoves,
        lastMove: { from: fromSq, to: toSq },
        whiteTimeMs: newWhiteMs,
        blackTimeMs: newBlackMs,
        lastTurnTimestamp: now
      });

      if (chess.game_over()) {
        const winner = chess.in_checkmate() ? (amWhite ? 'white' : 'black') : 'draw';
        const reason = chess.in_checkmate() ? 'Мат' : 'Ничья';
        await finishGameWithResult({ ...g, moves: nextMoves }, winner, reason);
        return;
      }

      if (g.mode === 'bot') {
        const botCfg = BOTS.find(b => b.id === g.botId) || BOTS[0];
        const thinkMs = computeBotThinkDelayMs(chess.fen(), botCfg);
        state.botThinking = true;
        renderApp();
        setTimeout(async () => {
          state.botThinking = false;
          const freshSnap = await get(ref(rtdb, `bc_games/${g.id}`));
          if (!freshSnap.exists()) return;
          const fg = freshSnap.val();
          if (fg.status !== 'active') return;
          const bChess = new Chess(fg.fen);
          if (bChess.turn() !== 'b') return;
          const botMove = computeBotMove(fg.fen, botCfg);
          if (!botMove) return;
          bChess.move(botMove);
          const bMoves = [...(Array.isArray(fg.moves) ? fg.moves : []), { from: botMove.from, to: botMove.to, san: botMove.san, fen: bChess.fen() }];
          await update(ref(rtdb, `bc_games/${g.id}`), {
            fen: bChess.fen(),
            moves: bMoves,
            lastMove: { from: botMove.from, to: botMove.to },
            lastTurnTimestamp: Date.now()
          });
          if (bChess.game_over()) {
            const w = bChess.in_checkmate() ? 'black' : 'draw';
            await finishGameWithResult({ ...fg, moves: bMoves }, w, bChess.in_checkmate() ? 'Мат' : 'Ничья');
          }
        }, thinkMs);
      }
    }

    window.sendGameChatMessage = async function(event) {
      if (event) event.preventDefault();
      const g = state.activeGame;
      if (!g || !state.currentUser) return;
      const inp = document.getElementById('game-chat-input');

      inp.value = '';
      const msgRef = push(ref(rtdb, `bc_games/${g.id}/chat`));

    window.resignActiveGame = async function() {
      const g = state.activeGame;
      if (!g || g.status !== 'active') return;
      const amWhite = g.whiteUid === state.currentUser?.uid;
      await finishGameWithResult(g, amWhite ? 'black' : 'white', 'Сдача');

    window.rematchCurrentOpponent = async function() {
      const g = state.activeGame;
      if (!g || !state.currentUser) return;
      state.showGameSummaryModal = false;
      if (g.mode === 'bot') {
        await window.startBotGame(g.botId || state.selectedBotId || 'larry');
        return;
      }
      const oppUid = g.whiteUid === state.currentUser.uid ? g.blackUid : g.whiteUid;
      const oppUser = state.usersMap[oppUid];
      if (!oppUser || !isUserOnline(oppUser)) {
        showToast('Противник сейчас не в сети', 'error');
        return;
      }
      const rmRef = push(ref(rtdb, 'bc_rematches'));
      await set(rmRef, {
        id: rmRef.key,
        fromUid: state.currentUser.uid,
        fromNick: state.currentUser.nick,
        toUid: oppUid,
        timeControl: g.timeControl || 10,
        rated: Boolean(g.rated),
        status: 'pending',
        createdAt: Date.now()

      showToast(`Запрос на реванш отправлен игроку ${oppUser.nick}!`);

    window.acceptRematch = async function(rmId) {
      const snap = await get(ref(rtdb, `bc_rematches/${rmId}`));
      if (!snap.exists()) return;
      const rm = snap.val();
      await remove(ref(rtdb, `bc_rematches/${rmId}`));
      const whiteIsSender = Math.random() < 0.5;
      await createMultiplayerGame(
        whiteIsSender ? rm.fromUid : rm.toUid,
        whiteIsSender ? rm.toUid : rm.fromUid,
        rm.timeControl || 10,
        Boolean(rm.rated)
      );
    };

    window.declineRematch = async function(rmId) {
      await remove(ref(rtdb, `bc_rematches/${rmId}`));
    };

    window.stepReplayMove = function(action) {
      const g = state.activeGame;
      if (!g) return;
      const moves = Array.isArray(g.moves) ? g.moves : [];
      if (moves.length === 0) return;
      const maxIdx = moves.length - 1;
      let cur = state.replayMoveIndex === null ? maxIdx : state.replayMoveIndex;
      if (action === 'first') cur = -1;
      else if (action === 'prev') cur = Math.max(-1, cur - 1);
      else if (action === 'next') cur = Math.min(maxIdx, cur + 1);
      else if (action === 'last') cur = maxIdx;
      state.replayMoveIndex = cur === maxIdx ? null : cur;
      renderApp();
    };

    window.addEventListener('keydown', (e) => {
      if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
      if (state.activeGame && state.path.startsWith('/game/')) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); window.stepReplayMove('prev'); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); window.stepReplayMove('next'); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); window.stepReplayMove('first'); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); window.stepReplayMove('last'); }
      }
    });

    window.selectLesson = function(lessonId) {
      const lesson = LESSONS.find(l => l.id === Number(lessonId)) || LESSONS[0];
      state.selectedLessonId = lesson.id;
      state.lessonFen = lesson.fen;
      state.lessonStatus = 'neutral';

      state.selectedSquare = null;
      state.legalTargets = [];
      renderApp();
    };

    window.handleLessonSquareClick = function(sq) {
      const lesson = LESSONS.find(l => l.id === state.selectedLessonId) || LESSONS[0];
      const chess = new Chess(state.lessonFen);
      if (state.selectedSquare) {
        const move = chess.move({ from: state.selectedSquare, to: sq, promotion: 'q' });
        if (move) {
          const uci = move.from + move.to;
          if (lesson.expected.includes(uci)) {
            state.lessonFen = chess.fen();
            state.lessonStatus = 'ok';
            state.lessonMessage = 'Отлично! Правильный ход выполнен.';
          } else {
            state.lessonStatus = 'error';
            state.lessonMessage = `Ошибка! Ход ${move.san} не подходит. Попробуйте снова: ${lesson.hint}`;
          }
          state.selectedSquare = null;
          state.legalTargets = [];
          renderApp();
          return;
        }
      }
      const p = chess.get(sq);
      if (p && p.color === chess.turn()) {
        state.selectedSquare = sq;
        state.legalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to);
      } else {
        state.selectedSquare = null;
        state.legalTargets = [];
      }
      renderApp();
    };

    window.saveUserSettings = async function(event) {
      if (event) event.preventDefault();
      if (!state.currentUser) return;
      const newNick = (document.getElementById('settings-nick')?.value || '').trim().replace(/^@+/, '');
      const boardStyle = document.getElementById('settings-board-style')?.value || 'green';
      const coachId = document.getElementById('settings-coach-id')?.value || state.currentUser.coachId || 'matti';
      const publicArchive = Boolean(document.getElementById('settings-public-archive')?.checked);

      if (!isCurrentUserAdmin() && !/^[a-zA-Zа-яА-ЯёЁ0-9_]{3,10}$/.test(newNick)) {
        showToast('Ник должен содержать от 3 до 10 символов', 'error');
        return;
      }

      const taken = Object.values(state.usersMap).some(
        u => u && u.uid !== state.currentUser.uid && normalizeNick(u.nick) === normalizeNick(newNick)
      );
      if (taken) {
        showToast('Этот никнейм уже занят другим игроком', 'error');
        return;
      }

      const patch = {
        nick: newNick,
        nickLower: normalizeNick(newNick),
        boardStyle,
        coachId,
        publicArchive
      };
      await update(ref(rtdb, `bc_users/${state.currentUser.uid}`), patch);
      state.currentUser = { ...state.currentUser, ...patch };
      saveLocalSession(state.currentUser);
      showToast('Настройки сохранены!');
      renderApp();
    };

    function renderChessBoard({ fen, flipped = false, lastMove = null, onClickFnName = 'handleSquareClick', draggable = true }) {
      const chess = new Chess(fen);
      const board = chess.board();
      const boardStyle = state.currentUser?.boardStyle || 'green';
      const lightColor = boardStyle === 'wood' ? '#f0d9b5' : '#ebecd0';
      const darkColor = boardStyle === 'wood' ? '#b58863' : '#739552';

      const rows = flipped ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
      const cols = flipped ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

      let html = `<div class="board-grid border border-grayBorder">`;
      for (const r of rows) {
        for (const c of cols) {
          const sqName = `${files[c]}${8 - r}`;
          const isLight = (r + c) % 2 === 0;
          const isLastFrom = lastMove?.from === sqName;
          const isLastTo = lastMove?.to === sqName;
          const isSelected = state.selectedSquare === sqName;
          const isTarget = state.legalTargets.includes(sqName);
          const piece = board[r][c];

          let bg = isLight ? lightColor : darkColor;
          if (isSelected || isLastFrom || isLastTo) {
            bg = isLight ? '#f5f682' : '#b9ca43';
          }

          const pieceKey = piece ? `${piece.color}${piece.type.toUpperCase()}` : null;
          html += `
            <div onclick="window.${onClickFnName}('${sqName}')"
                 ondragover="event.preventDefault()"
                 ondrop="window.handleSquareDrop(event, '${sqName}')"
                 style="background-color:${bg}"
                 class="sq-cell">
              ${pieceKey ? `<div draggable="${draggable}" ondragstart="window.handlePieceDragStart(event, '${sqName}')" class="w-full h-full flex items-center justify-center">${PIECE_SVGS[pieceKey]}</div>` : ''}
              ${isTarget && !piece ? `<div class="move-dot"></div>` : ''}
              ${isTarget && piece ? `<div class="capture-ring"></div>` : ''}
            </div>
          `;
        }
      }
      html += `</div>`;
      return html;
    }

    window.openArchivedGame = function(uid, gameId) {
      const rec = state.userArchives[uid]?.[gameId];
      if (!rec) return;
      const moves = Array.isArray(rec.moves) ? rec.moves : [];
      const lastFen = moves.length > 0 ? moves[moves.length - 1].fen : 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
      state.activeGameId = gameId;
      state.activeGame = {
        id: gameId,
        mode: 'archive',
        status: 'finished',
        whiteUid: rec.whiteUid,
        blackUid: rec.blackUid,
        timeControl: rec.timeControl,
        fen: lastFen,
        moves,
        whiteTimeMs: 0,
        blackTimeMs: 0
      };
      state.replayMoveIndex = null;
      window.navigate(`/game/${gameId}`);
    };

                       placeholder="Начните вводить ник игрока..."
                       class="w-full bg-grayNav border border-grayBorder rounded-xl px-3 py-2 text-xs text-white focus:outline-none" />
                ${eloSuggestions.length > 0 && !state.adminEloTargetUid ? `
                  <div class="rounded-xl bg-grayNav border border-grayBorder divide-y divide-grayBorder">
                    ${eloSuggestions.map(item => `
                      <button type="button" onclick="window.adminSelectEloTarget('${escapeJsAttr(item.uid)}', '${escapeJsAttr(item.nick)}')"
                              class="w-full text-left px-3 py-2 text-xs hover:bg-grayHover text-white cursor-pointer flex items-center justify-between">
                        <span>${renderTitleBadge(item)} <b>${escapeHtml(item.nick)}</b></span>
                        <span class="text-tealAccent">${getUserRatingForTime(item, 10)} Эло</span>
                      </button>
                    `).join('')}
                  </div>
                ` : ''}
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <input id="admin-elo-val" type="number" min="100" max="9999" required placeholder="Новое Эло (напр. 1500)"
                         class="bg-grayNav border border-grayBorder rounded-xl px-3 py-2 text-xs text-white focus:outline-none" />
                  <select id="admin-elo-tc" class="bg-grayNav border border-grayBorder rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                    <option value="all">Все режимы (10/3/1)</option>
                    <option value="10">Только 10 мин</option>
                    <option value="3">Только 3 мин</option>
                    <option value="1">Только 1 мин</option>
                  </select>
                  <button type="submit" class="px-4 py-2 rounded-xl bg-tealAccent text-black text-xs font-extrabold cursor-pointer">
                    Установить Эло
                  </button>
                </div>
              </form>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderBannedScreen(banInfo) {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-grayBase">
          <div class="max-w-md w-full rounded-2xl bg-grayNav border-2 border-red-600 p-7 text-center space-y-4 shadow-2xl">
            <div class="text-4xl">🚫</div>
            <h1 class="text-2xl font-black text-red-400">Вы забанены!</h1>
            <p class="text-sm text-gray-200">Причина: <b>${escapeHtml(banInfo.reason)}</b></p>
            <p class="text-xs text-gray-400">Срок блокировки: <b>${formatBanDuration(banInfo.expiresAt)}</b></p>
            <button type="button" onclick="window.handleLogout()" class="px-4 py-2 rounded-xl bg-grayCard text-xs font-bold text-gray-300 cursor-pointer">
              Выйти из аккаунта
            </button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // ГЛАВНАЯ ФУНКЦИЯ ОТРИСОВКИ ПРИЛОЖЕНИЯ
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      const u = state.currentUser;
      if (u) {
        const activeBan = getActiveBan(u.uid);
        if (activeBan) {
          root.innerHTML = renderBannedScreen(activeBan);
          return;
        }
      }

      let mainHtml = '';
      const p = state.path || '/';

      if (!u) {
        mainHtml = renderAuthScreen();
      } else if (state.onboardingStep) {
        mainHtml = renderOnboardingScreen();
      } else if (p === '/play') {
        mainHtml = renderPlayLobbyScreen();
      } else if (p.startsWith('/game/')) {
        mainHtml = renderActiveGameScreen();
      } else if (p === '/courses') {
        mainHtml = renderCoursesScreen();
      } else if (p === '/bots') {
        mainHtml = renderBotsScreen();
      } else if (p === '/settings') {
        mainHtml = renderSettingsScreen();
      } else if (p.startsWith('/@')) {
        mainHtml = renderProfileScreen(decodeURIComponent(p.slice(2)));
      } else {
        mainHtml = renderHomeScreen();
      }

      root.innerHTML = `
        ${renderTopBar()}
        <main class="flex-1 px-4 py-4">
          ${mainHtml}
        </main>
      `;
    }

    window.renderApp = renderApp;

    const cachedUser = loadLocalSession();
    if (cachedUser) {
      state.currentUser = cachedUser;
      if (!cachedUser.nick) state.onboardingStep = 'nick';
      else if (!cachedUser.coachId) state.onboardingStep = 'coach';
    }

    onAuthStateChanged(auth, async (fbUser) => {
      if (fbUser) {
        const snap = await get(ref(rtdb, `bc_users/${fbUser.uid}`));
        if (snap.exists()) {
          state.currentUser = snap.val();
          saveLocalSession(state.currentUser);
          setupPresence(fbUser.uid);
          if (!state.currentUser.nick) state.onboardingStep = 'nick';
          else if (!state.currentUser.coachId) state.onboardingStep = 'coach';
          else state.onboardingStep = null;
        }
      }
      renderApp();
    });

    initRealtimeListeners();
    renderApp();
  </script>
</body>
</html>
