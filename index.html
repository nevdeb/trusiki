    * { box-sizing: border-box; }
    body {

      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      aspect-ratio: 1 / 1;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .sq-green-light { background-color: #ebecd0; }
    .sq-green-dark  { background-color: #779556; }
    .sq-wood-light  { background-color: #f0d9b5; }
    .sq-wood-dark   { background-color: #b58863; }

    .sq-last-move {
      box-shadow: inset 0 0 0 999px rgba(246, 246, 105, 0.52) !important;
    }
    .sq-selected {
      box-shadow: inset 0 0 0 999px rgba(45, 212, 191, 0.45) !important;
    }
    .sq-check {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.9) 0%, rgba(220, 38, 38, 0.55) 55%, transparent 80%) !important;
    }
    .legal-dot {
      width: 30%;
      height: 30%;
      border-radius: 9999px;
      background-color: rgba(0, 0, 0, 0.22);
      pointer-events: none;
    }
    .legal-capture {
      width: 84%;
      height: 84%;
      border-radius: 9999px;
      border: 4px solid rgba(0, 0, 0, 0.24);
      pointer-events: none;
    }
    .piece-svg {
      width: 84%;
      height: 84%;
      pointer-events: none;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.35));
      transition: transform 0.08s ease;
    }
    .drag-ghost {
      position: fixed;
      width: 68px;
      height: 68px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(1.12);
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.55));
    }
    .title-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #b91c1c;
      color: #ffffff;
      font-weight: 800;
      font-size: 11px;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 4px;
      letter-spacing: 0.03em;
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1b1d1e; }
    ::-webkit-scrollbar-thumb { background: #3a3e42; border-radius: 9999px; }

    let audioCtx = null;
    function getAudioContext() {

        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {

      }
      return audioCtx;
    }

    function playChessMoveSound(isCapture = false) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = isCapture ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(isCapture ? 210 : 155, now);
        osc.frequency.exponentialRampToValueAtTime(52, now + 0.085);

        gain.gain.setValueAtTime(0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.095);
      } catch (e) {}
    }

    let fmLocalState = {
      playing: false,
      trackId: 0,
      positionSec: 0,
      step: 0

    function syncLocalFmAudio(playerData) {
      if (!playerData) {
        stopFmSynth();
        return;
      }
      const track = FM_TRACKS[playerData.trackId] || FM_TRACKS[0];
      const elapsed = playerData.playing ? (Date.now() - (playerData.updatedAt || Date.now())) / 1000 : 0;
      fmLocalState.positionSec = Math.min(track.duration, Math.floor((playerData.positionSec || 0) + elapsed));
      fmLocalState.trackId = track.id;

      if (playerData.playing && !fmSynthTimer) {
        fmLocalState.playing = true;
        const stepMs = Math.round(60000 / track.bpm / 2);
        fmSynthTimer = setInterval(() => {
          const curTrack = FM_TRACKS[fmLocalState.trackId] || FM_TRACKS[0];
          fmLocalState.positionSec = (fmLocalState.positionSec + stepMs / 1000) % curTrack.duration;
          const timeEl = document.getElementById('fm-time-label');
          const rangeEl = document.getElementById('fm-seek-slider');
          if (timeEl) timeEl.textContent = `${formatClock(Math.floor(fmLocalState.positionSec))} / ${formatClock(curTrack.duration)}`;
          if (rangeEl) rangeEl.value = Math.floor(fmLocalState.positionSec);

          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const freq = curTrack.notes[fmLocalState.step % curTrack.notes.length];
            fmLocalState.step++;
            osc.type = fmLocalState.step % 4 === 0 ? 'sawtooth' : 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.17);
          } catch (e) {}
        }, stepMs);
      } else if (!playerData.playing && fmSynthTimer) {
        stopFmSynth();
      }
    }

    function stopFmSynth() {
      if (fmSynthTimer) {
        clearInterval(fmSynthTimer);
        fmSynthTimer = null;
      }
      fmLocalState.playing = false;

    function normalizeNick(str) {
      return String(str || '').trim().toLowerCase();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeJsAttr(str) {
      return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function formatClock(sec) {
      const s = Math.max(0, Math.floor(Number(sec) || 0));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

    function isUserOnline(u) {
      if (!u) return false;
      if (u.online === true && Date.now() - (u.lastSeen || 0) < 90000) return true;
      return Date.now() - (u.lastSeen || 0) < 45000;
    }

      } catch (e) {}

        if (state.currentUser?.uid === uid) {

    window.submitOnboardingProfile = async function(event) {
      if (event) event.preventDefault();
      const nick = (document.getElementById('onboard-nick')?.value || '').trim();

      if (!/^[a-zA-Zа-яА-Я0-9_]{3,10}$/.test(nick)) {
        showToast('Ник должен содержать от 3 до 10 символов (буквы/цифры)', 'error');
        return;

      if (password.length < 4) {
        showToast('Придумайте пароль (минимум 4 символа)', 'error');
        return;

      const snap = await get(ref(rtdb, 'bc_users'));
      const all = snap.val() || {};
      const taken = Object.values(all).some(u => u && normalizeNick(u.nick) === normalizeNick(nick));
      if (taken) {
        showToast('Этот никнейм уже занят другим игроком!', 'error');
        return;
      }

      const uid = auth.currentUser?.uid || state.currentUser.uid;
      const resolvedEmail = auth.currentUser?.email || state.currentUser.email || '';
      const profile = {
        uid,
        email: resolvedEmail,
        nick,
        password,
        elo_10: 500,
        elo_3: 500,
        elo_1: 500,
        gamesPlayed: 0,
        boardTheme: 'green',
        publicArchive: true,
        coachId: '',
        titles: {},
        friends: {},
        completedLessons: {},
        online: true,
        lastSeen: Date.now()
      };
      await set(ref(rtdb, `bc_users/${uid}`), profile);
      state.usersMap[uid] = profile;
      state.currentUser = profile;
      state.onboardingStep = 'coach';
      saveLocalSession(profile);
      setupPresence(uid);
      renderApp();

    // =========================================================================
    // ПОДПИСКИ REALTIME DATABASE (ПОЛЬЗОВАТЕЛИ, БАНЫ, ОЧЕРЕДЬ, ВЫЗОВЫ, ЗАПРОСЫ)
    // =========================================================================
    function initRealtimeListeners() {
      onValue(ref(rtdb, 'bc_users'), (snap) => {
        const data = snap.val() || {};
        state.usersMap = data;
        if (state.currentUser && state.onboardingStep !== 'profile') {
          const myRec = data[state.currentUser.uid];
          // Если аккаунт был удалён администратором — мгновенно выкидываем пользователя
          if (!myRec && Object.keys(data).length > 0) {
            state.currentUser = null;
            state.onboardingStep = null;
            saveLocalSession(null);
            showToast('Ваш аккаунт был удалён администратором', 'error');
            renderApp();
            return;
          }
          if (myRec) {
            state.currentUser = { ...state.currentUser, ...myRec };
          }
        }
        renderApp();
      });

      onValue(ref(rtdb, 'bc_bans'), (snap) => {
        state.bansMap = snap.val() || {};
        renderApp();
      });

      onValue(ref(rtdb, 'bc_site_settings'), (snap) => {
        const val = snap.val() || { maintenance: false };
        state.siteSettings = val;
        renderApp();
      });

      onValue(ref(rtdb, 'bc_queue'), (snap) => {
        state.queueMap = snap.val() || {};
        if (state.inQueue && state.currentUser) {
          tryMatchmakingFromQueue();
        }
        if (state.route === '/play') renderApp();
      });

      onValue(ref(rtdb, 'bc_user_active_game'), (snap) => {
        if (!state.currentUser) return;
        const map = snap.val() || {};
        const gameId = map[state.currentUser.uid];
        if (gameId && !handledGameRedirects.has(gameId)) {
          handledGameRedirects.add(gameId);
          state.inQueue = false;
          state.queueKey = null;
          remove(ref(rtdb, `bc_user_active_game/${state.currentUser.uid}`)).catch(() => {});
          window.navigate(`/game/${gameId}`);
        }
      });

      onValue(ref(rtdb, 'bc_challenges'), (snap) => {
        if (!state.currentUser) return;
        const all = snap.val() || {};
        Object.values(all).forEach(ch => {
          if (ch && ch.toUid === state.currentUser.uid && ch.status === 'pending' && !shownChallengePopups.has(ch.id)) {
            shownChallengePopups.add(ch.id);
            showChallengePopup(ch);
          }
        });
      });

      onValue(ref(rtdb, 'bc_friend_requests'), (snap) => {
        state.friendRequestsMap = snap.val() || {};
        if (!state.currentUser) return;
        Object.values(state.friendRequestsMap).forEach(req => {
          if (req && req.toUid === state.currentUser.uid && req.status === 'pending' && !shownFriendReqPopups.has(req.id)) {
            shownFriendReqPopups.add(req.id);
            showFriendRequestPopup(req);
          }
        });
        if (state.searchPopoverOpen) renderApp();
      });

    // =========================================================================

    window.startMatchmaking = async function() {
      if (!state.currentUser) return;
      const tc = Number(state.selectedTimeControl) || 10;
      const rated = Boolean(state.selectedRated);
      const myUid = state.currentUser.uid;

      // Проверяем существующую очередь сразу
      const qSnap = await get(ref(rtdb, 'bc_queue'));
      const qAll = qSnap.val() || {};
      const match = Object.values(qAll).find(item =>
        item &&
        item.uid !== myUid &&
        Number(item.timeControl) === tc &&
        Boolean(item.rated) === rated &&
        Date.now() - (item.createdAt || 0) < 120000
      );

      if (match) {
        await remove(ref(rtdb, `bc_queue/${match.key}`)).catch(() => {});
        await createOnlineChessGame(match.uid, myUid, tc, rated, 'pvp');
        return;
      }

      const qRef = push(ref(rtdb, 'bc_queue'));
      state.inQueue = true;
      state.queueKey = qRef.key;
      await set(qRef, {
        key: qRef.key,
        uid: myUid,
        nick: state.currentUser.nick,
        timeControl: tc,
        rated,
        createdAt: Date.now()
      });
      renderApp();
    };

    window.cancelMatchmaking = async function() {
      if (state.queueKey) {
        await remove(ref(rtdb, `bc_queue/${state.queueKey}`)).catch(() => {});
      }
      state.inQueue = false;
      state.queueKey = null;
      renderApp();
    };

    async function tryMatchmakingFromQueue() {
      if (!state.inQueue || !state.currentUser || !state.queueKey) return;
      const myUid = state.currentUser.uid;
      const tc = Number(state.selectedTimeControl) || 10;
      const rated = Boolean(state.selectedRated);
      const candidates = Object.values(state.queueMap).filter(item =>
        item &&
        item.uid !== myUid &&
        Number(item.timeControl) === tc &&
        Boolean(item.rated) === rated &&
        Date.now() - (item.createdAt || 0) < 120000
      );
      if (!candidates.length) return;
      // Чтобы оба игрока не создали 2 партии одновременно, партию создаёт игрок с лексикографически меньшим UID
      const opp = candidates[0];
      if (myUid < opp.uid) {
        await remove(ref(rtdb, `bc_queue/${state.queueKey}`)).catch(() => {});
        await remove(ref(rtdb, `bc_queue/${opp.key}`)).catch(() => {});
        state.inQueue = false;
        state.queueKey = null;
        await createOnlineChessGame(myUid, opp.uid, tc, rated, 'pvp');
      }
    }

    async function createOnlineChessGame(whiteUid, blackUid, timeControl, rated, mode = 'pvp', botId = null) {
      const wUser = state.usersMap[whiteUid] || { nick: 'White', elo_10: 500, elo_3: 500, elo_1: 500 };
      const bUser = mode === 'bot'
        ? (BOTS.find(b => b.id === botId) || BOTS[0])
        : (state.usersMap[blackUid] || { nick: 'Black', elo_10: 500, elo_3: 500, elo_1: 500 });

      const gameRef = push(ref(rtdb, 'bc_games'));
      const gameId = gameRef.key;
      const startSec = Number(timeControl) * 60;
      const initialFen = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";

      const gameObj = {
        id: gameId,
        mode,
        botId: botId || null,
        status: 'active',
        timeControl: Number(timeControl),
        rated: mode === 'bot' ? false : Boolean(rated),
        whiteUid,
        whiteNick: wUser.nick,
        whiteElo: wUser[`elo_${timeControl}`] || 500,
        blackUid: mode === 'bot' ? `bot_${bUser.id}` : blackUid,
        blackNick: mode === 'bot' ? bUser.name : bUser.nick,
        blackElo: mode === 'bot' ? bUser.elo : (bUser[`elo_${timeControl}`] || 500),
        fen: initialFen,
        turn: 'w',
        whiteTime: startSec,
        blackTime: startSec,
        createdAt: Date.now(),
        lastMoveAt: Date.now(),
        moves: [],
        chat: [],
        fmPlayer: { playing: false, trackId: 0, positionSec: 0, updatedAt: Date.now() }
      };

      await set(gameRef, gameObj);
      if (mode !== 'bot') {
        await update(ref(rtdb), {
          [`bc_user_active_game/${whiteUid}`]: gameId,
          [`bc_user_active_game/${blackUid}`]: gameId
        });
      }
      handledGameRedirects.add(gameId);
      window.navigate(`/game/${gameId}`);
    }

    // =========================================================================
    // ЛОГИКА ШАХМАТНОЙ ПАРТИИ, МАТОВ, НИЧЬИХ, БОТОВ И ЧАТА
    // =========================================================================
    function subscribeToGame(gameId) {
      if (activeGameUnsub) {
        activeGameUnsub();
        activeGameUnsub = null;
      }
      if (clockInterval) {
        clearInterval(clockInterval);
        clockInterval = null;
      }
      if (botMoveTimeout) {
        clearTimeout(botMoveTimeout);
        botMoveTimeout = null;
      }
      stopFmSynth();
      state.activeGameId = gameId;
      state.viewMoveIndex = -1;
      state.selectedSquare = null;
      lastSoundMoveCount = -1;

      activeGameUnsub = onValue(ref(rtdb, `bc_games/${gameId}`), (snap) => {
        if (!snap.exists()) return;
        const g = snap.val();
        state.activeGame = g;

        const movesArr = Array.isArray(g.moves) ? g.moves : Object.values(g.moves || {});
        if (lastSoundMoveCount !== -1 && movesArr.length > lastSoundMoveCount) {
          const lastM = movesArr[movesArr.length - 1];
          playChessMoveSound(Boolean(lastM && lastM.captured));
        }
        lastSoundMoveCount = movesArr.length;

        // Проверка окончания партии (мат, пат, троекратное повторение, недостаток фигур)
        if (g.status === 'active' && g.fen) {
          try {
            const verifyChess = new Chess(g.fen);
            const posKey = g.fen.split(' ')[0];
            const repeatCount = movesArr.filter(m => m && m.fen && m.fen.split(' ')[0] === posKey).length;
            if (verifyChess.in_checkmate()) {
              const winner = verifyChess.turn() === 'w' ? 'black' : 'white';
              finishGameWithResult(g, winner, 'Мат');
            } else if (verifyChess.in_stalemate()) {
              finishGameWithResult(g, 'draw', 'Пат (ничья)');
            } else if (verifyChess.insufficient_material()) {
              finishGameWithResult(g, 'draw', 'Недостаточно фигур для мата (ничья)');
            } else if (verifyChess.in_threefold_repetition() || repeatCount >= 3) {
              finishGameWithResult(g, 'draw', 'Троекратное повторение позиции (ничья)');
            } else if (verifyChess.in_draw() && movesArr.length > 0) {
              finishGameWithResult(g, 'draw', 'Ничья');
            }
          } catch (e) {}
        }

        syncLocalFmAudio(g.fmPlayer);

        if (g.status === 'active' && g.mode === 'bot' && g.turn === 'b' && !state.botIsThinking) {
          triggerBotTurn(g);
        }
        renderApp();
      });

      clockInterval = setInterval(() => {
        const g = state.activeGame;
        if (!g || g.status !== 'active' || g.mode === 'bot') return;
        const now = Date.now();
        const elapsedSinceMove = (now - (g.lastMoveAt || now)) / 1000;
        const movesArr = Array.isArray(g.moves) ? g.moves : Object.values(g.moves || {});

        // Правило 30 секунд действует только на первых двух ходах партии
        if (movesArr.length < 2 && elapsedSinceMove >= 30) {
          const loserIsWhite = g.turn === 'w';
          const amLoser = (loserIsWhite && state.currentUser?.uid === g.whiteUid) || (!loserIsWhite && state.currentUser?.uid === g.blackUid);
          if (amLoser) {
            finishGameWithResult(g, loserIsWhite ? 'black' : 'white', 'Поражение за бездействие на старте (30 сек)');
          }
          return;
        }

        // Обновление визуального таймера без лишней записи в базу
        const curWhite = g.turn === 'w' ? Math.max(0, (g.whiteTime || 0) - elapsedSinceMove) : (g.whiteTime || 0);
        const curBlack = g.turn === 'b' ? Math.max(0, (g.blackTime || 0) - elapsedSinceMove) : (g.blackTime || 0);

        const topClockEl = document.getElementById('clock-top');
        const botClockEl = document.getElementById('clock-bottom');
        const amWhite = state.currentUser?.uid === g.whiteUid;
        if (topClockEl) topClockEl.textContent = formatClock(amWhite ? curBlack : curWhite);
        if (botClockEl) botClockEl.textContent = formatClock(amWhite ? curWhite : curBlack);

        if (curWhite <= 0 && amWhite) {
          finishGameWithResult(g, 'black', 'Время вышло');
        } else if (curBlack <= 0 && !amWhite) {
          finishGameWithResult(g, 'white', 'Время вышло');
        }
      }, 500);
    }

    function calculateEloChanges(wElo, bElo, wGames, bGames, winner) {
      const kW = (wGames || 0) < 10 ? 140 : 32;
      const kB = (bGames || 0) < 10 ? 140 : 32;
      const expW = 1 / (1 + Math.pow(10, (bElo - wElo) / 400));
      const expB = 1 - expW;
      const scoreW = winner === 'white' ? 1 : (winner === 'draw' ? 0.5 : 0);
      const scoreB = 1 - scoreW;
      return {
        deltaW: Math.round(kW * (scoreW - expW)),
        deltaB: Math.round(kB * (scoreB - expB))
      };
    }

    async function finishGameWithResult(g, winner, reason) {
      if (!g || g.status === 'finished') return;
      const eloKey = `elo_${g.timeControl || 10}`;
      const wUser = state.usersMap[g.whiteUid];
      const bUser = state.usersMap[g.blackUid];

      let deltaW = 0;
      let deltaB = 0;
      if (g.rated && g.mode !== 'bot' && wUser && bUser) {
        const res = calculateEloChanges(
          wUser[eloKey] || 500,
          bUser[eloKey] || 500,
          wUser.gamesPlayed || 0,
          bUser.gamesPlayed || 0,
          winner
        );
        deltaW = res.deltaW;
        deltaB = res.deltaB;
      }

      const movesArr = Array.isArray(g.moves) ? g.moves : Object.values(g.moves || {});
      const durationSec = Math.max(1, Math.round((Date.now() - (g.createdAt || Date.now())) / 1000));

      await update(ref(rtdb, `bc_games/${g.id}`), {
        status: 'finished',
        winner,
        reason,
        deltaW,
        deltaB,
        durationSec,
        finishedAt: Date.now()
      });

      const archivePayload = {
        id: g.id,
        mode: g.mode,
        timeControl: g.timeControl,
        rated: g.rated,
        whiteUid: g.whiteUid,
        whiteNick: g.whiteNick,
        blackUid: g.blackUid,
        blackNick: g.blackNick,
        winner,
        reason,
        deltaW,
        deltaB,
        moves: movesArr,
        finishedAt: Date.now()
      };

      if (wUser) {
        const nextWElo = Math.max(100, (wUser[eloKey] || 500) + deltaW);
        await update(ref(rtdb, `bc_users/${g.whiteUid}`), {
          [eloKey]: nextWElo,
          gamesPlayed: (wUser.gamesPlayed || 0) + 1
        });
        await set(ref(rtdb, `bc_archives/${g.whiteUid}/${g.id}`), archivePayload);
      }

        const nextBElo = Math.max(100, (bUser[eloKey] || 500) + deltaB);
        await update(ref(rtdb, `bc_users/${g.blackUid}`), {

    // Движок ботов (Минимакс с альфа-бета отсечением и защитой от повторений)
    const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
    function evaluateBoard(chess) {
      if (chess.in_checkmate()) return chess.turn() === 'w' ? -99999 : 99999;
      if (chess.in_draw()) return 0;
      const board = chess.board();
      let total = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = board[r][c];
          if (!sq) continue;
          const val = PIECE_VALUES[sq.type] || 0;
          total += sq.color === 'w' ? val : -val;
        }
      }
      return total;
    }

    function minimax(chess, depth, alpha, beta, isMax) {
      if (depth === 0 || chess.game_over()) return evaluateBoard(chess);
      const moves = chess.moves({ verbose: true });
      if (isMax) {
        let maxEval = -Infinity;
        for (const m of moves) {
          chess.move(m);
          const ev = minimax(chess, depth - 1, alpha, beta, false);
          chess.undo();
          if (ev > maxEval) maxEval = ev;
          if (ev > alpha) alpha = ev;
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const m of moves) {
          chess.move(m);
          const ev = minimax(chess, depth - 1, alpha, beta, true);
          chess.undo();
          if (ev < minEval) minEval = ev;
          if (ev < beta) beta = ev;
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function pickBestBotMove(fen, bot, recentFens = []) {
      const chess = new Chess(fen);
      const moves = chess.moves({ verbose: true });
      if (!moves.length) return null;
      if (bot.randomness > 0 && Math.random() < bot.randomness) {
        return moves[Math.floor(Math.random() * moves.length)];
      }
      let bestMove = moves[0];
      let bestScore = Infinity;
      moves.sort((a, b) => (b.captured ? 10 : 0) - (a.captured ? 10 : 0));
      for (const m of moves) {
        chess.move(m);
        let score = minimax(chess, (bot.depth || 2) - 1, -Infinity, Infinity, true);
        const posKey = chess.fen().split(' ')[0];
        if (recentFens.includes(posKey)) {
          score += 220;
        }
        chess.undo();
        if (score < bestScore) {
          bestScore = score;
          bestMove = m;
        }
      }
      return bestMove;
    }

    function triggerBotTurn(g) {
      const bot = BOTS.find(b => b.id === g.botId) || BOTS[0];
      state.botIsThinking = true;
      const delayMs = state.botThinkDelayEnabled
        ? (bot.id === 'boris' ? 1300 : bot.id === 'mittens' ? 950 : 650)
        : 120;

      botMoveTimeout = setTimeout(async () => {
        try {
          const curGame = state.activeGame;
          if (!curGame || curGame.id !== g.id || curGame.status !== 'active' || curGame.turn !== 'b') {
            state.botIsThinking = false;
            return;
          }
          const prevMoves = Array.isArray(curGame.moves) ? curGame.moves : Object.values(curGame.moves || {});
          const recentFens = prevMoves.slice(-6).map(m => (m.fen || '').split(' ')[0]);
          const chosen = pickBestBotMove(curGame.fen, bot, recentFens);
          if (!chosen) {
            state.botIsThinking = false;
            return;
          }
          const chess = new Chess(curGame.fen);
          const moveRes = chess.move({ from: chosen.from, to: chosen.to, promotion: 'q' });
          if (!moveRes) {
            state.botIsThinking = false;
            return;
          }
          const nextMoves = [
            ...prevMoves,
            {
              san: moveRes.san,
              from: moveRes.from,
              to: moveRes.to,
              fen: chess.fen(),
              captured: moveRes.captured || null,
              quality: bot.id === 'boris' ? 'brilliant' : 'best'
            }
          ];

          state.botIsThinking = false;
          const posKey = chess.fen().split(' ')[0];
          const repeatCount = nextMoves.filter(m => m && m.fen && m.fen.split(' ')[0] === posKey).length;
          if (chess.in_checkmate()) {
            await finishGameWithResult({ ...curGame, moves: nextMoves }, 'black', 'Мат');
          } else if (chess.in_stalemate()) {
            await finishGameWithResult({ ...curGame, moves: nextMoves }, 'draw', 'Пат (ничья)');
          } else if (chess.insufficient_material()) {
            await finishGameWithResult({ ...curGame, moves: nextMoves }, 'draw', 'Недостаточно фигур (ничья)');
          } else if (chess.in_threefold_repetition() || repeatCount >= 3 || chess.in_draw()) {
            await finishGameWithResult({ ...curGame, moves: nextMoves }, 'draw', 'Ничья (повторение позиции)');
          } else {
            await update(ref(rtdb, `bc_games/${curGame.id}`), {
              fen: chess.fen(),
              turn: 'w',
              lastMoveAt: Date.now(),
              lastMove: { from: moveRes.from, to: moveRes.to },
              moves: nextMoves
            });
          }
        } catch (e) {
          state.botIsThinking = false;
        }
      }, delayMs);
    }

    async function attemptPlayerMove(fromSq, toSq) {
      const g = state.activeGame;
      if (!g || g.status !== 'active' || !state.currentUser) return false;
      if (state.viewMoveIndex !== -1) {
        state.viewMoveIndex = -1;
      }
      const amWhite = state.currentUser.uid === g.whiteUid;
      const amBlack = state.currentUser.uid === g.blackUid;
      if (!amWhite && !amBlack) return false;
      if ((amWhite && g.turn !== 'w') || (amBlack && g.turn !== 'b')) return false;

      const chess = new Chess(g.fen);
      const moveRes = chess.move({ from: fromSq, to: toSq, promotion: 'q' });
      if (!moveRes) return false;

      const now = Date.now();
      const elapsed = Math.max(0, (now - (g.lastMoveAt || now)) / 1000);
      const nextWhiteTime = amWhite ? Math.max(0, (g.whiteTime || 0) - elapsed) : (g.whiteTime || 0);
      const nextBlackTime = amBlack ? Math.max(0, (g.blackTime || 0) - elapsed) : (g.blackTime || 0);

      const prevMoves = Array.isArray(g.moves) ? g.moves : Object.values(g.moves || {});
      const quality = moveRes.captured ? 'brilliant' : (chess.in_check() ? 'best' : 'good');
      const nextMoves = [
        ...prevMoves,
        {
          san: moveRes.san,
          from: moveRes.from,
          to: moveRes.to,
          fen: chess.fen(),
          captured: moveRes.captured || null,
          quality
        }
      ];

      const posKey = chess.fen().split(' ')[0];
      const repeatCount = nextMoves.filter(m => m && m.fen && m.fen.split(' ')[0] === posKey).length;
      if (chess.in_checkmate()) {
        await finishGameWithResult({ ...g, moves: nextMoves }, amWhite ? 'white' : 'black', 'Мат');
        return true;
      } else if (chess.in_stalemate()) {
        await finishGameWithResult({ ...g, moves: nextMoves }, 'draw', 'Пат (ничья)');
        return true;
      } else if (chess.insufficient_material()) {
        await finishGameWithResult({ ...g, moves: nextMoves }, 'draw', 'Недостаточно фигур (ничья)');
        return true;
      } else if (chess.in_threefold_repetition() || repeatCount >= 3 || chess.in_draw()) {
        await finishGameWithResult({ ...g, moves: nextMoves }, 'draw', 'Ничья (повторение позиции)');
        return true;
      }

      await update(ref(rtdb, `bc_games/${g.id}`), {
        fen: chess.fen(),
        turn: amWhite ? 'b' : 'w',
        whiteTime: nextWhiteTime,
        blackTime: nextBlackTime,
        lastMoveAt: now,
        lastMove: { from: moveRes.from, to: moveRes.to },
        moves: nextMoves
      });
      return true;
    }

    window.handleBoardPointerDown = function(e, sq, pieceCode) {
      if (e.button !== undefined && e.button !== 0) return;
      const g = state.activeGame;
      if (!g || g.status !== 'active' || !state.currentUser) return;
      const amWhite = state.currentUser.uid === g.whiteUid;
      const amBlack = state.currentUser.uid === g.blackUid;
      if (!amWhite && !amBlack) return;
      const myColor = amWhite ? 'w' : 'b';

      // Если уже выбрана своя фигура и кликнули на целевую клетку
      if (state.selectedSquare && state.selectedSquare !== sq) {
        const from = state.selectedSquare;
        state.selectedSquare = null;
        attemptPlayerMove(from, sq).then(moved => {
          if (!moved && pieceCode && pieceCode.startsWith(myColor)) {
            state.selectedSquare = sq;
          }
          renderApp();
        });
        return;
      }

      if (!pieceCode || !pieceCode.startsWith(myColor)) {
        state.selectedSquare = null;
        renderApp();
        return;
      }

      state.selectedSquare = sq;
      state.dragState = {
        from: sq,
        pieceCode,
        x: e.clientX,
        y: e.clientY
      };
      const ghost = document.getElementById('drag-ghost-layer');
      if (ghost) {
        ghost.className = 'drag-ghost';
        ghost.style.left = e.clientX + 'px';
        ghost.style.top = e.clientY + 'px';
        ghost.innerHTML = PIECE_SVGS[pieceCode] || '';
      }
      renderApp();
    };

    window.addEventListener('pointermove', (e) => {
      if (!state.dragState) return;
      state.dragState.x = e.clientX;
      state.dragState.y = e.clientY;
      const ghost = document.getElementById('drag-ghost-layer');
      if (ghost) {
        ghost.style.left = e.clientX + 'px';
        ghost.style.top = e.clientY + 'px';
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!state.dragState) return;
      const dragInfo = state.dragState;
      state.dragState = null;
      const ghost = document.getElementById('drag-ghost-layer');
      if (ghost) {
        ghost.className = 'hidden';
        ghost.innerHTML = '';
      }
      const targetEl = document.elementFromPoint(e.clientX, e.clientY);
      const sqEl = targetEl ? targetEl.closest('[data-square]') : null;
      const toSq = sqEl ? sqEl.getAttribute('data-square') : null;

      if (toSq && toSq !== dragInfo.from) {
        state.selectedSquare = null;
        attemptPlayerMove(dragInfo.from, toSq).then(() => renderApp());
      } else {
        renderApp();
      }
    });

    window.stepGameMove = function(delta) {
      const g = state.activeGame;

      if (!movesArr.length) return;
      const cur = state.viewMoveIndex === -1 ? movesArr.length : state.viewMoveIndex;
      const next = Math.max(0, Math.min(movesArr.length, cur + delta));
      state.viewMoveIndex = next === movesArr.length ? -1 : next;
      renderApp();
    };

    window.handleLessonSquareClick = async function(sq) {
      const lesson = LESSONS.find(l => l.num === state.currentLessonNum) || LESSONS[0];
      const chess = new Chess(state.lessonFen);
      const piece = chess.get(sq);

      if (!state.lessonSelectedSq) {
        if (piece && piece.color === 'w') {
          state.lessonSelectedSq = sq;
          renderApp();
        }
        return;
      }

      if (state.lessonSelectedSq === sq) {
        state.lessonSelectedSq = null;
        renderApp();
        return;
      }

      const from = state.lessonSelectedSq;
      state.lessonSelectedSq = null;
      const moveObj = chess.move({ from, to: sq, promotion: 'q' });
      if (!moveObj) {
        if (piece && piece.color === 'w') state.lessonSelectedSq = sq;
        renderApp();
        return;
      }

      const uci = `${moveObj.from}${moveObj.to}`;
      if (lesson.expected.includes(uci)) {

        state.lessonFen = chess.fen();

        if (found) uid = found.uid;
      }
      if (!uid || !state.usersMap[uid]) {
        showToast('Выберите существующий аккаунт для удаления', 'error');
        return;
      }
      const deletedNick = state.usersMap[uid].nick;
      await update(ref(rtdb), {
        [`bc_users/${uid}`]: null,
        [`bc_bans/${uid}`]: null,
        [`bc_archives/${uid}`]: null,
        [`bc_user_active_game/${uid}`]: null
      });
      delete state.usersMap[uid];
      state.adminDeleteTargetUid = '';
      state.adminDeleteSearch = '';

      if (nextState) {

    function renderChessBoardHtml(fen, orientation = 'w', theme = 'green', options = {}) {
      const chess = new Chess(fen);
      const board = chess.board();
      const files = orientation === 'w' ? ['a','b','c','d','e','f','g','h'] : ['h','g','f','e','d','c','b','a'];
      const ranks = orientation === 'w' ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];

      const legalTargets = new Map();
      if (options.selectedSquare) {
        chess.moves({ square: options.selectedSquare, verbose: true }).forEach(m => {
          legalTargets.set(m.to, Boolean(m.captured));
        });
      }

      let kingInCheckSq = null;
      if (chess.in_check()) {
        const turnColor = chess.turn();
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = board[r][c];
            if (p && p.type === 'k' && p.color === turnColor) {
              kingInCheckSq = 'abcdefgh'[c] + (8 - r);
            }
          }
        }
      }

      let cellsHtml = '';
      for (const rank of ranks) {
        for (const file of files) {
          const sq = `${file}${rank}`;
          const fileIdx = 'abcdefgh'.indexOf(file);
          const rankIdx = 8 - rank;
          const isLight = (fileIdx + rankIdx) % 2 === 0;
          const baseClass = theme === 'wood'
            ? (isLight ? 'sq-wood-light' : 'sq-wood-dark')
            : (isLight ? 'sq-green-light' : 'sq-green-dark');

          const isLast = options.lastMove && (options.lastMove.from === sq || options.lastMove.to === sq);
          const isSel = options.selectedSquare === sq;
          const isChk = kingInCheckSq === sq;
          const piece = board[rankIdx][fileIdx];
          const pieceCode = piece ? (piece.color + piece.type.toUpperCase()) : '';
          const isBeingDragged = state.dragState && state.dragState.from === sq;

          const clickAttr = options.lessonMode
            ? `onclick="window.handleLessonSquareClick('${sq}')"`
            : `onpointerdown="window.handleBoardPointerDown(event, '${sq}', '${pieceCode}')"`;

          cellsHtml += `
            <div data-square="${sq}" ${clickAttr}
                 class="relative flex items-center justify-center ${baseClass} ${isLast ? 'sq-last-move' : ''} ${isSel ? 'sq-selected' : ''} ${isChk ? 'sq-check' : ''} cursor-pointer">
              ${pieceCode && !isBeingDragged ? PIECE_SVGS[pieceCode] : ''}
              ${legalTargets.has(sq) ? (legalTargets.get(sq) ? '<div class="legal-capture absolute"></div>' : '<div class="legal-dot absolute"></div>') : ''}
            </div>
          `;
        }
      }

      return `<div class="board-grid w-full rounded-2xl overflow-hidden border-2 border-grayBorder shadow-2xl">${cellsHtml}</div>`;
    }

              </div>
              <button type="button" onclick="window.sendFriendChallenge()" class="w-full py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm cursor-pointer">

    function renderGameView() {
      const g = state.activeGame;
      if (!g) {
        return `<div class="text-center py-12 text-gray-400">Загрузка партии...</div>`;
      }
      const amWhite = state.currentUser?.uid === g.whiteUid;
      const orientation = amWhite ? 'w' : 'b';
      const movesArr = Array.isArray(g.moves) ? g.moves : Object.values(g.moves || {});
      const displayIdx = state.viewMoveIndex === -1 ? movesArr.length : state.viewMoveIndex;
      const displayFen = displayIdx === 0
        ? "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
        : (movesArr[displayIdx - 1]?.fen || g.fen);
      const displayLastMove = displayIdx > 0 ? movesArr[displayIdx - 1] : null;

      const topUser = amWhite ? (state.usersMap[g.blackUid] || { uid: g.blackUid, nick: g.blackNick }) : (state.usersMap[g.whiteUid] || { uid: g.whiteUid, nick: g.whiteNick });
      const botUser = amWhite ? (state.usersMap[g.whiteUid] || { uid: g.whiteUid, nick: g.whiteNick }) : (state.usersMap[g.blackUid] || { uid: g.blackUid, nick: g.blackNick });
      const topElo = amWhite ? g.blackElo : g.whiteElo;
      const botElo = amWhite ? g.whiteElo : g.blackElo;
      const topTime = amWhite ? g.blackTime : g.whiteTime;
      const botTime = amWhite ? g.whiteTime : g.blackTime;

      const myTitles = getUserTitlesArray(state.currentUser);
      const oppTitles = getUserTitlesArray(topUser);
      const canControlFm = myTitles.includes('FM');

      const chatArr = Array.isArray(g.chat) ? g.chat : Object.values(g.chat || {});

      const bestCount = movesArr.filter(m => m && m.quality === 'best').length;
      const goodCount = movesArr.filter(m => m && m.quality === 'good').length;

      const iWon = (g.winner === 'white' && amWhite) || (g.winner === 'black' && !amWhite);

                <input id="fm-seek-slider" type="range" min="0" max="${curTrack.duration}" value="${Math.floor(fmLocalState.positionSec)}"
                       ${canControlFm ? `onchange="window.fmSeekTrack(this.value)"` : 'disabled'}

                ${canControlFm ? `
                  <div class="flex items-center gap-2">

              <button type="button" onclick="window.togglePlayerMenuSide('top')" class="flex items-center gap-2 text-left cursor-pointer">
                <span class="w-2.5 h-2.5 rounded-full ${g.mode === 'bot' || isUserOnline(topUser) ? 'bg-emerald-400' : 'bg-gray-600'}"></span>
                <span class="text-sm font-bold text-white">${renderTitlesBadges(topUser)}${escapeHtml(g.mode === 'bot' ? g.blackNick : topUser.nick)}</span>
                <span class="text-xs text-tealAccent font-bold">(${topElo})</span>
              </button>
              ${g.mode !== 'bot' ? `<div id="clock-top" class="px-3 py-1 rounded-xl bg-grayBase font-mono font-black text-base text-white">${formatClock(topTime)}</div>` : `<span class="text-xs text-gray-400">${state.botIsThinking ? 'Думает...' : 'Бот'}</span>`}

              ${state.playerMenuSide === 'top' && g.mode !== 'bot' ? `
                <div class="absolute left-4 top-12 bg-grayCard border border-grayBorder rounded-xl p-2 shadow-xl z-30 flex flex-col gap-1 text-xs min-w-[160px]">
                  <button type="button" onclick="window.navigate('/@${escapeJsAttr(topUser.nick)}')" class="px-3 py-1.5 rounded-lg hover:bg-grayPanel text-left text-white cursor-pointer">Профиль</button>
                  <button type="button" onclick="window.sendFriendRequestByUid('${escapeJsAttr(topUser.uid)}'); state.playerMenuSide=null; renderApp();" class="px-3 py-1.5 rounded-lg hover:bg-grayPanel text-left text-tealAccent cursor-pointer">+ Добавить в друзья</button>
                </div>
              ` : ''}
            </div>

            <!-- Доска -->
            <div class="w-full max-w-[540px] relative">
              ${renderChessBoardHtml(displayFen, orientation, state.currentUser?.boardTheme || 'green', {
                selectedSquare: state.selectedSquare,
                lastMove: displayLastMove
              })}

              <!-- Итоговое окно по окончании партии -->
              ${g.status === 'finished' && state.gameSummaryDismissedId !== g.id ? `
                <div class="absolute inset-0 bg-black/75 backdrop-blur-sm rounded-2xl flex items-center justify-center p-4 z-20">
                  <div class="bg-grayPanel border border-grayBorder rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl relative">
                    <button type="button" onclick="state.gameSummaryDismissedId='${escapeJsAttr(g.id)}'; renderApp();" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-grayCard text-gray-300 hover:text-white font-bold cursor-pointer">✕</button>
                    <div class="text-2xl font-black ${g.winner === 'draw' ? 'text-gray-200' : (iWon ? 'text-tealAccent' : 'text-red-400')}">${resultTitle}</div>
                    <div class="text-xs text-gray-400">${escapeHtml(g.reason || '')} · Время партии: ${formatClock(g.durationSec || 0)}</div>
                    ${g.rated && g.mode !== 'bot' ? `
                      <div class="text-sm font-black ${amWhite ? (g.deltaW >= 0 ? 'text-emerald-400' : 'text-red-400') : (g.deltaB >= 0 ? 'text-emerald-400' : 'text-red-400')}">
                        Изменение Эло: ${(amWhite ? g.deltaW : g.deltaB) >= 0 ? '+' : ''}${amWhite ? g.deltaW : g.deltaB}
                      </div>
                    ` : ''}
                    <div class="grid grid-cols-3 gap-2 bg-grayBase rounded-2xl p-3 text-xs">
                      <div><div class="text-cyan-400 font-black text-base">${brilliantCount}</div><div class="text-gray-400">Бриллиант</div></div>
                      <div><div class="text-emerald-400 font-black text-base">${bestCount}</div><div class="text-gray-400">Лучших</div></div>
                      <div><div class="text-teal-300 font-black text-base">${goodCount}</div><div class="text-gray-400">Хороших</div></div>
                    </div>
                    ${g.rematchRequestedBy && g.rematchRequestedBy !== state.currentUser?.uid ? `
                      <button type="button" onclick="window.acceptRematch()" class="w-full py-3 rounded-2xl bg-emerald-500 text-gray-950 font-extrabold text-sm cursor-pointer">Принять реванш!</button>
                    ` : `
                      <button type="button" onclick="window.requestRematch()" class="w-full py-3 rounded-2xl bg-tealDeep hover:bg-tealAccent text-gray-950 font-extrabold text-sm cursor-pointer">Играть снова</button>
                    `}
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Нижний игрок (Вы) -->
            <div class="w-full max-w-[540px] flex items-center justify-between bg-grayPanel border border-grayBorder rounded-2xl px-4 py-2.5">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                <span class="text-sm font-bold text-white">${renderTitlesBadges(botUser)}${escapeHtml(botUser.nick)}</span>
                <span class="text-xs text-tealAccent font-bold">(${botElo})</span>
              </div>
              ${g.mode !== 'bot' ? `<div id="clock-bottom" class="px-3 py-1 rounded-xl bg-grayBase font-mono font-black text-base text-white">${formatClock(botTime)}</div>` : ''}
            </div>

            <!-- Переключатели ходов (первый, назад, вперёд, последний) -->
            <div class="w-full max-w-[540px] grid grid-cols-4 gap-2">
              <button type="button" onclick="window.jumpGameMove(0)" class="py-2 rounded-xl bg-grayPanel border border-grayBorder hover:bg-grayCard text-xs font-bold cursor-pointer">⏮ В начало</button>
              <button type="button" onclick="window.stepGameMove(-1)" class="py-2 rounded-xl bg-grayPanel border border-grayBorder hover:bg-grayCard text-xs font-bold cursor-pointer">◀ Назад</button>
              <button type="button" onclick="window.stepGameMove(1)" class="py-2 rounded-xl bg-grayPanel border border-grayBorder hover:bg-grayCard text-xs font-bold cursor-pointer">Вперёд ▶</button>
              <button type="button" onclick="window.jumpGameMove(9999)" class="py-2 rounded-xl bg-grayPanel border border-grayBorder hover:bg-grayCard text-xs font-bold cursor-pointer">В конец ⏭</button>
            </div>
          </div>

          <!-- Правая колонка: Мгновенный чат партии -->
          <div class="lg:col-span-3 bg-grayPanel border border-grayBorder rounded-2xl p-4 flex flex-col h-[460px]">
            <div class="text-xs font-black text-white pb-2 border-b border-grayBorder">💬 Чат партии</div>
            <div class="flex-1 overflow-y-auto py-3 space-y-2 text-xs">
              ${chatArr.map(m => `
                <div class="bg-grayBase rounded-xl px-3 py-2">
                  <span class="font-bold text-tealAccent">${escapeHtml(m.nick)}:</span>
                  <span class="text-gray-200 break-words">${escapeHtml(m.text)}</span>
                </div>
              `).join('') || `<div class="text-gray-500 text-center mt-10">Напишите сообщение сопернику...</div>`}
            </div>
            <form onsubmit="window.sendGameChatMessage(event)" class="flex gap-1.5 pt-2 border-t border-grayBorder">
              <input id="game-chat-input" type="text" placeholder="Сообщение..." class="flex-1 bg-grayBase border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
              <button type="submit" class="px-3 py-2 rounded-xl bg-tealDeep text-gray-950 font-extrabold text-xs cursor-pointer">➤</button>
            </form>
          </div>
        </div>
      `;
    }

    function renderCoursesView() {
      const coach = COACHES.find(c => c.id === state.currentUser?.coachId) || COACHES[0];
      const lesson = LESSONS.find(l => l.num === state.currentLessonNum) || LESSONS[0];
      const completedMap = state.currentUser?.completedLessons || {};

              <div class="w-16 h-16 rounded-2xl overflow-hidden shrink-0 border border-tealAccent">${coach.svg}</div>
              <div class="space-y-1">
                <div class="text-base font-black text-white">${escapeHtml(lesson.title)}</div>
                <div class="text-sm text-gray-300 leading-snug">${escapeHtml(lesson.hint)}</div>
              </div>
            </div>

              })}

      const selectedBot = BOTS.find(b => b.id === state.selectedBotId) || BOTS[0];

        <div class="max-w-3xl mx-auto space-y-6">

          </button>

    function renderProfileView(nickParam) {
      const target = Object.values(state.usersMap).find(u => u && normalizeNick(u.nick) === normalizeNick(nickParam));
      if (!target) {
        return `<div class="max-w-md mx-auto bg-grayPanel border border-grayBorder rounded-3xl p-8 text-center text-gray-300 font-bold">Пользователь «${escapeHtml(nickParam)}» не найден</div>`;
      }
      const isMe = target.uid === state.currentUser?.uid;
      const isFriend = Boolean(state.currentUser?.friends?.[target.uid]);
      const friendsCount = Object.keys(target.friends || {}).filter(k => target.friends[k]).length;
      const canSeeArchive = isMe || target.publicArchive !== false;

      // Подгружаем архив при открытии профиля
      if (!target._archiveLoaded) {
        target._archiveLoaded = true;
        get(ref(rtdb, `bc_archives/${target.uid}`)).then(snap => {
          target._archiveList = Object.values(snap.val() || {}).sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
          renderApp();
        });
      }
      const archiveList = target._archiveList || [];

      return `
        <div class="max-w-3xl mx-auto space-y-6">
          <div class="bg-grayPanel border border-grayBorder rounded-3xl p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full ${isUserOnline(target) ? 'bg-emerald-400' : 'bg-gray-600'}"></span>
                <h1 class="text-2xl font-black text-white">${renderTitlesBadges(target)}${escapeHtml(target.nick)}</h1>
              </div>
              <div class="text-xs text-gray-400">Друзей: <b class="text-white">${friendsCount}</b> · Сыграно партий: <b class="text-white">${target.gamesPlayed || archiveList.length}</b></div>
            </div>
            ${!isMe ? (
              isFriend
                ? `<button type="button" onclick="window.removeFriendByUid('${escapeJsAttr(target.uid)}')" class="px-4 py-2.5 rounded-2xl bg-red-900/70 text-red-100 font-bold text-xs cursor-pointer">Удалить из друзей</button>`
                : `<button type="button" onclick="window.sendFriendRequestByUid('${escapeJsAttr(target.uid)}')" class="px-4 py-2.5 rounded-2xl bg-tealDeep text-gray-950 font-extrabold text-xs cursor-pointer">+ Добавить в друзья</button>`
            ) : ''}
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div class="bg-grayPanel border border-grayBorder rounded-2xl p-4 text-center">
              <div class="text-xs text-gray-400">⏱ 10 мин</div>
              <div class="text-xl font-black text-tealAccent mt-1">${target.elo_10 || 500}</div>
            </div>
            <div class="bg-grayPanel border border-grayBorder rounded-2xl p-4 text-center">
              <div class="text-xs text-gray-400">⚡ 3 мин</div>
              <div class="text-xl font-black text-tealAccent mt-1">${target.elo_3 || 500}</div>
            </div>
            <div class="bg-grayPanel border border-grayBorder rounded-2xl p-4 text-center">
              <div class="text-xs text-gray-400">🔥 1 мин</div>
              <div class="text-xl font-black text-tealAccent mt-1">${target.elo_1 || 500}</div>
            </div>
          </div>

          <div class="bg-grayPanel border border-grayBorder rounded-3xl p-6 space-y-3">
            <h2 class="text-lg font-black text-white">📜 Архив партий</h2>
            ${!canSeeArchive ? `<div class="text-xs text-gray-400">Игрок скрыл свой архив партий</div>` : `
              <div class="space-y-2">
                ${archiveList.map(g => {
                  const wasWhite = g.whiteUid === target.uid;
                  const oppNick = wasWhite ? g.blackNick : g.whiteNick;
                  const won = (g.winner === 'white' && wasWhite) || (g.winner === 'black' && !wasWhite);
                  const resBadge = g.winner === 'draw' ? 'Ничья' : (won ? 'Победа' : 'Поражение');
                  const resColor = g.winner === 'draw' ? 'text-gray-300' : (won ? 'text-emerald-400' : 'text-red-400');
                  return `
                    <div class="bg-grayBase border border-grayBorder rounded-2xl px-4 py-3 flex items-center justify-between text-xs">
                      <div class="space-y-0.5">
                        <div class="font-bold text-white">Против: <span class="text-tealAccent">${escapeHtml(oppNick)}</span></div>
                        <div class="text-gray-400">${g.mode === 'bot' ? 'Бот' : `${g.timeControl} мин`} · ${escapeHtml(g.reason || '')}</div>
                      </div>
                      <div class="flex items-center gap-3">
                        <span class="font-black ${resColor}">${resBadge}</span>
                        <button type="button" onclick="window.openArchiveReplay('${escapeJsAttr(target.uid)}', '${escapeJsAttr(g.id)}')" class="px-3 py-1.5 rounded-xl bg-grayCard hover:bg-gray-600 text-white font-bold cursor-pointer">Смотреть</button>
                      </div>
                    </div>
                  `;
                }).join('') || `<div class="text-xs text-gray-400">Партий пока нет</div>`}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderSettingsView() {
      const isAdmin = isCurrentUserAdmin();
      const allUsersList = Object.values(state.usersMap).filter(u => u && u.nick);
      const activeBans = Object.values(state.bansMap || {});

      const banCandidates = allUsersList.filter(x => !state.adminBanSearch || normalizeNick(x.nick).includes(normalizeNick(state.adminBanSearch)) || normalizeNick(x.email).includes(normalizeNick(state.adminBanSearch))).slice(0, 6);
      const titleCandidates = allUsersList.filter(x => !state.adminTitleSearch || normalizeNick(x.nick).includes(normalizeNick(state.adminTitleSearch))).slice(0, 6);
      const eloCandidates = allUsersList.filter(x => !state.adminEloSearch || normalizeNick(x.nick).includes(normalizeNick(state.adminEloSearch))).slice(0, 6);
      const delCandidates = allUsersList.filter(x => !state.adminDeleteSearch || normalizeNick(x.nick).includes(normalizeNick(state.adminDeleteSearch)) || normalizeNick(x.email).includes(normalizeNick(state.adminDeleteSearch))).slice(0, 6);
      const selectedTitleUser = state.adminTitleTargetUid ? state.usersMap[state.adminTitleTargetUid] : null;

      return `
        <div class="max-w-3xl mx-auto space-y-6">
          <form onsubmit="window.saveUserSettings(event)" class="bg-grayPanel border border-grayBorder rounded-3xl p-6 space-y-4">
            <div class="flex items-center justify-between">
              <h1 class="text-xl font-black text-white">⚙️ Настройки аккаунта</h1>
              <button type="button" onclick="window.logoutAccount()" class="px-3 py-1.5 rounded-xl bg-red-900/70 hover:bg-red-800 text-red-100 text-xs font-bold cursor-pointer">Выйти</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
              <div class="space-y-1">
                <label class="text-gray-400 font-bold">Никнейм</label>
                <input id="settings-nick" type="text" value="${escapeHtml(state.currentUser.nick)}" class="w-full bg-grayBase border border-grayBorder rounded-xl px-3 py-2.5 text-white" />
              </div>
              <div class="space-y-1">
                <label class="text-gray-400 font-bold">Стиль доски</label>
                <select id="settings-theme" class="w-full bg-grayBase border border-grayBorder rounded-xl px-3 py-2.5 text-white">
                  <option value="green" ${state.currentUser.boardTheme !== 'wood' ? 'selected' : ''}>Стандартный зеленоватый</option>
                  <option value="wood" ${state.currentUser.boardTheme === 'wood' ? 'selected' : ''}>Деревянный</option>
                </select>
              </div>
              <div class="space-y-1">
                <label class="text-gray-400 font-bold">Ваш тренер</label>
                <select id="settings-coach" class="w-full bg-grayBase border border-grayBorder rounded-xl px-3 py-2.5 text-white">
                  ${COACHES.map(c => `<option value="${c.id}" ${state.currentUser.coachId === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
                </select>
              </div>
              <div class="flex items-center justify-between bg-grayBase border border-grayBorder rounded-xl px-3 py-2.5 mt-4 sm:mt-5">
                <span class="font-bold text-gray-200">Показ архива партий всем</span>
                <input id="settings-public-archive" type="checkbox" ${state.currentUser.publicArchive !== false ? 'checked' : ''} class="w-4 h-4 accent-teal-400" />
              </div>
            </div>

            <button type="submit" class="px-5 py-2.5 rounded-2xl bg-tealDeep hover:bg-tealAccent text-gray-950 font-extrabold text-xs cursor-pointer">Сохранить настройки</button>
          </form>

          ${isAdmin ? `
            <div class="bg-grayPanel border-2 border-red-600/70 rounded-3xl p-6 space-y-6">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-grayBorder pb-4">
                <div>
                  <h2 class="text-lg font-black text-red-400">🛡️ Админ-панель (${ADMIN_EMAIL})</h2>
                  <p class="text-xs text-gray-400">Управление банами, титулами, Эло, аккаунтами и техработами</p>
                </div>
                <button type="button" onclick="window.adminToggleMaintenance()"
                        class="px-4 py-2 rounded-xl font-extrabold text-xs cursor-pointer ${state.siteSettings?.maintenance ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}">
                  ${state.siteSettings?.maintenance ? '✅ Включить сайт для всех' : '⛔ Выключить сайт (Техработы)'}
                </button>
              </div>

              <!-- 1. Бан игроков -->
              <form onsubmit="window.adminIssueBan(event)" class="space-y-2.5 bg-grayBase p-4 rounded-2xl border border-grayBorder">
                <div class="text-xs font-black text-white">🔨 Заблокировать пользователя</div>
                <input type="text" value="${escapeHtml(state.adminBanSearch)}" oninput="state.adminBanSearch=this.value; state.adminBanTargetUid=''; renderApp();" placeholder="Введите ник или почту..." class="w-full bg-grayPanel border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                <div class="flex flex-wrap gap-1.5">
                  ${banCandidates.map(c => `
                    <button type="button" onclick="window.adminSetBanTarget('${escapeJsAttr(c.uid)}', '${escapeJsAttr(c.nick)}')"
                            class="px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer ${state.adminBanTargetUid === c.uid ? 'bg-red-600 text-white' : 'bg-grayCard text-gray-300'}">
                      ${escapeHtml(c.nick)}${c.email ? ` (${escapeHtml(c.email)})` : ''}
                    </button>
                  `).join('')}
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <input id="admin-ban-reason" type="text" placeholder="Причина (необязательно)" class="sm:col-span-2 bg-grayPanel border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                  <select id="admin-ban-duration" class="bg-grayPanel border border-grayBorder rounded-xl px-3 py-2 text-xs text-white">
                    <option value="1h">1 час</option>
                    <option value="1d">1 день</option>
                    <option value="7d">7 дней</option>
                    <option value="12d">12 дней</option>
                    <option value="30d">30 дней</option>
                    <option value="forever" selected>Навсегда</option>
                  </select>
                </div>
                <button type="submit" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs cursor-pointer">Забанить игрока</button>
              </form>

              <!-- Список забаненных -->
              <div class="space-y-2 bg-grayBase p-4 rounded-2xl border border-grayBorder">
                <div class="text-xs font-black text-white">📋 Забаненные пользователи (${activeBans.length})</div>
                <div class="space-y-1.5 max-h-40 overflow-y-auto">
                  ${activeBans.map(b => `
                    <div class="flex items-center justify-between bg-grayPanel rounded-xl px-3 py-2 text-xs">
                      <div>
                        <span class="font-bold text-red-400">${escapeHtml(b.nick)}</span>
                        <span class="text-gray-400 ml-2">${escapeHtml(b.reason || '')} (${escapeHtml(b.durationLabel || 'forever')})</span>
                      </div>
                      <button type="button" onclick="window.adminUnbanUser('${escapeJsAttr(b.uid)}')" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-bold text-[11px] cursor-pointer">Разбанить</button>
                    </div>
                  `).join('') || `<div class="text-xs text-gray-500">Забаненных нет</div>`}
                </div>
              </div>

              <!-- 2. Выдача / снятие красных титулов -->
              <div class="space-y-2.5 bg-grayBase p-4 rounded-2xl border border-grayBorder">
                <div class="text-xs font-black text-white">🏅 Красные приписки (титулы chess.com)</div>
                <input type="text" value="${escapeHtml(state.adminTitleSearch)}" oninput="state.adminTitleSearch=this.value; state.adminTitleTargetUid=''; renderApp();" placeholder="Выберите игрока по нику..." class="w-full bg-grayPanel border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                <div class="flex flex-wrap gap-1.5">
                  ${titleCandidates.map(c => `
                    <button type="button" onclick="window.adminSetTitleTarget('${escapeJsAttr(c.uid)}', '${escapeJsAttr(c.nick)}')"
                            class="px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer ${state.adminTitleTargetUid === c.uid ? 'bg-tealDeep text-gray-950' : 'bg-grayCard text-gray-300'}">
                      ${renderTitlesBadges(c)}${escapeHtml(c.nick)}
                    </button>
                  `).join('')}
                </div>
                <div class="flex flex-wrap gap-1.5 pt-1">
                  ${ALL_TITLES.map(t => {
                    const active = Boolean(selectedTitleUser?.titles?.[t]);
                    return `
                      <button type="button" onclick="window.adminToggleUserTitle('${t}')"
                              class="px-2.5 py-1 rounded-lg text-xs font-black cursor-pointer border ${active ? 'bg-red-600 border-red-400 text-white' : 'bg-grayPanel border-grayBorder text-gray-400 hover:text-white'}">
                        ${t} ${active ? '✓' : '+'}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- 3. Изменение Эло -->
              <form onsubmit="window.adminUpdateUserElo(event)" class="space-y-2.5 bg-grayBase p-4 rounded-2xl border border-grayBorder">
                <div class="text-xs font-black text-white">📈 Изменить рейтинг Эло игрока</div>
                <input type="text" value="${escapeHtml(state.adminEloSearch)}" oninput="state.adminEloSearch=this.value; state.adminEloTargetUid=''; renderApp();" placeholder="Ник игрока..." class="w-full bg-grayPanel border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                <div class="flex flex-wrap gap-1.5">
                  ${eloCandidates.map(c => `
                    <button type="button" onclick="window.adminSetEloTarget('${escapeJsAttr(c.uid)}', '${escapeJsAttr(c.nick)}')"
                            class="px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer ${state.adminEloTargetUid === c.uid ? 'bg-tealDeep text-gray-950' : 'bg-grayCard text-gray-300'}">
                      ${escapeHtml(c.nick)} (${c.elo_10 || 500})
                    </button>
                  `).join('')}
                </div>
                <div class="grid grid-cols-3 gap-2">
                  <select id="admin-elo-mode" class="bg-grayPanel border border-grayBorder rounded-xl px-3 py-2 text-xs text-white">
                    <option value="elo_10">10 мин</option>
                    <option value="elo_3">3 мин</option>
                    <option value="elo_1">1 мин</option>
                  </select>
                  <input id="admin-elo-val" type="number" value="500" class="bg-grayPanel border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                  <button type="submit" class="rounded-xl bg-tealDeep text-gray-950 font-extrabold text-xs cursor-pointer">Применить</button>
                </div>
              </form>

              <!-- 4. Полное удаление аккаунта -->
              <div class="space-y-2 bg-grayBase p-4 rounded-2xl border border-grayBorder">
                <div class="text-xs font-black text-red-400">🗑️ Полное удаление аккаунта и освобождение ника</div>
                <input type="text" value="${escapeHtml(state.adminDeleteSearch)}"
                       oninput="state.adminDeleteSearch = this.value; state.adminDeleteTargetUid = ''; renderApp();"
                       placeholder="Ник или почта аккаунта для полного удаления..."
                       class="w-full bg-grayPanel border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                <div class="flex flex-wrap gap-1.5">
                  ${delCandidates.map(c => `
                    <button type="button" onclick="window.adminSetDeleteTarget('${escapeJsAttr(c.uid)}', '${escapeJsAttr(c.nick)}')"
                            class="px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer ${state.adminDeleteTargetUid === c.uid ? 'bg-red-600 text-white' : 'bg-grayCard text-gray-300'}">
                      ${escapeHtml(c.nick)}${c.email ? ` (${escapeHtml(c.email)})` : ''}
                    </button>
                  `).join('')}
                </div>
                <button type="button" onclick="window.adminDeleteAccount()"
                        class="px-4 py-2 rounded-xl bg-red-900 hover:bg-red-800 text-red-100 font-extrabold text-xs cursor-pointer">
                  Удалить аккаунт и освободить ник
                </button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderArchiveReplayModal() {
      const g = state.archiveModalGame;
      if (!g) return '';
      const movesArr = Array.isArray(g.moves) ? g.moves : [];
      const idx = Math.max(0, Math.min(movesArr.length, state.archiveMoveIndex));
      const fen = idx === 0
        ? "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
        : (movesArr[idx - 1]?.fen || "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
      const lastMove = idx > 0 ? movesArr[idx - 1] : null;

      return `
        <div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
          <div class="bg-grayPanel border border-grayBorder rounded-3xl p-5 max-w-md w-full space-y-4">
            <div class="flex items-center justify-between">
              <div class="text-sm font-black text-white">${escapeHtml(g.whiteNick)} vs ${escapeHtml(g.blackNick)}</div>
              <button type="button" onclick="state.archiveModalGame=null; renderApp();" class="w-8 h-8 rounded-full bg-grayCard text-gray-300 font-bold cursor-pointer">✕</button>
            </div>
            ${renderChessBoardHtml(fen, 'w', state.currentUser?.boardTheme || 'green', { lastMove })}
            <div class="grid grid-cols-4 gap-2">
              <button type="button" onclick="state.archiveMoveIndex=0; renderApp();" class="py-2 rounded-xl bg-grayBase text-xs font-bold cursor-pointer">⏮</button>
              <button type="button" onclick="window.stepArchiveMove(-1)" class="py-2 rounded-xl bg-grayBase text-xs font-bold cursor-pointer">◀ Назад</button>
              <button type="button" onclick="window.stepArchiveMove(1)" class="py-2 rounded-xl bg-grayBase text-xs font-bold cursor-pointer">Вперёд ▶</button>
              <button type="button" onclick="state.archiveMoveIndex=${movesArr.length}; renderApp();" class="py-2 rounded-xl bg-grayBase text-xs font-bold cursor-pointer">⏭</button>
            </div>
          </div>
        </div>
      `;
    }

    window.renderApp = function() {
      renderNavbar();
      const root = document.getElementById('app-root');
      if (!root) return;

      // 1. Проверка режима технических работ (для всех кроме zoneboren@gmail.com)
      if (state.siteSettings?.maintenance && !isCurrentUserAdmin()) {
        root.innerHTML = `
          <div class="max-w-md mx-auto mt-12 bg-grayPanel border border-amber-500/60 rounded-3xl p-8 text-center space-y-5 shadow-2xl">
            <div class="text-4xl">🛠️</div>
            <h1 class="text-2xl font-black text-white">Технические работы</h1>
            <p class="text-xs text-gray-400">Сайт BurmalChess временно закрыт на обслуживание. Все активные партии завершены вничью.</p>
            <div class="border-t border-grayBorder pt-4 space-y-3 text-left">
              <div class="text-[11px] text-gray-400 text-center">Вход для администратора по почте:</div>
              <button type="button" onclick="window.loginWithGoogle()" class="w-full py-3 rounded-2xl bg-white text-gray-900 font-extrabold text-xs flex items-center justify-center gap-2 cursor-pointer">
                <span>G</span><span>Войти через Google</span>
              </button>
            </div>
          </div>
        `;
        return;
      }

      // 2. Проверка активного бана
      const activeBan = getActiveBanForCurrentUser();
      if (activeBan) {
        const untilStr = activeBan.expiresAt ? new Date(activeBan.expiresAt).toLocaleString('ru-RU') : 'Навсегда';
        root.innerHTML = `
          <div class="max-w-md mx-auto mt-12 bg-red-950/60 border-2 border-red-600 rounded-3xl p-8 text-center space-y-4 shadow-2xl">
            <div class="text-4xl">⛔</div>
            <h1 class="text-2xl font-black text-white">Вы забанены!</h1>
            <p class="text-sm text-red-200">Причина: <b>${escapeHtml(activeBan.reason)}</b></p>
            <p class="text-xs text-red-300">Срок блокировки: <b>${untilStr}</b></p>
            <button type="button" onclick="window.logoutAccount()" class="px-5 py-2.5 rounded-xl bg-grayPanel text-white text-xs font-bold cursor-pointer">Выйти из аккаунта</button>
          </div>
        `;
        return;
      }

      // 3. Экран авторизации / онбординга
      if (!state.currentUser) {
        root.innerHTML = renderAuthView();
        return;
      }
      if (state.onboardingStep) {
        root.innerHTML = renderOnboardingView();
        return;
      }

      // 4. Маршрутизация страниц
      let pageHtml = '';
      if (state.route === '/play') {
        pageHtml = renderPlayView();
      } else if (state.route.startsWith('/game/')) {
        pageHtml = renderGameView();
      } else if (state.route === '/courses') {
        pageHtml = renderCoursesView();
      } else if (state.route === '/bots') {
        pageHtml = renderBotsView();
      } else if (state.route === '/settings') {
        pageHtml = renderSettingsView();
      } else if (state.route.startsWith('/@')) {
        pageHtml = renderProfileView(decodeURIComponent(state.route.slice(2)));
      } else {
        pageHtml = renderHomeView();
      }

      root.innerHTML = pageHtml + renderArchiveReplayModal();
    };

    // Запуск слушателей при загрузке
    initRealtimeListeners();
    if (window.location.pathname.startsWith('/game/')) {
      const initialGid = window.location.pathname.replace('/game/', '').trim();
      if (initialGid) subscribeToGame(initialGid);
    }
    renderApp();
  </script>
</body>
</html>
