<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Трусики</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩲</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#141414;--c:#1c1c1c;--b:#2c2c2c;--g:#6aa11e;--t:#eee;--m:#9a9a9a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:400 17px Oswald,sans-serif}
a{color:inherit;text-decoration:none}button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,textarea{background:#101010;border:1px solid var(--b);border-radius:8px;padding:10px 12px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--g)}textarea{min-height:130px;resize:vertical}
header{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:14px;padding:0 18px;height:64px}
.logo{font-size:26px;color:var(--g);white-space:nowrap;margin-right:auto}
.sr{flex:0 1 560px;position:absolute;left:50%;transform:translateX(-50%);width:min(560px,36vw)}
.ic{font-size:22px;position:relative;padding:6px}.rel{position:relative}
.dot{position:absolute;top:0;right:-2px;background:var(--g);color:#000;font-size:11px;border-radius:9px;padding:0 5px;font-style:normal}
.ab{width:40px;height:40px;border-radius:50%;background:#000;overflow:hidden;display:grid;place-items:center;font-size:20px}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#333;display:inline-grid;place-items:center;flex:none;vertical-align:middle}
.av.big{width:90px;height:90px;font-size:40px}.ab .av{width:40px;height:40px}
.btn{background:var(--b);padding:9px 16px;border-radius:8px;display:inline-block}.btn.g{background:var(--g);color:#fff}
#sb{position:fixed;top:64px;left:0;bottom:0;width:240px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
#sb a{padding:14px 16px;border-radius:10px;font-size:20px}#sb a.on{background:#262626}#sb a.bot{margin-top:auto}
#m{margin-left:240px;padding:14px 28px 60px}body.nosb #m{margin-left:0}body.nosb #sb{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.tb button{font-size:22px;color:var(--m);padding:8px 12px 10px;border-bottom:2px solid transparent}.tb button.on{color:var(--t);border-color:var(--g)}
.flt{font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;overflow:hidden;position:relative}
.th{display:block;height:210px;background:#0e0e0e;position:relative}.th img{width:100%;height:100%;object-fit:cover}
.tx{padding:20px;font-size:26px;color:var(--g);height:100%;overflow:hidden}
.pin{position:absolute;top:10px;left:10px;background:var(--g);padding:3px 10px;border-radius:14px;font-size:15px}
.ci{padding:14px}.au{display:flex;align-items:center;gap:10px}.au a{display:flex;align-items:center;gap:10px;margin-right:auto}
.card h3{margin:12px 0 4px;font-weight:500;font-size:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card p{margin:0;color:var(--m);height:24px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.st{margin-top:12px;color:var(--m);display:flex;gap:16px}.st span:last-child{margin-left:auto}
.dots{font-size:22px;color:var(--m);padding:0 6px}
.pop{position:absolute;right:0;top:100%;background:#222;border:1px solid var(--b);border-radius:12px;padding:10px;z-index:30;min-width:210px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 30px #000a}
.pop>*{padding:9px 10px;border-radius:8px;text-align:left}.pop>button:hover,.pop>a:hover{background:#2e2e2e}
.pop.bell{width:min(480px,92vw);padding:18px}.pop h4{margin:0 0 10px;font-size:22px;padding:0}
.tabs2{display:flex;gap:8px;flex-wrap:wrap;padding:0!important}.tabs2 button{background:#2c2c2c;padding:8px 16px;border-radius:8px}.tabs2 .on{background:#2f3d17;color:var(--g)}
.ni{display:block}.ni small,.m,small{color:var(--m)}.ni small{display:block}
.card .pop{top:46px;right:10px}.uid{font-size:11px;word-break:break-all}
.em{color:var(--m);text-align:center;padding:40px 0}
.ctr{text-align:center;padding:12vh 16px}.ctr input{max-width:340px;margin:8px 0}.big{font-size:56px;color:var(--g);margin-bottom:20px}
.np{display:grid;grid-template-columns:2fr 1fr;gap:24px}.np .side{background:var(--c);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.drop{border:2px dashed var(--b);border-radius:14px;min-height:340px;display:grid;place-items:center;text-align:center;color:var(--m);cursor:pointer;overflow:hidden}.drop img{max-width:100%;max-height:420px}
.pv{max-width:860px}.pv h1{margin:0 0 12px}.pv .big{display:block;width:100%;max-height:520px;object-fit:contain;background:#000;border-radius:12px;margin:14px 0;font-size:inherit;color:inherit}
.tt{white-space:pre-wrap;font-size:19px}.act{display:flex;gap:10px;margin:14px 0}.act button{background:var(--b);padding:8px 16px;border-radius:8px}.act .on{color:var(--g)}
.cf{display:flex;gap:8px;margin:10px 0}.cmt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--b)}.cmt p{margin:2px 0;white-space:pre-wrap}.cmt>div{flex:1}
.prof{display:flex;gap:20px;align-items:center;margin-bottom:14px}.prof h1{margin:0}.prof .btn{margin:8px 8px 0 0}
.box{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:16px}.box h3{margin-top:0}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--b);flex-wrap:wrap}.row span{margin-left:auto}
.chat{background:var(--c);border-radius:12px;padding:12px;min-height:200px;max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:8px 12px;border-radius:10px;background:#2a2a2a}.msg.u{align-self:flex-end;background:#2f3d17}.msg small{display:block}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50}.mod{background:#222;padding:24px;border-radius:14px;display:flex;flex-direction:column;gap:10px;width:300px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;padding:10px 20px;border-radius:10px;z-index:60}
@media(max-width:800px){#sb{display:none}#m{margin-left:0;padding:10px 14px}.sr{position:static;transform:none;width:auto;flex:1}.logo{margin:0}.np{grid-template-columns:1fr}.btn.g.nw{display:none}}
</style></head><body>
<header id="h"></header>
<nav id="sb"><a data-l href="/">▦ Лента</a><a data-l href="/support" class="bot">❔ Поддержка</a></nav>
<main id="m"></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,orderBy,limit,arrayUnion,arrayRemove,increment}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ВСТАВЬТЕ СЮДА ВАШ firebaseConfig (Firebase → Настройки проекта → Ваши приложения → Web)
const cfg={apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""};

const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={u:null,me:null,site:true,ban:null,posts:[],rs:[],q:'',f:'new',tab:'all',nt:[],ntab:'all',sb:innerWidth>800,adm:localStorage.adm!=='0',bans:[],sup:[],msg:[],cm:[],pfo:[],pg:[],t:'',d:'',img:'',ptab:'p'};
const isM=()=>S.me?.nick==='max',isA=()=>isM()&&S.adm;
const banned=()=>S.ban&&(!S.ban.until||S.ban.until>Date.now());
const canDel=o=>S.me&&(o.uid==S.me.uid||isA());
const T=ts=>new Date(ts).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const path=()=>decodeURIComponent(location.pathname).replace(/\/+$/,'')||'/';
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)};
const av=(x,c='')=>x.photo?`<img class="av ${c}" referrerpolicy="no-referrer" src="${esc(x.photo)}">`:`<span class="av ${c}">${esc((x.nick||'?')[0])}</span>`;
const keep=f=>{const e=document.activeElement,id=e?.id,s=e?.selectionStart,v={};document.querySelectorAll('input[id]:not([type=file]),textarea[id]').forEach(i=>v[i.id]=i.value);f();for(const k in v){const i=$('#'+k);if(i&&!i.value)i.value=v[k]}if(id&&$('#'+id)){$('#'+id).focus();try{$('#'+id).setSelectionRange(s,s)}catch{}}};
const rl=(k,add)=>{let a=JSON.parse(localStorage['r'+k]||'[]').filter(t=>Date.now()-t<36e5);if(add){a.push(Date.now());localStorage['r'+k]=JSON.stringify(a)}return a};
const rs=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});
const captcha=()=>new Promise(r=>{const a=1+Math.random()*9|0,b=1+Math.random()*9|0,d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="mod"><h3>Вы не робот?</h3><p>Сколько будет ${a} + ${b}?</p><input id="cq" inputmode="numeric"><div><button class="btn" id="cx">Отмена</button> <button class="btn g" id="co">Проверить</button></div></div>`;document.body.append(d);$('#cx').onclick=()=>{d.remove();r(false)};$('#co').onclick=()=>{if(+$('#cq').value==a+b){d.remove();r(true)}else toast('Неверно, попробуйте ещё раз')}});
const ntf=(to,type,text,link)=>{if(to!=S.me.uid)addDoc(collection(db,'notifs'),{to,type,text,link,ts:Date.now(),read:false})};
const login=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>toast('Ошибка входа: '+e.code));

// ---------- views ----------
const bell=()=>{const tabs=[['all','Все'],['reply','Ответы'],['like','Оценки'],['sys','Система']],l=S.nt.filter(x=>S.ntab=='all'||x.type==S.ntab);
return`<div class="pop bell"><h4>Уведомления</h4><div class="tabs2">${tabs.map(([k,t])=>`<button data-a="nt" data-k="${k}" class="${S.ntab==k?'on':''}">${t}</button>`).join('')}</div>${l.length?l.map(x=>`<a data-l href="${esc(x.link||'/')}" class="ni">${esc(x.text)}<small>${T(x.ts)}</small></a>`).join(''):'<p class="em">Пока уведомлений нет</p>'}</div>`};
const um=()=>!S.u?`<div class="pop"><button class="btn g" data-a="login">Войти через Google</button></div>`:
`<div class="pop">${S.me?`<a data-l href="/@${S.me.nick}"><b>@${S.me.nick}</b></a>`:''}${isM()?`<button data-a="adm">${S.adm?'✅':'⬜'} Админ права</button><button data-a="site">${S.site?'✅ Сайт ВКЛ':'⬜ Сайт ВЫКЛ'}</button><a data-l href="/admin">🛠 Админ панель</a>`:''}<a data-l href="/support">💬 Обратиться в поддержку</a><button data-a="out">Выйти</button><small class="uid">UID: ${S.u.uid}</small></div>`;
function hdr(){keep(()=>{const n=S.nt.filter(x=>!x.read).length;
$('#h').innerHTML=`<button class="ic tg" data-a="sb">☰</button><a data-l href="/" class="logo">🩲 Трусики</a><div class="sr"><input id="q" placeholder="Поиск" value="${esc(S.q)}" autocomplete="off"></div>
<button class="btn g nw" data-a="new">＋ Новый пост</button><div class="rel"><button class="ic tg" data-a="bell">🔔${n?`<i class="dot">${n}</i>`:''}</button>${S.menu=='bell'?bell():''}</div>
<div class="rel"><button class="ab tg" data-a="um">${S.me?av(S.me):'👤'}</button>${S.menu=='um'?um():''}</div>`;
document.body.classList.toggle('nosb',!S.sb)})}
const card=p=>{const lk=(p.likes||[]).length;return`<div class="card"><a data-l href="/p/${p.id}" class="th">${p.img?`<img src="${p.img}">`:`<div class="tx">${esc(p.title)}</div>`}${p.pinned?'<span class="pin">📌 Закреплено</span>':''}</a>
<div class="ci"><div class="au"><a data-l href="/@${p.nick}">${av(p)}<span>${esc(p.nick)}</span></a><span class="tg"><button class="dots tg" data-a="pm" data-id="${p.id}">⋮</button></span></div>
${S.pm==p.id?`<div class="pop">${S.me&&p.uid!=S.me.uid?`<button data-a="hide" data-u="${p.uid}">Не интересно</button>`:''}${isA()?`<button data-a="pin" data-id="${p.id}">${p.pinned?'Открепить':'Закрепить'}</button>`:''}${canDel(p)?`<button data-a="del" data-id="${p.id}">Удалить</button>`:''}</div>`:''}
<a data-l href="/p/${p.id}"><h3>${esc(p.title)}</h3><p>${esc(p.text)||'&nbsp;'}</p></a><div class="st"><span>♡ ${lk}</span><span>💬 ${p.cc||0}</span><span>${T(p.ts)}</span></div></div></div>`};
const feed=()=>{let l=S.posts.filter(p=>!S.me?.hidden?.includes(p.uid));if(S.tab=='sub')l=l.filter(p=>S.me?.following?.includes(p.uid));
const q=S.q.toLowerCase();if(q)l=l.filter(p=>(p.title+' '+p.text+' '+p.nick).toLowerCase().includes(q));
const k={new:p=>p.ts,likes:p=>(p.likes||[]).length,cm:p=>p.cc||0}[S.f];l.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||k(b)-k(a));
return`<div class="bar"><div class="tb"><button data-a="tab" data-k="all" class="${S.tab=='all'?'on':''}">Все</button><button data-a="tab" data-k="sub" class="${S.tab=='sub'?'on':''}">Подписки</button></div>
<div class="rel"><button class="tg flt" data-a="flt">⏷ Фильтрация</button>${S.menu=='flt'?`<div class="pop">${[['new','Новые'],['likes','Популярные'],['cm','Обсуждаемые']].map(([k,t])=>`<button data-a="f" data-k="${k}">${S.f==k?'✓ ':''}${t}</button>`).join('')}</div>`:''}</div></div>
<div class="grid">${l.map(card).join('')||'<p class="em">Постов пока нет</p>'}</div>`};
const needLogin=()=>`<div class="ctr"><p>Войдите, чтобы продолжить</p><button class="btn g" data-a="login">Войти через Google</button></div>`;
const postV=()=>{const p=S.post;if(p===undefined)return'<p class="em">Загрузка…</p>';if(!p)return'<p class="em">Пост не найден</p>';const on=S.me&&(p.likes||[]).includes(S.me.uid);
return`<div class="pv"><h1>${esc(p.title)}</h1><div class="au"><a data-l href="/@${p.nick}">${av(p)}<b>${esc(p.nick)}</b></a><span class="m">${T(p.ts)}</span></div>${p.img?`<img class="big" src="${p.img}">`:''}<p class="tt">${esc(p.text)}</p>
<div class="act"><button data-a="like" data-id="${p.id}" class="${on?'on':''}">♡ ${(p.likes||[]).length}</button>${isA()?`<button data-a="pin" data-id="${p.id}">📌 ${p.pinned?'Открепить':'Закрепить'}</button>`:''}${canDel(p)?`<button data-a="del" data-id="${p.id}">🗑 Удалить</button>`:''}</div>
<h3>Комментарии (${S.cm.length})</h3><div class="cf"><input id="ci" placeholder="Написать комментарий" maxlength="500"><button class="btn g" data-a="cm" data-id="${p.id}">Отправить</button></div>
${S.cm.map(c=>`<div class="cmt">${av(c)}<div><a data-l href="/@${c.nick}"><b>${esc(c.nick)}</b></a> <small>${T(c.ts)}</small><p>${esc(c.text)}</p></div>${canDel(c)?`<button class="dots" data-a="dc" data-id="${p.id}" data-c="${c.id}">🗑</button>`:''}</div>`).join('')}</div>`};
const ulist=a=>a.map(u=>`<div class="row"><a data-l href="/@${u.nick}" class="au">${av(u)}@${esc(u.nick)}</a></div>`).join('')||'<p class="em">Пусто</p>';
const profV=()=>{const u=S.pu;if(u===undefined)return'<p class="em">Загрузка…</p>';if(!u)return`<div class="ctr"><h1>Пользователь не найден</h1><p class="m">Аккаунта @${esc(path().slice(2))} не существует</p></div>`;
const ps=S.posts.filter(p=>p.uid==u.uid),mine=S.me?.uid==u.uid,fl=S.me?.following?.includes(u.uid);
return`<div class="prof">${av(u,'big')}<div><h1>@${esc(u.nick)}</h1><div class="m">Публикаций: ${ps.length} · Подписчиков: ${S.pfo.length} · Подписок: ${(u.following||[]).length}</div>${mine?'':`<button class="btn g" data-a="fol" data-u="${u.uid}">${fl?'Отписаться':'Подписаться'}</button><button class="btn" data-a="hide" data-u="${u.uid}">Не интересно</button>`}</div></div>
<div class="tb">${[['p','Публикации'],['f','Подписчики'],['g','Подписки']].map(([k,t])=>`<button data-a="pt" data-k="${k}" class="${S.ptab==k?'on':''}">${t}</button>`).join('')}</div><br>
${S.ptab=='p'?`<div class="grid">${ps.map(card).join('')||'<p class="em">Постов пока нет</p>'}</div>`:ulist(S.ptab=='f'?S.pfo:S.pg)}`};
const newP=()=>!S.me?needLogin():`<h1>Новый пост</h1><div class="np"><div><label class="drop" for="fi">${S.img?`<img src="${S.img}">`:'<div>⬆<br>Перетащите фото сюда или нажмите<br><small>JPEG, PNG — по желанию</small></div>'}</label><input id="fi" type="file" accept="image/*" hidden></div>
<div class="side"><label>Название *</label><input id="pt" maxlength="120" placeholder="Как назовёте пост" value="${esc(S.t)}"><label>Описание</label><textarea id="pd" placeholder="Пара слов о том, что тут, можно с #тегами">${esc(S.d)}</textarea><button class="btn g" data-a="pub">Опубликовать</button></div></div>`;
const chat=()=>`<div class="chat">${S.msg.map(m=>`<div class="msg ${m.from}"><small>${m.from=='a'?'Поддержка':'Вы'} · ${T(m.ts)}</small>${esc(m.text)}</div>`).join('')||'<p class="em">Напишите нам — ответ придёт сюда и в уведомления</p>'}</div><div class="cf"><input id="si" placeholder="Сообщение" maxlength="1000"><button class="btn g" data-a="ss">Отправить</button></div>`;
const supP=()=>!S.me?needLogin():`<h1>Поддержка</h1>${chat()}`;
const admP=()=>{const q=(S.bsq||'').toLowerCase();return`<h1>Админ панель</h1>
<div class="box"><h3>Бан</h3><div class="cf"><input id="bn" placeholder="Ник"><input id="br" placeholder="Причина"><input id="bd" placeholder="Дней (0 — навсегда)" inputmode="numeric"><button class="btn g" data-a="ban">Забанить</button></div></div>
<div class="box"><h3>Список банов</h3><input id="bs" placeholder="Поиск по нику" value="${esc(S.bsq||'')}">${S.bans.filter(b=>b.nick.includes(q)).map(b=>`<div class="row"><b>@${esc(b.nick)}</b><span class="m">${esc(b.reason)} · ${b.until?'до '+T(b.until):'навсегда'}</span><span><button class="btn" data-a="unban" data-id="${b.id}">Разбанить</button> <button class="btn" data-a="bt" data-id="${b.id}">Другой срок</button></span></div>`).join('')||'<p class="em">Банов нет</p>'}</div>
<div class="box"><h3>Поддержка</h3>${S.sup.map(t=>`<div class="row"><b>@${esc(t.nick)}</b><span class="m">${esc(t.txt||'')}</span><span><button class="btn ${S.th==t.id?'g':''}" data-a="th" data-id="${t.id}" data-n="${esc(t.nick)}">Открыть</button></span></div>`).join('')||'<p class="em">Обращений пока нет</p>'}${S.th?chat():''}</div>`};
const maint=()=>`<div class="ctr"><div class="big">🩲 Трусики</div><h2>The site is currently under maintenance</h2><p>Сайт сейчас на ремонте. Скоро вернёмся!</p></div>`;
const banScr=()=>`<div class="ctr"><h1>Вы забанены!</h1><p>Причина: ${esc(S.ban.reason)}</p><p>${S.ban.until?'Бан до '+T(S.ban.until):'Бан навсегда'}</p><a data-l href="/support" class="btn g">Написать в поддержку</a></div>`;
const setup=()=>`<div class="ctr"><h1>Выберите ник</h1><p class="m">Латиница, цифры и _ (3–20 символов). Профиль будет по адресу /@ник</p><input id="nk" placeholder="ник"><br><button class="btn g" data-a="nick">Продолжить</button></div>`;

function main(){if(!S.ready)return;keep(()=>{const p=path();let h,t='Лента';
if(S.u&&!S.me){h=setup();t='Регистрация'}
else if(banned()&&p!='/support'){h=banScr();t='Бан'}
else if(!S.site&&!isM()){h=maint();t='Технические работы'}
else if(p=='/new'){h=newP();t='Новый пост'}
else if(p=='/support'){h=supP();t='Поддержка'}
else if(p=='/admin'&&isM()){h=admP();t='Админ панель'}
else if(p.startsWith('/p/')){h=postV();t=S.post?.title||'Пост'}
else if(p[1]=='@'){h=profV();t=S.pu?'@'+S.pu.nick:'Профиль'}
else if(p=='/'){h=feed()}else{h='<div class="ctr"><h1>Страница не найдена</h1></div>';t='404'}
$('#m').innerHTML=h;document.title=t+' · Trusiki';
document.querySelectorAll('#sb a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==p))})}

// ---------- routing ----------
const msgSub=uid=>{S.msg=[];S.tu?.();S.tu=onSnapshot(query(collection(db,'support',uid,'msgs'),orderBy('ts')),s=>{S.msg=s.docs.map(d=>d.data());main()})};
function nav(){S.rs.forEach(f=>f());S.rs=[];S.menu=S.pm=null;const p=path();
if(p.startsWith('/p/')){const id=p.slice(3);S.post=undefined;S.cm=[];
S.rs.push(onSnapshot(doc(db,'posts',id),d=>{S.post=d.exists()?{id:d.id,...d.data()}:null;main()}),onSnapshot(query(collection(db,'posts',id,'comments'),orderBy('ts')),s=>{S.cm=s.docs.map(d=>({id:d.id,...d.data()}));main()}))}
else if(p[1]=='@'){S.pu=undefined;S.pfo=[];S.pg=[];S.ptab='p';const n=p.slice(2).toLowerCase();
S.rs.push(onSnapshot(query(collection(db,'users'),where('nick','==',n)),async s=>{if(s.empty){S.pu=null;return main()}const d=s.docs[0];S.pu={uid:d.id,...d.data()};
if(!S.fo)S.fo=1,S.rs.push(onSnapshot(query(collection(db,'users'),where('following','array-contains',d.id)),f=>{S.pfo=f.docs.map(x=>({uid:x.id,...x.data()}));main()}));
S.pg=(await Promise.all((S.pu.following||[]).slice(0,30).map(i=>getDoc(doc(db,'users',i))))).filter(y=>y.exists()).map(y=>({uid:y.id,...y.data()}));main()}));S.fo=0}
else if(p=='/support'&&S.me)msgSub(S.me.uid);
else if(p=='/admin'&&isM()){S.th=null;S.msg=[];
S.rs.push(onSnapshot(collection(db,'bans'),s=>{S.bans=s.docs.map(d=>({id:d.id,...d.data()}));main()}),onSnapshot(collection(db,'support'),s=>{S.sup=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.last-a.last);main()}),()=>S.tu?.())}
hdr();main()}
const go=u=>{if(location.pathname!=u)history.pushState(0,'',u);nav();scrollTo(0,0)};
addEventListener('popstate',nav);

// ---------- actions ----------
const A={login,
sb(){S.sb=!S.sb;hdr()},
new(){if(!S.me)return login();go('/new')},
um(){S.menu=S.menu=='um'?null:'um';hdr();main()},
bell(){if(!S.me)return login();S.menu=S.menu=='bell'?null:'bell';hdr();if(S.menu)S.nt.filter(x=>!x.read).forEach(x=>updateDoc(doc(db,'notifs',x.id),{read:true}))},
nt(d){S.ntab=d.k;hdr()},
pm(d){S.pm=S.pm==d.id?null:d.id;main()},
flt(){S.menu=S.menu=='flt'?null:'flt';main()},
f(d){S.f=d.k;S.menu=null;main()},tab(d){S.tab=d.k;main()},pt(d){S.ptab=d.k;main()},
adm(){S.adm=!S.adm;localStorage.adm=S.adm?'1':'0';hdr();main()},
site(){setDoc(doc(db,'config','site'),{on:!S.site})},
out(){signOut(auth);S.menu=null;go('/')},
async nick(){const n=$('#nk').value.toLowerCase().trim();if(!/^[a-z0-9_]{3,20}$/.test(n))return toast('Ник: 3–20 символов, латиница, цифры и _');
if(!(await getDocs(query(collection(db,'users'),where('nick','==',n)))).empty)return toast('Этот ник уже занят');
await setDoc(doc(db,'users',S.u.uid),{nick:n,photo:S.u.photoURL||'',created:Date.now(),following:[],hidden:[]})},
async like(d){if(!S.me)return login();const p=S.post?.id==d.id?S.post:S.posts.find(x=>x.id==d.id),on=(p.likes||[]).includes(S.me.uid);
await updateDoc(doc(db,'posts',d.id),{likes:on?arrayRemove(S.me.uid):arrayUnion(S.me.uid)});if(!on)ntf(p.uid,'like',`@${S.me.nick} оценил «${p.title}»`,'/p/'+d.id)},
async cm(d){if(!S.me)return login();const t=$('#ci').value.trim();if(!t)return;if(rl('c').length>=2&&!await captcha())return;
await addDoc(collection(db,'posts',d.id,'comments'),{uid:S.me.uid,nick:S.me.nick,photo:S.me.photo||'',text:t.slice(0,500),ts:Date.now()});
await updateDoc(doc(db,'posts',d.id),{cc:increment(1)});rl('c',1);ntf(S.post.uid,'reply',`@${S.me.nick} прокомментировал «${S.post.title}»`,'/p/'+d.id);$('#ci').value=''},
async dc(d){if(!confirm('Удалить комментарий?'))return;await deleteDoc(doc(db,'posts',d.id,'comments',d.c));updateDoc(doc(db,'posts',d.id),{cc:increment(-1)})},
async pub(){const t=S.t.trim();if(!t)return toast('Введите название');const a=rl('p'),last=a[a.length-1];
if(last&&Date.now()-last<6e4)return toast(`Кулдаун: подождите ${Math.ceil((6e4-Date.now()+last)/1e3)} сек`);if(a.length>=3&&!await captcha())return;
const r=await addDoc(collection(db,'posts'),{title:t,text:S.d,img:S.img,uid:S.me.uid,nick:S.me.nick,photo:S.me.photo||'',ts:Date.now(),likes:[],cc:0,pinned:false});
rl('p',1);S.t=S.d=S.img='';go('/p/'+r.id)},
async del(d){const p=S.post?.id==d.id?S.post:S.posts.find(x=>x.id==d.id);if(!p)return;let r=null;
if(p.uid!=S.me.uid){r=prompt('Причина удаления (необязательно).\nПусто — удалить без уведомления автору.\n«Отмена» — не удалять.');if(r===null)return}else if(!confirm('Удалить пост?'))return;
const cs=await getDocs(collection(db,'posts',d.id,'comments'));await Promise.all(cs.docs.map(x=>deleteDoc(x.ref)));await deleteDoc(doc(db,'posts',d.id));
if(r)ntf(p.uid,'sys',`Ваш пост «${p.title}» удалён администратором. Причина: ${r}`,'/');S.pm=null;if(path().startsWith('/p/'))go('/')},
pin(d){const p=S.post?.id==d.id?S.post:S.posts.find(x=>x.id==d.id);S.pm=null;updateDoc(doc(db,'posts',d.id),{pinned:!p.pinned})},
async hide(d){await updateDoc(doc(db,'users',S.me.uid),{hidden:arrayUnion(d.u)});S.pm=null;toast('Посты автора скрыты из ленты');if(path()[1]=='@')go('/')},
fol(d){updateDoc(doc(db,'users',S.me.uid),{following:S.me.following?.includes(d.u)?arrayRemove(d.u):arrayUnion(d.u)})},
async ss(){const i=$('#si'),t=i.value.trim();if(!t)return;const ad=path()=='/admin',uid=ad?S.th:S.me.uid;if(!uid)return;
await addDoc(collection(db,'support',uid,'msgs'),{from:ad?'a':'u',text:t,ts:Date.now()});
await setDoc(doc(db,'support',uid),{nick:ad?S.thn:S.me.nick,last:Date.now(),txt:t},{merge:true});
if(ad)addDoc(collection(db,'notifs'),{to:uid,type:'reply',text:'Поддержка ответила: '+t.slice(0,80),link:'/support',ts:Date.now(),read:false});i.value=''},
th(d){S.th=d.id;S.thn=d.n;msgSub(d.id);main()},
async ban(){const n=$('#bn').value.trim().toLowerCase().replace(/^@/,''),r=$('#br').value.trim(),d=+$('#bd').value||0;if(!n)return toast('Введите ник');
const s=await getDocs(query(collection(db,'users'),where('nick','==',n)));if(s.empty)return toast('Такого ника нет');
await setDoc(doc(db,'bans',s.docs[0].id),{nick:n,reason:r||'Не указана',until:d?Date.now()+d*864e5:0});$('#bn').value=$('#br').value=$('#bd').value='';toast('Забанен')},
unban(d){deleteDoc(doc(db,'bans',d.id))},
bt(d){const n=prompt('Новый срок в днях (0 — навсегда)');if(n!==null)updateDoc(doc(db,'bans',d.id),{until:+n?Date.now()+n*864e5:0})}};
document.addEventListener('click',e=>{const l=e.target.closest('a[data-l]');if(l){e.preventDefault();return go(l.getAttribute('href'))}
const b=e.target.closest('[data-a]');if(!b&&!e.target.closest('.pop')&&(S.menu||S.pm)){S.menu=S.pm=null;hdr();main()}
if(b)A[b.dataset.a]?.(b.dataset)});
document.addEventListener('input',e=>{const i=e.target;if(i.id=='q'){S.q=i.value;path()=='/'?main():go('/')}else if(i.id=='pt')S.t=i.value;else if(i.id=='pd')S.d=i.value;else if(i.id=='bs'){S.bsq=i.value;main()}});
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;if(e.target.id=='ci')A.cm({id:S.post.id});if(e.target.id=='si')A.ss()});
const pick=async f=>{if(f?.type.startsWith('image/')){S.img=await rs(f);main()}};
document.addEventListener('change',e=>{if(e.target.id=='fi')pick(e.target.files[0])});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{if(e.target.closest('.drop')){e.preventDefault();pick(e.dataTransfer.files[0])}});

// ---------- realtime ----------
onSnapshot(query(collection(db,'posts'),orderBy('ts','desc'),limit(150)),s=>{S.posts=s.docs.map(d=>({id:d.id,...d.data()}));if(path()!='/new')main()});
onSnapshot(doc(db,'config','site'),d=>{S.site=!d.exists()||d.data().on!==false;hdr();main()});
let un=[],navd=0;
onAuthStateChanged(auth,u=>{un.forEach(f=>f());un=[];S.u=u;S.me=null;S.ban=null;S.nt=[];navd=0;
if(!u){S.ready=true;return nav()}
un.push(onSnapshot(doc(db,'users',u.uid),d=>{S.me=d.exists()?{uid:u.uid,...d.data()}:null;S.ready=true;if(!navd){navd=1;nav()}else{hdr();main()}}),
onSnapshot(doc(db,'bans',u.uid),d=>{S.ban=d.exists()?d.data():null;main()}),
onSnapshot(query(collection(db,'notifs'),where('to','==',u.uid)),s=>{S.nt=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);hdr()}))});
</script></body></html>
