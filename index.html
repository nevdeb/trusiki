    const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

    function evaluateBoard(chess) {
      if (chess.in_checkmate()) {
        return chess.turn() === 'w' ? -99999 : 99999;
      }
      if (chess.in_draw() || chess.in_stalemate()) return 0;

      const board = chess.board();
      let score = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (!p) continue;
          let val = PIECE_VALUES[p.type] || 0;
          // Позиционный бонус за контроль центра
          if ((r === 3 || r === 4) && (c === 3 || c === 4)) val += 22;
          else if (r >= 2 && r <= 5 && c >= 2 && c <= 5) val += 10;
          score += p.color === 'w' ? val : -val;
        }
      }
      return score;
    }

    function minimax(chess, depth, alpha, beta, isMaximizing) {
      if (depth === 0 || chess.game_over()) {
        return evaluateBoard(chess);
      }
      const moves = chess.moves();
      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < moves.length; i++) {
          chess.move(moves[i]);
          const ev = minimax(chess, depth - 1, alpha, beta, false);
          chess.undo();
          if (ev > maxEval) maxEval = ev;
          if (ev > alpha) alpha = ev;
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let i = 0; i < moves.length; i++) {
          chess.move(moves[i]);
          const ev = minimax(chess, depth - 1, alpha, beta, true);
          chess.undo();
          if (ev < minEval) minEval = ev;
          if (ev < beta) beta = ev;
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function computeBotBestMove(fen, bot) {
      const chess = new Chess(fen);
      const moves = chess.moves({ verbose: true });
      if (moves.length === 0) return null;

      // Для слабых ботов (Ларри / Гоблин) иногда допускается неточный ход
      if (bot.blunderChance > 0 && Math.random() < bot.blunderChance) {
        return moves[Math.floor(Math.random() * moves.length)];
      }

      const isMaximizing = chess.turn() === 'w';
      let bestMove = moves[0];
      let bestScore = isMaximizing ? -Infinity : Infinity;

      // Сортируем взятия первыми для ускорения отсечения альфа-бета
      moves.sort((a, b) => (b.captured ? 1 : 0) - (a.captured ? 1 : 0));

      for (const mv of moves) {
        chess.move(mv);
        const sc = minimax(chess, bot.depth - 1, -Infinity, Infinity, !isMaximizing);
        chess.undo();
        if (isMaximizing) {
          if (sc > bestScore) { bestScore = sc; bestMove = mv; }
        } else {
          if (sc < bestScore) { bestScore = sc; bestMove = mv; }
        }
      }
      return bestMove;
    }

    function calculateEloDelta(myElo, oppElo, score, gamesPlayed) {
      // В первых 8 партиях K-фактор высокий (дает/снимает 80–200 Эло)
      const kFactor = gamesPlayed < 8 ? 240 : 32;
      const expected = 1 / (1 + Math.pow(10, (oppElo - myElo) / 400));
      let delta = Math.round(kFactor * (score - expected));
      if (gamesPlayed < 8 && score === 1) {
        delta = Math.max(85, Math.min(200, delta));
      } else if (gamesPlayed < 8 && score === 0) {
        delta = -Math.max(80, Math.min(190, Math.abs(delta)));
      }
      return delta;
    }

    function syncFmAudioPlayback(fmState) {
      if (!fmState || !fmState.playing) {
        if (fmTimer) { clearInterval(fmTimer); fmTimer = null; }
        fmIsPlayingLocally = false;
        return;
      }
      if (fmIsPlayingLocally) return;
      fmIsPlayingLocally = true;
      try {
        if (!fmAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          fmAudioCtx = new AudioCtx();
        }
        if (fmAudioCtx.state === 'suspended') fmAudioCtx.resume();
        const notes = [261.63, 329.63, 392.0, 493.88, 392.0, 329.63, 293.66, 349.23];
        let step = Math.floor((fmState.positionSec || 0) * 2) % notes.length;
        fmTimer = setInterval(() => {
          if (!fmAudioCtx) return;
          const osc = fmAudioCtx.createOscillator();
          const gain = fmAudioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = notes[step % notes.length];
          gain.gain.setValueAtTime(0.06, fmAudioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, fmAudioCtx.currentTime + 0.38);
          osc.connect(gain);
          gain.connect(fmAudioCtx.destination);
          osc.start();
          osc.stop(fmAudioCtx.currentTime + 0.4);
          step++;
        }, 450);
      } catch (e) {}
    }

      if (!user) return false;
      if (state.currentUser && user.uid === state.currentUser.uid) return true;
      return user.online === true && (Date.now() - (user.lastSeen || 0)) < 90000;
    }

    function renderTitleBadge(title) {
      if (!title) return '';
      return `<span class="inline-flex items-center px-1.5 py-0.5 rounded bg-[#991b1b] text-white font-extrabold text-[10px] leading-none tracking-wide uppercase shadow-xs">${escapeHtml(title)}</span>`;
    }

    function getTimeCategoryKey(minutes) {
      if (Number(minutes) === 1) return 'bullet';
      if (Number(minutes) === 3) return 'blitz';
      return 'rapid';
    }

    function getUserRatingForTime(user, minutes) {
      if (!user || !user.ratings) return 500;
      const key = getTimeCategoryKey(minutes);
      return Number(user.ratings[key]) || 500;
    }

    function formatClock(ms) {
      const safe = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(safe / 60);
      const s = safe % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function showToast(text, type = 'info') {
      const box = document.getElementById('toast-box');
      if (!box) return;
      const el = document.createElement('div');
      el.className = `px-4 py-2.5 rounded-xl border text-xs font-semibold shadow-2xl pointer-events-auto ${
        type === 'error'
          ? 'bg-red-950/95 border-red-500/50 text-red-200'
          : 'bg-grayNav/95 border-tealAccent/50 text-tealBright'
      }`;
      el.textContent = text;
      box.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // =========================================================================
    // МАРШРУТИЗАЦИЯ С ЧИСТЫМИ ССЫЛКАМИ (БЕЗ ПЕРЕЗАГРУЗКИ И МОРГАНИЯ)
    // =========================================================================
    window.navigate = function(newPath, replace = false) {
      if (!newPath.startsWith('/')) newPath = '/' + newPath;
      state.path = newPath;
      state.nickMenuOpen = null;
      if (replace) window.history.replaceState({}, '', newPath);
      else window.history.pushState({}, '', newPath);

      if (newPath === '/courses' && !state.lessonChess) {
        const data = getLessonData(state.selectedLessonNum);
        state.lessonChess = new Chess(data.fen);
      }
      renderApp();
    };

    window.addEventListener('popstate', () => {
      state.path = window.location.pathname || '/';
      renderApp();
    });

    // =========================================================================
    // ПРОВЕРКА БАНА ТЕКУЩЕГО ПОЛЬЗОВАТЕЛЯ
    // =========================================================================
    function getActiveBanForCurrentUser() {
      if (!state.currentUser) return null;
      const ban = state.bansMap[state.currentUser.uid];
      if (!ban) return null;
      if (ban.expiresAt && ban.expiresAt !== 'forever' && Date.now() > Number(ban.expiresAt)) {
        remove(ref(rtdb, `bc_bans/${state.currentUser.uid}`)).catch(() => {});
        return null;
      }
      return ban;
    }

    function formatBanDuration(expiresAt) {
      if (!expiresAt || expiresAt === 'forever') return 'Навсегда';
      const diff = Number(expiresAt) - Date.now();
      if (diff <= 0) return 'Истёк';
      const mins = Math.ceil(diff / 60000);
      if (mins < 60) return `${mins} мин.`;
      const hrs = Math.ceil(mins / 60);
      if (hrs < 48) return `${hrs} ч.`;
      const days = Math.ceil(hrs / 24);
      return `${days} дн.`;
    }

    // =========================================================================
    // REALTIME DATABASE: СЛУШАТЕЛИ И ОНЛАЙН-ПРИСУТСТВИЕ
    // =========================================================================
    function initRealtimeListeners() {
      onValue(ref(rtdb, 'bc_users'), (snap) => {
        const val = snap.val() || {};
        state.usersMap = val;
        if (state.currentUser && val[state.currentUser.uid]) {
          state.currentUser = val[state.currentUser.uid];
          updateHeaderUserUI();
        }
        renderSearchPopoverContent();
        if (state.path === '/' || state.path.startsWith('/@') || state.path === '/settings') {
          renderApp();
        }
      });

      onValue(ref(rtdb, 'bc_bans'), (snap) => {
        state.bansMap = snap.val() || {};
        renderApp();
      });

      onValue(ref(rtdb, 'bc_archives'), (snap) => {
        state.userArchives = snap.val() || {};
        if (state.path.startsWith('/@')) renderApp();
      });

      onValue(ref(rtdb, 'bc_games'), (snap) => {
        if (!state.currentUser) return;
        const games = snap.val() || {};
        const myUid = state.currentUser.uid;
        const myActive = Object.values(games).find(
          g => g && g.status === 'active' && (g.whiteUid === myUid || g.blackUid === myUid)
        );
        if (myActive && state.activeGameId !== myActive.id) {
          joinActiveGameListener(myActive.id);
        }
      });
    }

    function attachUserSpecificListeners(uid) {
      if (unsubChallenges) unsubChallenges();
      unsubChallenges = onValue(ref(rtdb, `bc_challenges/${uid}`), (snap) => {
        state.incomingChallenges = snap.val() || {};
        renderIncomingChallenges();
      });

      const userRef = ref(rtdb, `bc_users/${uid}`);
      update(userRef, { online: true, lastSeen: Date.now() }).catch(() => {});
      onDisconnect(ref(rtdb, `bc_users/${uid}/online`)).set(false).catch(() => {});
    }

    setInterval(() => {
      if (state.currentUser) {
        update(ref(rtdb, `bc_users/${state.currentUser.uid}`), {
          online: true,
          lastSeen: Date.now()
        }).catch(() => {});
      }
    }, 25000);

    function joinActiveGameListener(gameId) {
      if (unsubActiveGame) unsubActiveGame();
      state.activeGameId = gameId;
      state.viewMoveIndex = null;
      state.gameOverModalDismissed = false;
      state.selectedSquare = null;
      state.legalTargets = [];

      unsubActiveGame = onValue(ref(rtdb, `bc_games/${gameId}`), (snap) => {
        const g = snap.val();
        if (!g) return;
        const prevMovesLen = state.activeGame?.moves?.length || 0;
        const newMovesLen = g.moves?.length || 0;
        state.activeGame = g;

        syncFmAudioPlayback(g.fmPlayer);

        if (newMovesLen > prevMovesLen && state.viewMoveIndex !== null) {
          state.viewMoveIndex = null;
        }

        if (!state.path.startsWith('/game/')) {
          navigate(`/game/${gameId}`, true);
        } else {
          // Обновляем только область игры без мигания шапки
          renderApp();
        }

        // Если это партия с ботом и сейчас ход бота — запускаем ход бота
        if (g.status === 'active' && g.isBotGame && g.turn === g.botColor) {
          scheduleBotTurn(g);
        }
      });
    }

    // =========================================================================
    // АВТОРИЗАЦИЯ (ТОЛЬКО ВХОД И РЕГИСТРАЦИЯ ПО ПОЧТЕ / GOOGLE)
    // =========================================================================
    function setSessionUser(userObj) {
      state.currentUser = userObj;
      state.usersMap[userObj.uid] = userObj;
      localStorage.setItem(LS_SESSION_UID, userObj.uid);
      updateHeaderUserUI();
      attachUserSpecificListeners(userObj.uid);
    }

    window.handleGoogleAuth = async function() {
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const res = await signInWithPopup(auth, provider);
        const gUser = res.user;

        const snap = await get(ref(rtdb, `bc_users/g_${gUser.uid}`));
        if (snap.exists()) {
          setSessionUser(snap.val());
          navigate('/', true);
          showToast(`Добро пожаловать, ${snap.val().nick}!`);
          return;
        }

        const rawSuggest = (gUser.email ? gUser.email.split('@')[0] : 'Player').replace(/[^a-zA-Zа-яА-Я0-9]/g, '').slice(0, 10);
        state.pendingGoogleUser = {
          uid: `g_${gUser.uid}`,
          authUid: gUser.uid,
          email: gUser.email || '',
          suggestedNick: rawSuggest.length >= 3 ? rawSuggest : 'Player'
        };
        renderApp();
      } catch (err) {
        showToast(err?.message || 'Ошибка входа через Google', 'error');
      }
    };

    window.handleCompleteGoogleSetup = async function(event) {
      event.preventDefault();
      if (!state.pendingGoogleUser) return;
      const nickRaw = document.getElementById('gsetup-nick').value.trim().replace(/^@+/, '');
      const pass = document.getElementById('gsetup-pass').value;
      const norm = normalizeNick(nickRaw);

      if (nickRaw.length < 3 || nickRaw.length > 10) {
        showToast('Ник должен содержать от 3 до 10 букв/символов', 'error');
        return;
      }
      const taken = Object.values(state.usersMap).some(u => normalizeNick(u.nick) === norm);
      if (taken) {
        showToast('Этот никнейм уже занят!', 'error');
        return;
      }

      const newUser = {
        uid: state.pendingGoogleUser.uid,
        authUid: state.pendingGoogleUser.authUid,
        email: state.pendingGoogleUser.email,
        nick: nickRaw,
        nickLower: norm,
        password: pass,
        title: '',
        coachId: null,
        ratings: { bullet: 500, blitz: 500, rapid: 500 },
        gamesCount: { bullet: 0, blitz: 0, rapid: 0 },
        friends: {},
        friendRequests: {},
        showArchivePublic: true,
        completedLessons: {},
        online: true,
        lastSeen: Date.now(),
        createdAt: Date.now()
      };

      await set(ref(rtdb, `bc_users/${newUser.uid}`), newUser);
      state.pendingGoogleUser = null;
      setSessionUser(newUser);
      state.onboardingCoachIdx = 0;
      renderApp();
    };

    window.handleEmailRegister = async function(event) {
      event.preventDefault();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-pass').value;
      const nickRaw = document.getElementById('reg-nick').value.trim().replace(/^@+/, '');
      const norm = normalizeNick(nickRaw);

      if (nickRaw.length < 3 || nickRaw.length > 10) {
        showToast('Ник должен быть от 3 до 10 букв/символов', 'error');
        return;
      }
      const taken = Object.values(state.usersMap).some(u => normalizeNick(u.nick) === norm);
      if (taken) {
        showToast('Этот ник уже занят!', 'error');
        return;
      }

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        const newUser = {
          uid: `e_${cred.user.uid}`,
          authUid: cred.user.uid,
          email,
          nick: nickRaw,
          nickLower: norm,
          password: pass,
          title: '',
          coachId: null,
          ratings: { bullet: 500, blitz: 500, rapid: 500 },
          gamesCount: { bullet: 0, blitz: 0, rapid: 0 },
          friends: {},
          friendRequests: {},
          showArchivePublic: true,
          completedLessons: {},
          online: true,
          lastSeen: Date.now(),
          createdAt: Date.now()
        };
        await set(ref(rtdb, `bc_users/${newUser.uid}`), newUser);
        setSessionUser(newUser);
        state.onboardingCoachIdx = 0;
        renderApp();
      } catch (err) {
        showToast(err?.message || 'Ошибка регистрации по почте', 'error');
      }
    };

    window.handleLoginSubmit = async function(event) {
      event.preventDefault();
      const loginId = document.getElementById('login-id').value.trim();
      const pass = document.getElementById('login-pass').value;
      if (!loginId || !pass) return;

      if (loginId.includes('@') && !loginId.startsWith('@')) {
        try {
          const cred = await signInWithEmailAndPassword(auth, loginId, pass);
          const found = Object.values(state.usersMap).find(u => u.authUid === cred.user.uid);
          if (found) {
            setSessionUser(found);
            navigate('/', true);
            return;
          }
        } catch (e) {}
      }

      const norm = normalizeNick(loginId);
      let user = Object.values(state.usersMap).find(
        u => normalizeNick(u.nick) === norm || (u.email && u.email.toLowerCase() === loginId.toLowerCase())
      );

      if (!user) {
        const snap = await get(ref(rtdb, 'bc_users'));
        const all = snap.val() || {};
        state.usersMap = all;
        user = Object.values(all).find(
          u => normalizeNick(u.nick) === norm || (u.email && u.email.toLowerCase() === loginId.toLowerCase())
        );
      }

      if (!user || user.password !== pass) {
        showToast('Неверная почта/ник или пароль', 'error');
        return;
      }

      setSessionUser(user);
      navigate('/', true);
    };

    window.logoutAccount = async function() {
      if (state.currentUser) {
        update(ref(rtdb, `bc_users/${state.currentUser.uid}`), { online: false }).catch(() => {});
      }
      state.currentUser = null;
      localStorage.removeItem(LS_SESSION_UID);
      try { await signOut(auth); } catch (e) {}
      updateHeaderUserUI();
      navigate('/', true);
    };

      state.onboardingCoachIdx = (state.onboardingCoachIdx + delta + COACHES.length) % COACHES.length;
      renderApp();

      const chosen = COACHES[state.onboardingCoachIdx];
      await update(ref(rtdb, `bc_users/${state.currentUser.uid}`), { coachId: chosen.id });
      state.currentUser.coachId = chosen.id;
      navigate('/', true);

    window.changeCoachInSettings = async function(coachId) {
      if (!state.currentUser) return;
      await update(ref(rtdb, `bc_users/${state.currentUser.uid}`), { coachId });
      state.currentUser.coachId = coachId;
      showToast('Тренер изменён!');

    // =========================================================================
    // ПОИСК ИГРОКОВ С ЗЕЛЁНЫМ ИНДИКАТОРОМ ОНЛАЙНА И ДРУЗЬЯ
    // =========================================================================
    window.toggleSearchPopover = function(event) {
      if (event) event.stopPropagation();
      state.searchPopoverOpen = !state.searchPopoverOpen;
      const pop = document.getElementById('search-popover');
      if (state.searchPopoverOpen) {
        pop.classList.remove('hidden');
        renderSearchPopoverContent();
      } else {
        pop.classList.add('hidden');
      }
    };

    window.setSearchPopoverTab = function(tab) {
      state.searchPopoverTab = tab;
      const tSearch = document.getElementById('sp-tab-search');
      const tReq = document.getElementById('sp-tab-requests');
      const sBox = document.getElementById('sp-search-box');
      if (tab === 'requests') {
        tReq.className = 'py-2.5 text-center border-b-2 border-tealAccent text-white bg-grayCard/60 cursor-pointer';
        tSearch.className = 'py-2.5 text-center border-b-2 border-transparent text-gray-400 hover:text-white cursor-pointer';
        sBox.classList.add('hidden');
      } else {
        tSearch.className = 'py-2.5 text-center border-b-2 border-tealAccent text-white bg-grayCard/60 cursor-pointer';
        tReq.className = 'py-2.5 text-center border-b-2 border-transparent text-gray-400 hover:text-white cursor-pointer';
        sBox.classList.remove('hidden');
      }
      renderSearchPopoverContent();
    };

    function renderSearchPopoverContent() {
      const listEl = document.getElementById('sp-list');
      const badgeEl = document.getElementById('friend-req-badge');
      const reqCountEl = document.getElementById('sp-req-count');
      if (!listEl) return;

      const reqs = state.currentUser?.friendRequests ? Object.keys(state.currentUser.friendRequests) : [];
      if (badgeEl) {
        badgeEl.textContent = String(reqs.length);
        badgeEl.classList.toggle('hidden', reqs.length === 0);
      }
      if (reqCountEl) reqCountEl.textContent = reqs.length > 0 ? `(${reqs.length})` : '';

      if (state.searchPopoverTab === 'requests') {
        if (!state.currentUser || reqs.length === 0) {
          listEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">Входящих запросов в друзья нет</p>`;
          return;
        }
        listEl.innerHTML = reqs.map(fromUid => {
          const u = state.usersMap[fromUid] || { uid: fromUid, nick: 'Игрок' };
          return `
            <div class="p-2.5 rounded-xl bg-grayBase border border-grayBorder flex items-center justify-between gap-2">
              <button onclick="openUserProfileByNick('${escapeHtml(u.nick)}')" class="text-xs font-bold text-white hover:text-tealAccent truncate cursor-pointer">
                ${renderTitleBadge(u.title)} ${escapeHtml(u.nick)}
              </button>
              <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="acceptFriendRequest('${escapeHtml(u.uid)}')"
                        class="px-2.5 py-1 rounded-lg bg-tealAccent text-black text-[11px] font-bold cursor-pointer">Принять</button>
                <button onclick="declineFriendRequest('${escapeHtml(u.uid)}')"
                        class="px-2 py-1 rounded-lg bg-grayCard text-gray-300 text-[11px] cursor-pointer">✕</button>
              </div>
            </div>
          `;
        }).join('');
        return;
      }

      const q = (document.getElementById('sp-search-input')?.value || '').trim().toLowerCase();
      const myUid = state.currentUser?.uid;
      const myFriends = state.currentUser?.friends || {};

      let candidates = Object.values(state.usersMap).filter(u => u && u.uid !== myUid && u.nick);
      if (q) {
        candidates = candidates.filter(u => normalizeNick(u.nick).includes(normalizeNick(q)));
      } else {
        candidates.sort((a, b) => (myFriends[b.uid] ? 1 : 0) - (myFriends[a.uid] ? 1 : 0));
      }

      if (candidates.length === 0) {
        listEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">Игроки не найдены</p>`;
        return;
      }

      listEl.innerHTML = candidates.slice(0, 15).map(u => {
        const isFriend = Boolean(myFriends[u.uid]);
        const online = isUserOnline(u);
        return `
          <div class="p-2.5 rounded-xl bg-grayBase hover:bg-grayCard border border-grayBorder flex items-center justify-between gap-2 transition-colors">
            <button onclick="openUserProfileByNick('${escapeHtml(u.nick)}')" class="flex items-center gap-2.5 min-w-0 text-left cursor-pointer">
              <div class="relative shrink-0">
                <span class="w-7 h-7 rounded-lg bg-tealDeep/40 border border-tealAccent/40 text-tealBright font-bold text-xs flex items-center justify-center">
                  ${escapeHtml(u.nick.charAt(0).toUpperCase())}
                </span>
                ${online ? `<span title="В сети" class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-400 ring-2 ring-grayBase"></span>` : ''}
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-1">
                  ${renderTitleBadge(u.title)}
                  <span class="text-xs font-bold text-white truncate">${escapeHtml(u.nick)}</span>
                </div>
                <p class="text-[10px] text-gray-400">${online ? '<span class="text-emerald-400">В сети</span> • ' : ''}Рапид: ${getUserRatingForTime(u, 10)}</p>
              </div>
            </button>
            <div class="flex items-center gap-1 shrink-0">
              ${!isFriend ? `
                <button onclick="sendFriendRequest('${escapeHtml(u.uid)}')"
                        class="px-2 py-1 rounded-lg bg-tealAccent/20 hover:bg-tealAccent/30 text-tealBright text-[11px] font-semibold cursor-pointer">
                  + Друг
                </button>
              ` : `
                <span class="px-2 py-0.5 rounded bg-grayCard text-[10px] text-tealAccent">Друг</span>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    window.sendFriendRequest = async function(targetUid) {
      if (!state.currentUser || targetUid === state.currentUser.uid) return;
      await set(ref(rtdb, `bc_users/${targetUid}/friendRequests/${state.currentUser.uid}`), true);
      showToast('Запрос в друзья отправлен!');
    };

    window.acceptFriendRequest = async function(fromUid) {
      if (!state.currentUser) return;
      const myUid = state.currentUser.uid;
      await update(ref(rtdb), {
        [`bc_users/${myUid}/friends/${fromUid}`]: true,
        [`bc_users/${fromUid}/friends/${myUid}`]: true,
        [`bc_users/${myUid}/friendRequests/${fromUid}`]: null
      });
      showToast('Игрок добавлен в друзья!');
      renderSearchPopoverContent();
    };

    window.declineFriendRequest = async function(fromUid) {
      if (!state.currentUser) return;
      await remove(ref(rtdb, `bc_users/${state.currentUser.uid}/friendRequests/${fromUid}`));
      renderSearchPopoverContent();
    };

    // =========================================================================
    // ПОДБОР СОПЕРНИКА (НАХОДИТ СРАЗУ ПРИ 2 ИГРОКАХ) И ВЫЗОВЫ ТОЛЬКО В ОНЛАЙНЕ
    // =========================================================================

      state.selectedTimeControl = mins;
      renderApp();
    };

    window.toggleRatedMode = function() {
      state.selectedRated = !state.selectedRated;
      renderApp();
    };

    window.openFriendChallengeSearch = function() {
      if (!state.currentUser) return;
      state.friendChallengeMode = true;
      state.friendChallengeTargetUid = null;
      state.friendSearchQuery = '';
      renderApp();
    };

    window.selectChallengeTarget = function(uid) {
      const target = state.usersMap[uid];
      if (!target || !isUserOnline(target)) {
        showToast('Приглашать можно только игроков, которые сейчас в онлайне', 'error');
        return;
      }
      state.friendChallengeTargetUid = uid;
      renderApp();
    };

    window.sendChallengeToUser = async function() {
      if (!state.currentUser || !state.friendChallengeTargetUid) return;
      const target = state.usersMap[state.friendChallengeTargetUid];
      if (!target || !isUserOnline(target)) {
        showToast('Игрок вышел из сети — приглашение недоступно', 'error');
        return;
      }
      const chId = 'ch_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const timeMins = state.selectedTimeControl;
      const elo = getUserRatingForTime(state.currentUser, timeMins);

      await set(ref(rtdb, `bc_challenges/${target.uid}/${chId}`), {
        id: chId,
        fromUid: state.currentUser.uid,
        fromNick: state.currentUser.nick,
        fromTitle: state.currentUser.title || '',
        fromElo: elo,
        timeMinutes: timeMins,
        rated: state.selectedRated,
        createdAt: Date.now()
      });

      state.friendChallengeMode = false;
      state.friendChallengeTargetUid = null;
      showToast(`Вызов отправлен игроку ${target.nick}!`);
      renderApp();
    };

    function renderIncomingChallenges() {
      const box = document.getElementById('challenge-popup-container');
      if (!box) return;
      const list = Object.values(state.incomingChallenges || {});
      if (list.length === 0) {
        box.innerHTML = '';
        return;
      }
      box.innerHTML = list.map(ch => `
        <div class="pointer-events-auto rounded-2xl bg-grayNav border-2 border-tealAccent p-4 shadow-2xl">
          <p class="text-xs text-tealBright font-bold uppercase tracking-wider">Вызов на партию</p>
          <p class="text-sm font-bold text-white mt-1 flex items-center gap-1 flex-wrap">
            <span>Вас приглашает</span>
            ${renderTitleBadge(ch.fromTitle)}
            <span class="text-tealAccent">${escapeHtml(ch.fromNick)}</span>
            <span>(${ch.fromElo})</span>
          </p>
          <p class="text-xs text-gray-300 mt-0.5">${ch.timeMinutes} мин • ${ch.rated ? 'Рейтинговая' : 'Товарищеская'}</p>
          <div class="mt-3 flex gap-2">
            <button onclick="acceptChallenge('${escapeHtml(ch.id)}')"
                    class="flex-1 py-2 rounded-xl bg-tealAccent hover:bg-tealBright text-black text-xs font-extrabold cursor-pointer">Принять</button>
            <button onclick="declineChallenge('${escapeHtml(ch.id)}')"
                    class="px-3 py-2 rounded-xl bg-grayCard hover:bg-grayHover text-gray-300 text-xs font-semibold cursor-pointer">Отклонить</button>
          </div>
        </div>
      `).join('');
    }

    window.declineChallenge = async function(chId) {
      if (!state.currentUser) return;
      await remove(ref(rtdb, `bc_challenges/${state.currentUser.uid}/${chId}`));
    };

    window.acceptChallenge = async function(chId) {
      if (!state.currentUser) return;
      const ch = state.incomingChallenges[chId];
      if (!ch) return;
      await remove(ref(rtdb, `bc_challenges/${state.currentUser.uid}/${chId}`));
      const challenger = state.usersMap[ch.fromUid] || { uid: ch.fromUid, nick: ch.fromNick, title: ch.fromTitle || '' };
      await createAndStartMatch(challenger, state.currentUser, ch.timeMinutes, ch.rated);
    };

    window.startQuickMatchmaking = async function() {
      if (!state.currentUser) return;
      const timeMins = state.selectedTimeControl;
      const rated = state.selectedRated;
      const queueKey = `${timeMins}_${rated ? 'rated' : 'casual'}`;
      const queueRef = ref(rtdb, `bc_queue/${queueKey}`);

      state.matchmakingStatus = 'searching';
      renderApp();

      const snap = await get(queueRef);
      const queue = snap.val() || {};
      const myUid = state.currentUser.uid;
      const now = Date.now();

      // Находит любого активного игрока в очереди сразу (без жестких фильтров по Эло)
      const opponentEntry = Object.values(queue).find(
        entry => entry && entry.uid !== myUid && (now - (entry.createdAt || 0)) < 120000
      );

      if (opponentEntry) {
        await remove(ref(rtdb, `bc_queue/${queueKey}/${opponentEntry.uid}`));
        await remove(ref(rtdb, `bc_queue/${queueKey}/${myUid}`));
        state.matchmakingStatus = null;
        const oppUser = state.usersMap[opponentEntry.uid] || { uid: opponentEntry.uid, nick: opponentEntry.nick };
        await createAndStartMatch(oppUser, state.currentUser, timeMins, rated);
      } else {
        const myQueueRef = ref(rtdb, `bc_queue/${queueKey}/${myUid}`);
        await set(myQueueRef, {
          uid: myUid,
          nick: state.currentUser.nick,
          createdAt: now
        });
        onDisconnect(myQueueRef).remove().catch(() => {});
      }
    };

    window.cancelMatchmaking = async function() {
      state.matchmakingStatus = null;
      if (state.currentUser) {
        const queueKey = `${state.selectedTimeControl}_${state.selectedRated ? 'rated' : 'casual'}`;
        await remove(ref(rtdb, `bc_queue/${queueKey}/${state.currentUser.uid}`)).catch(() => {});
      }
      renderApp();
    };

    async function createAndStartMatch(playerA, playerB, timeMinutes, rated, botConfig = null) {
      const whiteFirst = Math.random() < 0.5;
      const white = whiteFirst ? playerA : playerB;
      const black = whiteFirst ? playerB : playerA;

      const gameId = 'game_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
      const initialMs = Number(timeMinutes) * 60 * 1000;
      const startFen = new Chess().fen();

      const gameObj = {
        id: gameId,
        status: 'active',
        timeMinutes: Number(timeMinutes),
        rated: botConfig ? false : Boolean(rated),
        isBotGame: Boolean(botConfig),
        botId: botConfig ? botConfig.id : null,
        botColor: botConfig ? (white.uid === botConfig.uid ? 'w' : 'b') : null,
        whiteUid: white.uid,
        whiteNick: white.nick,
        whiteTitle: white.title || '',
        whiteElo: botConfig && white.uid === botConfig.uid ? botConfig.elo : getUserRatingForTime(white, timeMinutes),
        blackUid: black.uid,
        blackNick: black.nick,
        blackTitle: black.title || '',
        blackElo: botConfig && black.uid === botConfig.uid ? botConfig.elo : getUserRatingForTime(black, timeMinutes),
        fen: startFen,
        fens: [startFen],
        moves: [],
        chat: [],
        fmPlayer: { playing: false, positionSec: 0, updatedAt: Date.now() },
        turn: 'w',
        whiteTimeMs: initialMs,
        blackTimeMs: initialMs,
        lastMoveAt: Date.now(),
        startedAt: Date.now(),
        winnerUid: null,
        resultText: '',
        stats: {
          white: { brilliant: 0, best: 0, good: 0 },
          black: { brilliant: 0, best: 0, good: 0 }
        }
      };

      await set(ref(rtdb, `bc_games/${gameId}`), gameObj);
      joinActiveGameListener(gameId);
    }

    // =========================================================================
    // ИГРА С БОТАМИ (СТАРТ И ХОДЫ БОТА)
    // =========================================================================
    window.startBotGame = async function() {
      if (!state.currentUser) return;
      const bot = BOTS.find(b => b.id === state.selectedBotId) || BOTS[0];
      const botPlayer = {
        uid: `bot_${bot.id}`,
        nick: bot.name,
        title: bot.isBoss ? 'GM' : ''
      };
      await createAndStartMatch(state.currentUser, botPlayer, state.selectedTimeControl, false, {
        id: bot.id,
        uid: `bot_${bot.id}`,
        elo: bot.elo
      });
    };

    function scheduleBotTurn(g) {
      if (botMoveTimeout) clearTimeout(botMoveTimeout);
      botMoveTimeout = setTimeout(async () => {
        const latest = state.activeGame;
        if (!latest || latest.id !== g.id || latest.status !== 'active') return;
        if (latest.turn !== latest.botColor) return;

        const bot = BOTS.find(b => b.id === latest.botId) || BOTS[0];
        const moveObj = computeBotBestMove(latest.fen, bot);
        if (!moveObj) return;

        await applyMoveToGame(latest, moveObj.from, moveObj.to, latest.botColor);
      }, 450);
    }

    // =========================================================================
    // ХОДЫ НА ДОСКЕ (ПЕРЕТАСКИВАНИЕ МЫШКОЙ И КЛИК, БЕЗ МОРГАНИЯ)
    // =========================================================================
    function classifyMoveQuality(moveObj, chessAfter) {
      if (chessAfter.in_checkmate() || moveObj.flags.includes('p') || (moveObj.captured && ['q', 'r'].includes(moveObj.captured))) {
        return 'brilliant';
      }
      if (chessAfter.in_check() || moveObj.captured || moveObj.flags.includes('k') || moveObj.flags.includes('q')) {
        return 'best';
      }
      return 'good';
    }

    async function applyMoveToGame(g, fromSq, toSq, moverColor) {
      const chess = new Chess(g.fen);
      const moveResult = chess.move({ from: fromSq, to: toSq, promotion: 'q' });
      if (!moveResult) return false;

      const now = Date.now();
      const elapsed = now - (g.lastMoveAt || now);
      let wMs = g.whiteTimeMs;
      let bMs = g.blackTimeMs;
      if (moverColor === 'w') wMs = Math.max(0, wMs - elapsed);
      else bMs = Math.max(0, bMs - elapsed);

      const quality = classifyMoveQuality(moveResult, chess);
      const sideKey = moverColor === 'w' ? 'white' : 'black';
      const newStats = {
        white: { ...(g.stats?.white || { brilliant: 0, best: 0, good: 0 }) },
        black: { ...(g.stats?.black || { brilliant: 0, best: 0, good: 0 }) }
      };
      newStats[sideKey][quality] = (newStats[sideKey][quality] || 0) + 1;

      const nextMoves = [...(g.moves || []), moveResult.san];
      const nextFens = [...(g.fens || [g.fen]), chess.fen()];

      state.selectedSquare = null;
      state.legalTargets = [];

      const patch = {
        fen: chess.fen(),
        fens: nextFens,
        moves: nextMoves,
        turn: chess.turn(),
        whiteTimeMs: wMs,
        blackTimeMs: bMs,
        lastMoveAt: now,
        stats: newStats
      };

      state.activeGame = { ...g, ...patch };
      renderApp();

      if (chess.game_over()) {
        let winnerUid = 'draw';
        let reason = 'Ничья';
        if (chess.in_checkmate()) {
          winnerUid = moverColor === 'w' ? g.whiteUid : g.blackUid;
          reason = 'Мат';
        } else if (chess.in_stalemate()) {
          reason = 'Пат';
        }
        await finalizeGame({ ...g, ...patch }, winnerUid, reason);
      } else {
        await update(ref(rtdb, `bc_games/${g.id}`), patch);
      }
      return true;
    }

    window.onBoardSquareClick = async function(sq) {
      const g = state.activeGame;
      if (!g || g.status !== 'active' || !state.currentUser) return;

      if (state.viewMoveIndex !== null && state.viewMoveIndex < (g.moves?.length || 0)) {
        state.viewMoveIndex = null;
        renderApp();
        return;
      }

      const myColor = g.whiteUid === state.currentUser.uid ? 'w' : (g.blackUid === state.currentUser.uid ? 'b' : null);
      if (!myColor || g.turn !== myColor) return;

      const chess = new Chess(g.fen);
      const piece = chess.get(sq);

      if (state.selectedSquare && state.legalTargets.includes(sq)) {
        await applyMoveToGame(g, state.selectedSquare, sq, myColor);
        return;
      }

      if (piece && piece.color === myColor) {
        state.selectedSquare = sq;
        state.legalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to);
      } else {
        state.selectedSquare = null;
        state.legalTargets = [];
      }
      renderApp();
    };

    window.onPieceDragStart = function(event, sq) {
      const g = state.activeGame;
      if (!g || g.status !== 'active' || !state.currentUser) {
        event.preventDefault();
        return;
      }
      const myColor = g.whiteUid === state.currentUser.uid ? 'w' : (g.blackUid === state.currentUser.uid ? 'b' : null);
      if (!myColor || g.turn !== myColor) {
        event.preventDefault();
        return;
      }
      const chess = new Chess(g.fen);
      const piece = chess.get(sq);
      if (!piece || piece.color !== myColor) {
        event.preventDefault();
        return;
      }
      state.dragFromSquare = sq;
      state.selectedSquare = sq;
      state.legalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to);
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', sq);
    };

    window.onPieceDragOver = function(event) {
      event.preventDefault();
      event.currentTarget.classList.add('sq-drag-over');
    };

    window.onPieceDragLeave = function(event) {
      event.currentTarget.classList.remove('sq-drag-over');
    };

    window.onPieceDrop = async function(event, targetSq) {
      event.preventDefault();
      event.currentTarget.classList.remove('sq-drag-over');
      const fromSq = state.dragFromSquare || event.dataTransfer.getData('text/plain');
      state.dragFromSquare = null;
      if (!fromSq || fromSq === targetSq) return;

      const g = state.activeGame;
      if (!g || g.status !== 'active' || !state.currentUser) return;
      const myColor = g.whiteUid === state.currentUser.uid ? 'w' : (g.blackUid === state.currentUser.uid ? 'b' : null);
      if (!myColor || g.turn !== myColor) return;

      await applyMoveToGame(g, fromSq, targetSq, myColor);
    };

    window.resignActiveGame = async function() {
      const g = state.activeGame;
      if (!g || g.status !== 'active' || !state.currentUser) return;
      const isWhite = g.whiteUid === state.currentUser.uid;
      const winnerUid = isWhite ? g.blackUid : g.whiteUid;
      await finalizeGame(g, winnerUid, 'Сдача');
    };

    async function finalizeGame(g, winnerUid, reasonText) {
      if (g.status === 'finished') return;
      const finishedAt = Date.now();
      const durationSec = Math.max(1, Math.floor((finishedAt - (g.startedAt || finishedAt)) / 1000));

      const cat = getTimeCategoryKey(g.timeMinutes);
      const wUser = state.usersMap[g.whiteUid];
      const bUser = state.usersMap[g.blackUid];

      let whiteDelta = 0;
      let blackDelta = 0;
      if (g.rated && !g.isBotGame && winnerUid !== 'draw') {
        const wElo = getUserRatingForTime(wUser, g.timeMinutes);
        const bElo = getUserRatingForTime(bUser, g.timeMinutes);
        const wGames = Number(wUser?.gamesCount?.[cat] || 0);
        const bGames = Number(bUser?.gamesCount?.[cat] || 0);
        const wScore = winnerUid === g.whiteUid ? 1 : 0;
        const bScore = winnerUid === g.blackUid ? 1 : 0;
        whiteDelta = calculateEloDelta(wElo, bElo, wScore, wGames);
        blackDelta = calculateEloDelta(bElo, wElo, bScore, bGames);
      }

      const finalData = {
        ...g,
        status: 'finished',
        winnerUid,
        resultText: reasonText,
        finishedAt,
        durationSec,
        whiteDelta,
        blackDelta
      };

      await update(ref(rtdb, `bc_games/${g.id}`), finalData);

      if (wUser && !g.whiteUid.startsWith('bot_')) {
        const nextW = Math.max(100, getUserRatingForTime(wUser, g.timeMinutes) + whiteDelta);
        const nextWCount = Number(wUser?.gamesCount?.[cat] || 0) + 1;
        await update(ref(rtdb, `bc_users/${g.whiteUid}`), {
          [`ratings/${cat}`]: g.rated ? nextW : getUserRatingForTime(wUser, g.timeMinutes),
          [`gamesCount/${cat}`]: nextWCount
        });
        await set(ref(rtdb, `bc_archives/${g.whiteUid}/${g.id}`), finalData);
      }
      if (bUser && !g.blackUid.startsWith('bot_')) {
        const nextB = Math.max(100, getUserRatingForTime(bUser, g.timeMinutes) + blackDelta);
        const nextBCount = Number(bUser?.gamesCount?.[cat] || 0) + 1;
        await update(ref(rtdb, `bc_users/${g.blackUid}`), {
          [`ratings/${cat}`]: g.rated ? nextB : getUserRatingForTime(bUser, g.timeMinutes),
          [`gamesCount/${cat}`]: nextBCount
        });
        await set(ref(rtdb, `bc_archives/${g.blackUid}/${g.id}`), finalData);
      }
    }

    // Таймер часов + проверка 30 секунд бездействия (затягивание времени)
    if (clockInterval) clearInterval(clockInterval);
    clockInterval = setInterval(async () => {
      const g = state.activeGame;
      if (!g || g.status !== 'active' || !state.path.startsWith('/game/')) return;

      const now = Date.now();
      const elapsed = now - (g.lastMoveAt || now);
      const curW = g.turn === 'w' ? Math.max(0, g.whiteTimeMs - elapsed) : g.whiteTimeMs;
      const curB = g.turn === 'b' ? Math.max(0, g.blackTimeMs - elapsed) : g.blackTimeMs;

      const topClockEl = document.getElementById('clock-top');
      const botClockEl = document.getElementById('clock-bottom');
      const idleWarnEl = document.getElementById('idle-warning-bar');
      const isWhiteMe = state.currentUser && g.whiteUid === state.currentUser.uid;
      if (topClockEl) topClockEl.textContent = formatClock(isWhiteMe ? curB : curW);
      if (botClockEl) botClockEl.textContent = formatClock(isWhiteMe ? curW : curB);

      // Если игрок не ходит больше 30 секунд — техническое поражение за затягивание времени
      const idleRemaining = Math.max(0, 30 - Math.floor(elapsed / 1000));
      if (idleWarnEl) {
        if (elapsed >= 15000 && !g.isBotGame) {
          idleWarnEl.classList.remove('hidden');
          idleWarnEl.textContent = `Внимание: автопоражение за бездействие через ${idleRemaining} сек.`;
        } else {
          idleWarnEl.classList.add('hidden');
        }
      }

      if (elapsed >= 30000 && !g.isBotGame) {
        const winnerUid = g.turn === 'w' ? g.blackUid : g.whiteUid;
        await finalizeGame(g, winnerUid, 'Поражение: бездействие более 30 сек.');
        return;
      }

      if (curW <= 0 && g.turn === 'w') {
        await finalizeGame(g, g.blackUid, 'Время вышло');
      } else if (curB <= 0 && g.turn === 'b') {
        await finalizeGame(g, g.whiteUid, 'Время вышло');
      }
    }, 500);

        }

    window.stepGameMove = function(mode) {
      const g = state.activeGame;
      if (!g) return;
      const total = (g.fens?.length || 1) - 1;
      const cur = state.viewMoveIndex === null ? total : state.viewMoveIndex;
      if (mode === 'first') state.viewMoveIndex = 0;
      else if (mode === 'prev') state.viewMoveIndex = Math.max(0, cur - 1);
      else if (mode === 'next') state.viewMoveIndex = Math.min(total, cur + 1);
      else if (mode === 'last') state.viewMoveIndex = null;
      renderApp();
    };

    window.rematchSameSettings = async function() {

      if (!g || !state.currentUser) return;
      if (g.isBotGame) {
        await startBotGame();
        return;
      }
      const oppUid = g.whiteUid === state.currentUser.uid ? g.blackUid : g.whiteUid;
      const oppUser = state.usersMap[oppUid] || { uid: oppUid, nick: g.whiteUid === oppUid ? g.whiteNick : g.blackNick };
      state.gameOverModalDismissed = true;
      await createAndStartMatch(state.currentUser, oppUser, g.timeMinutes, g.rated);

    // =========================================================================

    window.onLessonSquareClick = async function(sq) {
      const data = getLessonData(state.selectedLessonNum);
      if (!state.lessonChess) state.lessonChess = new Chess(data.fen);
      const chess = state.lessonChess;
      const turn = chess.turn();
      const piece = chess.get(sq);

      if (state.lessonSelectedSq && state.lessonLegalTargets.includes(sq)) {
        const mv = chess.move({ from: state.lessonSelectedSq, to: sq, promotion: 'q' });
        state.lessonSelectedSq = null;
        state.lessonLegalTargets = [];
        if (mv) {
          if (data.validSans.includes(mv.san)) {
            state.lessonIsError = false;
            state.lessonStatusMsg = `Верно! Ход ${mv.san} правильный. Урок #${state.selectedLessonNum} засчитан!`;
            if (state.currentUser) {
              await set(ref(rtdb, `bc_users/${state.currentUser.uid}/completedLessons/${state.selectedLessonNum}`), true);
            }
          } else {
            // Ошибка — откатываем ход и сообщаем ученику
            chess.undo();
            state.lessonIsError = true;
            state.lessonStatusMsg = `Неверный ход (${mv.san}). Подумайте ещё и попробуйте снова!`;
          }
        }
        renderApp();
        return;
      }

      if (piece && piece.color === turn) {
        state.lessonSelectedSq = sq;
        state.lessonLegalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to);
      } else {
        state.lessonSelectedSq = null;
        state.lessonLegalTargets = [];
      }
      renderApp();
    };

      const now = Date.now();
      const mapMs = {
        '1h': 3600 * 1000,
        '1d': 86400 * 1000,
        '7d': 7 * 86400 * 1000,
        '12d': 12 * 86400 * 1000,
        '30d': 30 * 86400 * 1000

      await set(ref(rtdb, `bc_bans/${state.adminBanTargetUid}`), {
        uid: state.adminBanTargetUid,
        nick: targetUser?.nick || 'Игрок',
        reason,
        durationLabel: dur,
        expiresAt,
        bannedAt: now
      });

      state.adminBanTargetUid = null;
      state.adminBanSearch = '';
      showToast('Игрок забанен!');
      renderApp();

    window.adminForceChangeNick = async function(event) {
      event.preventDefault();
      if (!isCurrentUserAdmin() || !state.adminNickTargetUid) return;

    // =========================================================================
    // РЕНДЕР ШАХМАТНОЙ ДОСКИ (DRAG & DROP + КЛИК)
    // =========================================================================
    function renderChessBoardHtml({ fen, flipped = false, selectedSq = null, legalTargets = [], onSquareClickFn = 'onBoardSquareClick', draggable = false }) {
      const chess = new Chess(fen);
      const board = chess.board();
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      const ranks = [8, 7, 6, 5, 4, 3, 2, 1];

      const rowOrder = flipped ? [...ranks].reverse() : ranks;
      const colOrder = flipped ? [...files].reverse() : files;

      const lightSq = state.boardTheme === 'wood' ? 'bg-[#ebd3b0]' : 'bg-[#dee3e6]';
      const darkSq = state.boardTheme === 'wood' ? 'bg-[#a9784f]' : 'bg-[#4b8b7a]';

      let cells = '';
      rowOrder.forEach((rank, rIdx) => {
        colOrder.forEach((file, cIdx) => {
          const sq = `${file}${rank}`;
          const fileNum = files.indexOf(file);
          const rankNum = 8 - rank;
          const isLight = (fileNum + rankNum) % 2 === 0;
          const piece = board[rankNum][fileNum];
          const isSelected = selectedSq === sq;
          const isTarget = legalTargets.includes(sq);
          const pieceKey = piece ? (piece.color + piece.type.toUpperCase()) : '';
          const pieceSvg = pieceKey ? PIECE_SVGS[pieceKey] : '';

          cells += `
            <div onclick="${onSquareClickFn}('${sq}')"
                 ${draggable ? `ondragover="onPieceDragOver(event)" ondragleave="onPieceDragLeave(event)" ondrop="onPieceDrop(event, '${sq}')"` : ''}
                 class="sq-cell relative flex items-center justify-center ${isLight ? lightSq : darkSq} ${isSelected ? 'ring-4 ring-inset ring-tealBright' : ''} cursor-pointer">
              ${cIdx === 0 ? `<span class="absolute top-0.5 left-1 text-[10px] font-extrabold ${isLight ? 'text-black/60' : 'text-white/80'} pointer-events-none">${rank}</span>` : ''}
              ${rIdx === 7 ? `<span class="absolute bottom-0.5 right-1 text-[10px] font-extrabold ${isLight ? 'text-black/60' : 'text-white/80'} pointer-events-none">${file}</span>` : ''}
              ${pieceSvg ? `
                <div ${draggable ? `draggable="true" ondragstart="onPieceDragStart(event, '${sq}')"` : ''}
                     class="w-full h-full flex items-center justify-center">
                  ${pieceSvg}
                </div>
              ` : ''}
              ${isTarget ? `<span class="absolute pointer-events-none ${piece ? 'inset-0 ring-4 ring-inset ring-black/40' : 'w-4 h-4 rounded-full bg-black/30'}"></span>` : ''}
            </div>
          `;
        });
      });

      return `<div class="board-grid w-full rounded-xl overflow-hidden border-2 border-grayBorder shadow-2xl">${cells}</div>`;
    }

    function renderActiveGameScreen() {
      const g = state.activeGame;
      if (!g) return renderPlayLobbyScreen();

      const myUid = state.currentUser?.uid;
      const isWhiteMe = g.whiteUid === myUid;
      const flipped = !isWhiteMe;

      const topNick = isWhiteMe ? g.blackNick : g.whiteNick;
      const topTitle = isWhiteMe ? g.blackTitle : g.whiteTitle;
      const topElo = isWhiteMe ? g.blackElo : g.whiteElo;
      const topUid = isWhiteMe ? g.blackUid : g.whiteUid;
      const topTime = isWhiteMe ? g.blackTimeMs : g.whiteTimeMs;

      const botNick = isWhiteMe ? g.whiteNick : g.blackNick;
      const botTitle = isWhiteMe ? g.whiteTitle : g.blackTitle;
      const botElo = isWhiteMe ? g.whiteElo : g.blackElo;
      const botUid = isWhiteMe ? g.whiteUid : g.blackUid;
      const botTime = isWhiteMe ? g.whiteTimeMs : g.blackTimeMs;

      const fens = g.fens || [g.fen];
      const activeIdx = state.viewMoveIndex === null ? (fens.length - 1) : state.viewMoveIndex;
      const displayedFen = fens[activeIdx] || g.fen;

      const isFinished = g.status === 'finished';
      const didIWin = isFinished && g.winnerUid === myUid;
      const isDraw = isFinished && g.winnerUid === 'draw';
      const mySideStats = isWhiteMe ? (g.stats?.white || { brilliant: 0, best: 0, good: 0 }) : (g.stats?.black || { brilliant: 0, best: 0, good: 0 });

                <div class="absolute left-3 top-12 z-30 w-52 rounded-xl bg-grayNav border border-tealAccent/40 shadow-2xl p-1.5 text-xs">
                  <button onclick="sendFriendRequest('${escapeHtml(topUid)}'); state.nickMenuOpen=null; renderApp();"

            <!-- Доска -->

              ${renderChessBoardHtml({

              ${isFinished && !state.gameOverModalDismissed ? `

                    <button onclick="state.gameOverModalDismissed=true; renderApp();"

                      <div class="flex justify-between"><span class="text-emerald-300 font-semibold">✓ Хорошие:</span><b class="text-white">${mySideStats.good || 0}</b></div>
                    </div>
                    <div class="mt-4 flex flex-col gap-2">

                              class="w-full py-2.5 rounded-xl bg-tealAccent hover:bg-tealBright text-black font-extrabold text-xs cursor-pointer">Играть снова</button>
                      <button onclick="state.gameOverModalDismissed=true; renderApp();"

                <span class="w-7 h-7 rounded-lg bg-tealAccent/20 text-tealAccent font-bold text-xs flex items-center justify-center">
                  ${escapeHtml(botNick.charAt(0).toUpperCase())}

                <div class="flex items-center gap-1.5">
                  ${renderTitleBadge(botTitle)}
                  <span class="text-sm font-bold text-white">${escapeHtml(botNick)}</span>
                  <span class="text-xs text-tealAccent font-semibold">(${botElo})</span>
                </div>
              </button>
              <div id="clock-bottom" class="px-3 py-1 rounded-lg bg-grayBase border border-tealAccent/40 font-mono font-bold text-base text-tealBright">
                ${formatClock(botTime)}
              </div>

              ${state.nickMenuOpen === 'bottom' ? `
                <div class="absolute left-3 bottom-12 z-30 w-52 rounded-xl bg-grayNav border border-tealAccent/40 shadow-2xl p-1.5 text-xs">
                  <button onclick="openUserProfileByNick('${escapeHtml(botNick)}')"
                          class="w-full text-left px-3 py-2 rounded-lg hover:bg-grayHover text-white cursor-pointer">Мой профиль</button>
                  <button onclick="rematchSameSettings()"
                          class="w-full text-left px-3 py-2 rounded-lg hover:bg-grayHover text-tealBright font-semibold cursor-pointer">Играть снова</button>
                </div>

            <!-- Переключатели ходов снизу -->
            <div class="flex items-center justify-between gap-2 p-2 rounded-xl bg-grayNav border border-grayBorder">
              <div class="flex items-center gap-1.5">
                <button onclick="stepGameMove('first')" class="px-3 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">|◀</button>
                <button onclick="stepGameMove('prev')" class="px-3 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">◀</button>
                <button onclick="stepGameMove('next')" class="px-3 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">▶</button>
                <button onclick="stepGameMove('last')" class="px-3 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">▶|</button>
              </div>

                <button onclick="resignActiveGame()" class="px-3 py-1.5 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-300 text-xs font-semibold cursor-pointer">Сдаться</button>
              ` : `
                <button onclick="rematchSameSettings()" class="px-3 py-1.5 rounded-lg bg-tealAccent text-black text-xs font-extrabold cursor-pointer">Играть снова</button>

                      <div class="flex items-center gap-1 mb-0.5">
                        ${renderTitleBadge(msg.title)}
                        <span class="font-bold text-tealBright">${escapeHtml(msg.nick)}:</span>
                      </div>
                      <p class="text-gray-100 break-words">${escapeHtml(msg.text)}</p>
                    </div>
                  `).join('')
                }
              </div>
              <form onsubmit="sendGameChatMessage(event)" class="mt-2.5 flex gap-1.5">
                <input id="game-chat-input" type="text" maxlength="200" placeholder="Сообщение..."
                       class="flex-1 bg-grayBase border border-grayBorder focus:border-tealAccent rounded-xl px-3 py-2 text-xs text-white focus:outline-none" />
                <button type="submit" class="px-3 py-2 rounded-xl bg-tealAccent hover:bg-tealBright text-black text-xs font-extrabold cursor-pointer">➤</button>

            <div class="rounded-2xl bg-grayNav border border-grayBorder p-3.5">
              <h4 class="text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">Запись ходов</h4>
              <div class="max-h-28 overflow-y-auto flex flex-wrap gap-1.5 text-xs font-mono">
                ${(g.moves || []).map((m, i) => `
                  <span class="px-1.5 py-0.5 rounded ${activeIdx === i + 1 ? 'bg-tealAccent/25 text-tealBright font-bold' : 'bg-grayBase text-gray-300'}">
                    ${Math.floor(i / 2) + 1}${i % 2 === 0 ? '.' : '..'}${escapeHtml(m)}
                  </span>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      if (!profile) {
        return `
          <div class="max-w-md mx-auto mt-10 p-8 rounded-2xl bg-grayNav border border-red-500/40 text-center">
            <h1 class="text-lg font-extrabold text-red-400">Пользователь @${escapeHtml(nickParam)} не найден</h1>

          </div>

      }

      const isMe = state.currentUser && state.currentUser.uid === profile.uid;
      const isFriend = state.currentUser && Boolean(state.currentUser.friends?.[profile.uid]);
      const friendsList = Object.keys(profile.friends || {}).map(id => state.usersMap[id]).filter(Boolean);
      const rawArchive = state.userArchives[profile.uid] || {};
      const gamesList = Object.values(rawArchive).sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
      const canSeeArchive = isMe || (profile.showArchivePublic !== false);
      const online = isUserOnline(profile);

      window.__archiveCache = rawArchive;

      return `
        <div class="max-w-4xl mx-auto space-y-5">
          <div class="rounded-2xl bg-grayNav border border-grayBorder p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
              <div class="relative w-16 h-16 rounded-2xl bg-tealAccent/20 border border-tealAccent/40 text-tealBright font-extrabold text-2xl flex items-center justify-center">
                ${escapeHtml(profile.nick.charAt(0).toUpperCase())}
                ${online ? `<span class="absolute -bottom-1 -right-1 w-3.5 h-3.5 rounded-full bg-emerald-400 ring-2 ring-grayNav"></span>` : ''}
              </div>
              <div>
                <div class="flex items-center gap-2">
                  ${renderTitleBadge(profile.title)}
                  <h1 class="text-2xl font-extrabold text-white">${escapeHtml(profile.nick)}</h1>
                </div>
                <p class="text-xs text-gray-400 mt-1">
                  ${online ? '<span class="text-emerald-400 font-semibold">В сети</span> • ' : ''}Всего партий: <b class="text-white">${gamesList.length}</b> • Друзей: <b class="text-white">${friendsList.length}</b>
                </p>
              </div>
            </div>

            ${!isMe && state.currentUser ? `
              <div>
                ${isFriend
                  ? `<span class="px-4 py-2 rounded-xl bg-tealAccent/20 border border-tealAccent/40 text-tealBright text-xs font-bold">В друзьях</span>`
                  : `<button onclick="sendFriendRequest('${escapeHtml(profile.uid)}')" class="px-4 py-2 rounded-xl bg-tealAccent hover:bg-tealBright text-black text-xs font-extrabold cursor-pointer">+ Добавить в друзья</button>`
                }
              </div>
            ` : ''}
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div class="rounded-2xl bg-grayNav border border-grayBorder p-4 text-center">
              <p class="text-xs text-gray-400">⚡ 1 минута</p>
              <p class="text-xl font-extrabold text-tealAccent mt-1">${getUserRatingForTime(profile, 1)}</p>
            </div>
            <div class="rounded-2xl bg-grayNav border border-grayBorder p-4 text-center">
              <p class="text-xs text-gray-400">🔥 3 минуты</p>
              <p class="text-xl font-extrabold text-tealAccent mt-1">${getUserRatingForTime(profile, 3)}</p>
            </div>
            <div class="rounded-2xl bg-grayNav border border-grayBorder p-4 text-center">
              <p class="text-xs text-gray-400">⏱ 10 минут</p>
              <p class="text-xl font-extrabold text-tealAccent mt-1">${getUserRatingForTime(profile, 10)}</p>
            </div>
          </div>

          <div class="rounded-2xl bg-grayNav border border-grayBorder p-5">
            <h2 class="text-sm font-bold text-white mb-3">Друзья (${friendsList.length})</h2>
            ${friendsList.length === 0 ? `<p class="text-xs text-gray-400">Список друзей пуст</p>` : `
              <div class="flex flex-wrap gap-2">
                ${friendsList.map(f => `
                  <button onclick="openUserProfileByNick('${escapeHtml(f.nick)}')"
                          class="px-3 py-1.5 rounded-xl bg-grayBase hover:bg-grayCard border border-grayBorder text-xs font-semibold text-white flex items-center gap-1.5 cursor-pointer">

              gamesList.length === 0 ? `<p class="text-xs text-gray-400">Сыгранных партий пока нет</p>` : `
                <div class="space-y-2">
                  ${gamesList.map(gm => {
                    const isWhite = gm.whiteUid === profile.uid;
                    const oppNick = isWhite ? gm.blackNick : gm.whiteNick;

                  }).join('')}
                </div>
              `
            )}
          </div>
        </div>
      `;

    function renderReplayScreen() {
      const g = state.replayGame;
      if (!g) return renderHomeScreen();
      const fens = g.fens || [g.fen];
      const fen = fens[state.replayMoveIndex] || fens[0];

      return `
        <div class="max-w-lg mx-auto space-y-3">
          <div class="flex items-center justify-between">
            <button onclick="window.history.back()" class="text-xs text-gray-400 hover:text-white cursor-pointer">← Назад</button>
            <span class="text-xs text-tealAccent font-bold">Ход ${state.replayMoveIndex} из ${fens.length - 1}</span>
          </div>

          <div class="p-3 rounded-xl bg-grayNav border border-grayBorder flex justify-between text-xs font-bold">
            <span>Чёрные: ${escapeHtml(g.blackNick)}</span>
            <span>Белые: ${escapeHtml(g.whiteNick)}</span>
          </div>

          ${renderChessBoardHtml({ fen, flipped: false, onSquareClickFn: 'void' })}

          <div class="flex items-center justify-center gap-2 p-2.5 rounded-xl bg-grayNav border border-grayBorder">
            <button onclick="stepReplayMove('first')" class="px-3.5 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">|◀ В начало</button>
            <button onclick="stepReplayMove('prev')" class="px-3.5 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">◀ Назад</button>
            <button onclick="stepReplayMove('next')" class="px-3.5 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">Вперёд ▶</button>
            <button onclick="stepReplayMove('last')" class="px-3.5 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">В конец ▶|</button>
          </div>
        </div>
      `;
    }

    function renderApp() {
      const main = document.getElementById('app-main');
      const header = document.getElementById('main-header');
      if (!main) return;

      // Проверка бана — если забанен, сайт закрыт экраном блокировки
      const activeBan = getActiveBanForCurrentUser();
      if (activeBan) {
        if (header) header.classList.add('hidden');
        main.innerHTML = renderBanScreen(activeBan);
        return;
      } else if (header) {
        header.classList.remove('hidden');
      }

      if (!state.currentUser) {
        main.innerHTML = renderAuthScreen();
        return;
      }

      if (!state.currentUser.coachId) {
        main.innerHTML = renderCoachPickerScreen();
        return;
      }

      const p = state.path || '/';
      if (p === '/play') main.innerHTML = renderPlayLobbyScreen();
      else if (p === '/courses') main.innerHTML = renderCoursesScreen();
      else if (p === '/bots') main.innerHTML = renderBotsScreen();
      else if (p === '/settings') main.innerHTML = renderSettingsScreen();
      else if (p === '/replay') main.innerHTML = renderReplayScreen();
      else if (p.startsWith('/game/')) main.innerHTML = renderActiveGameScreen();
      else if (p.startsWith('/@')) main.innerHTML = renderProfileByPath(p);
      else main.innerHTML = renderHomeScreen();
    }

    document.addEventListener('click', (e) => {
      const wrap = document.getElementById('search-popover-wrapper');
      const pop = document.getElementById('search-popover');
      if (wrap && pop && !wrap.contains(e.target)) {
        state.searchPopoverOpen = false;
        pop.classList.add('hidden');
      }
    });

    initRealtimeListeners();
    const savedUid = localStorage.getItem(LS_SESSION_UID);
    if (savedUid) {
      get(ref(rtdb, `bc_users/${savedUid}`)).then((snap) => {
        if (snap.exists()) {
          setSessionUser(snap.val());
          renderApp();
        }
      }).catch(() => {});
    }
    renderApp();

    onAuthStateChanged(auth, async (fbUser) => {
      if (!fbUser || state.currentUser) return;
      const snap = await get(ref(rtdb, `bc_users/g_${fbUser.uid}`)).catch(() => null);
      if (snap && snap.exists()) {
        setSessionUser(snap.val());
        renderApp();
      }
    });
  </script>
</body>
</html>
