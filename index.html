    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #1b1d1e;
      color: #f3f4f6;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1b1d1e; }
    ::-webkit-scrollbar-thumb { background: #3c4246; border-radius: 9999px; }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 520px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      user-select: none;
      touch-action: none;
    }
    .sq-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .theme-green-light { background-color: #ebecd0; }
    .theme-green-dark  { background-color: #779556; }
    .theme-wood-light  { background-color: #f0d9b5; }
    .theme-wood-dark   { background-color: #b58863; }

    .sq-last-move::after {
      content: '';
      position: absolute;
      inset: 0;
      background-color: rgba(246, 246, 105, 0.52);
      pointer-events: none;
    }
    .sq-selected::after {
      content: '';
      position: absolute;
      inset: 0;
      background-color: rgba(20, 184, 166, 0.45);
      pointer-events: none;
    }
    .legal-dot {
      width: 28%;
      height: 28%;
      border-radius: 9999px;
      background-color: rgba(0, 0, 0, 0.24);
      z-index: 5;
      pointer-events: none;
    }
    .legal-ring {
      position: absolute;
      inset: 7%;
      border-radius: 9999px;
      border: 4px solid rgba(0, 0, 0, 0.24);
      z-index: 5;
      pointer-events: none;
    }
    .piece-svg {
      width: 84%;
      height: 84%;
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.35));
    }
    #drag-ghost {
      position: fixed;
      width: 58px;
      height: 58px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: none;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.65));
    }

    const FM_TRACKS = [
      { id: 0, title: "Сколько весит · Мем-ремикс", duration: 96, notes: [261.63, 329.63, 392.00, 523.25, 392.00, 329.63] },

    function ensureAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playChessPieceSound(isCapture = false) {
      try {
        const ctx = ensureAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = isCapture ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(isCapture ? 210 : 165, now);
        osc.frequency.exponentialRampToValueAtTime(52, now + 0.085);
        gain.gain.setValueAtTime(0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.095);
      } catch (e) {}
    }

    function playFmTickNote(trackId, stepIndex) {
      try {
        const ctx = ensureAudioCtx();
        if (!ctx) return;
        const track = FM_TRACKS[trackId] || FM_TRACKS[0];
        const freq = track.notes[stepIndex % track.notes.length];
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      } catch (e) {}
    }

    function syncLocalFmAudio(fmData) {
      const shouldPlay = Boolean(fmData && fmData.playing);
      const trackId = Number(fmData?.trackId || 0);
      const track = FM_TRACKS[trackId] || FM_TRACKS[0];
      if (fmData && typeof fmData.elapsed === 'number') {
        fmLocalState.elapsed = Math.min(track.duration, Math.max(0, Math.floor(fmData.elapsed)));
      }
      fmLocalState.trackId = trackId;

      if (shouldPlay && !fmPlayerInterval) {
        fmLocalState.playing = true;
        fmPlayerInterval = setInterval(() => {
          const curTrack = FM_TRACKS[fmLocalState.trackId] || FM_TRACKS[0];
          fmLocalState.elapsed = (fmLocalState.elapsed + 1) % curTrack.duration;
          fmLocalState.step += 1;
          playFmTickNote(fmLocalState.trackId, fmLocalState.step);
          const timeLabel = document.getElementById('fm-time-label');
          const slider = document.getElementById('fm-seek-slider');
          if (timeLabel) timeLabel.textContent = `${formatClock(fmLocalState.elapsed)} / ${formatClock(curTrack.duration)}`;
          if (slider) slider.value = String(fmLocalState.elapsed);
        }, 1000);
      } else if (!shouldPlay && fmPlayerInterval) {
        clearInterval(fmPlayerInterval);
        fmPlayerInterval = null;
        fmLocalState.playing = false;
      }
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    function escapeJsAttr(str) {
      return String(str ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");

      const sec = Math.max(0, Math.floor(Number(totalSeconds) || 0));

      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

      el.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-xl text-xs font-semibold transition-opacity duration-300 ${palette}`;
      el.textContent = text;

      }, 3600);

    // =========================================================================
    async function ensureGlobalEloResetOnce(usersObj) {
      try {
        const flagSnap = await get(ref(rtdb, 'bc_meta/elo500_v2'));
        if (flagSnap.exists()) return;
        const updates = { 'bc_meta/elo500_v2': true };
        Object.keys(usersObj || {}).forEach(uid => {
          updates[`bc_users/${uid}/elo_10`] = 500;
          updates[`bc_users/${uid}/elo_3`] = 500;
          updates[`bc_users/${uid}/elo_1`] = 500;
          updates[`bc_users/${uid}/gamesPlayed`] = 0;
        });
        await update(ref(rtdb), updates);
      } catch (e) {}
    }

    function computeEloDelta(myElo, oppElo, score, gamesPlayed) {
      const expected = 1 / (1 + Math.pow(10, (oppElo - myElo) / 400));
      let kFactor = 32;
      if ((gamesPlayed || 0) < 5) {
        kFactor = 180;
      } else if ((gamesPlayed || 0) < 12) {
        kFactor = 64;
      }
      let delta = Math.round(kFactor * (score - expected));
      if (score === 1 && delta < 8) delta = 8;
      if (score === 0 && delta > -8) delta = -8;
      return delta;
    }

    // =========================================================================
    // ПОДПИСКИ FIREBASE REALTIME DATABASE
    // =========================================================================
    function initRealtimeListeners() {
      onValue(ref(rtdb, 'bc_users'), (snap) => {
        const data = snap.val() || {};
        state.usersMap = data;
        ensureGlobalEloResetOnce(data);
        if (state.currentUser) {
          const myRecord = data[state.currentUser.uid];
          // Если аккаунт был удалён администратором — мгновенно выкидываем пользователя
          if (!myRecord && Object.keys(data).length > 0 && state.onboardingStep !== 'profile') {
            state.currentUser = null;
            state.onboardingStep = null;
            saveLocalSession(null);
            showToast('Ваш аккаунт был удалён администратором', 'error');
            window.navigate('/');
            return;
          }
          if (myRecord) {
            const prevFriends = state.currentUser.friends || {};
            const merged = { ...state.currentUser, ...myRecord };
            state.currentUser = merged;
            saveLocalSession(merged);
            const nextFriends = merged.friends || {};
            Object.keys(nextFriends).forEach(fUid => {
              if (!prevFriends[fUid] && !shownFriendNotifs.has(fUid)) {
                shownFriendNotifs.add(fUid);
                const friendUser = data[fUid];
                if (friendUser && friendUser.nick) {
                  showFriendPopup(friendUser);
                }
              }
            });
          }
        }
        renderApp();
      });

      onValue(ref(rtdb, 'bc_friend_requests'), (snap) => {
        const list = snap.val() || {};
        state.friendRequestsMap = list;
        if (state.currentUser) {
          const myUid = state.currentUser.uid;
          const incoming = Object.values(list).filter(r => r && r.toUid === myUid && r.status === 'pending');
          renderFriendRequestPopups(incoming);
        }
        renderApp();
      });

      onValue(ref(rtdb, 'bc_queue'), (snap) => {
        state.queueMap = snap.val() || {};
        if (state.isSearchingMatch && state.currentUser) {
          tryPairFromQueue(state.selectedTimeControl);
        }
        if (state.path === '/play') renderApp();
      });

      onValue(ref(rtdb, 'bc_bans'), (snap) => {
        state.bansMap = snap.val() || {};
        renderApp();
      });

      onValue(ref(rtdb, 'bc_settings'), (snap) => {
        const val = snap.val() || { maintenance: false };
        state.siteSettings = val;
        renderApp();
      });

      onValue(ref(rtdb, 'bc_archives'), (snap) => {
        state.userArchives = snap.val() || {};
        if (state.path.startsWith('/@')) renderApp();
      });

      onValue(ref(rtdb, 'bc_challenges'), (snap) => {
        const list = snap.val() || {};
        if (!state.currentUser) return;
        const myUid = state.currentUser.uid;
        const incoming = Object.values(list).filter(c => c && c.toUid === myUid && c.status === 'pending');
        renderChallengePopups(incoming);

        Object.values(list).forEach(c => {
          if (c && c.status === 'accepted' && c.gameId && (c.fromUid === myUid || c.toUid === myUid)) {
            if (!handledGameRedirects.has(c.gameId)) {
              handledGameRedirects.add(c.gameId);
              joinActiveGameListener(c.gameId);
            }
          }
        });
      });

      onValue(ref(rtdb, 'bc_user_active_game'), (snap) => {
        if (!state.currentUser) return;
        const all = snap.val() || {};
        const myEntry = all[state.currentUser.uid];
        if (myEntry && myEntry.gameId && !handledGameRedirects.has(myEntry.gameId)) {
          if (Date.now() - (myEntry.createdAt || 0) < 30000) {
            handledGameRedirects.add(myEntry.gameId);
            joinActiveGameListener(myEntry.gameId);
          }
        }
      });
    }

    async function tryPairFromQueue(tc) {
      if (!state.currentUser || !state.isSearchingMatch) return;
      const myUid = state.currentUser.uid;
      const queuePath = `bc_queue/${tc}`;
      const snap = await get(ref(rtdb, queuePath));
      const queue = snap.val() || {};
      const activeEntries = Object.values(queue)
        .filter(q => q && Date.now() - (q.joinedAt || 0) < 120000)
        .sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));

      const opponentEntry = activeEntries.find(q => q.uid !== myUid);
      if (!opponentEntry) return;

      const iAmCreator = activeEntries[0]?.uid === myUid || (activeEntries[0]?.uid !== opponentEntry.uid && myUid < opponentEntry.uid);
      if (!iAmCreator) return;

      await update(ref(rtdb), {
        [`${queuePath}/${opponentEntry.uid}`]: null,
        [`${queuePath}/${myUid}`]: null
      });
      state.isSearchingMatch = false;
      const whiteIsMe = Math.random() < 0.5;
      const gameId = await createMultiplayerGame(
        whiteIsMe ? myUid : opponentEntry.uid,
        whiteIsMe ? opponentEntry.uid : myUid,
        tc,
        state.selectedRated
      );
      handledGameRedirects.add(gameId);
      joinActiveGameListener(gameId);
    }

    window.startMatchmaking = async function() {
      if (!state.currentUser) return;
      const myUid = state.currentUser.uid;
      const tc = state.selectedTimeControl;
      const queuePath = `bc_queue/${tc}`;

      if (state.isSearchingMatch) {
        state.isSearchingMatch = false;
        await remove(ref(rtdb, `${queuePath}/${myUid}`));
        renderApp();
        return;
      }

      state.isSearchingMatch = true;
      const entryRef = ref(rtdb, `${queuePath}/${myUid}`);
      await set(entryRef, {
        uid: myUid,
        nick: state.currentUser.nick,
        joinedAt: Date.now()
      });
      try { onDisconnect(entryRef).remove(); } catch (e) {}
      renderApp();
      await tryPairFromQueue(tc);
    };

    // СОЗДАНИЕ ПАРТИИ (С ИГРОКОМ ИЛИ С БОТОМ) И ИГРОВОЙ ЦИКЛ
    // =========================================================================
    async function createMultiplayerGame(whiteUid, blackUid, timeControl, rated) {
      const wUser = state.usersMap[whiteUid] || { uid: whiteUid, nick: 'Белые', elo_10: 500, elo_3: 500, elo_1: 500 };
      const bUser = state.usersMap[blackUid] || { uid: blackUid, nick: 'Чёрные', elo_10: 500, elo_3: 500, elo_1: 500 };
      const initialSec = Number(timeControl || 10) * 60;
      const gameRef = push(ref(rtdb, 'bc_games'));
      const gameId = gameRef.key;
      const now = Date.now();

      const gameData = {
        id: gameId,
        mode: 'pvp',
        status: 'active',
        timeControl: Number(timeControl || 10),
        rated: Boolean(rated),
        fen: new Chess().fen(),
        turn: 'w',
        whiteUid,
        blackUid,
        whiteNick: wUser.nick,
        blackNick: bUser.nick,
        whiteElo: getUserRatingForTime(wUser, timeControl),
        blackElo: getUserRatingForTime(bUser, timeControl),
        whiteTime: initialSec,
        blackTime: initialSec,
        lastMoveAt: now,
        createdAt: now,
        moves: [],
        lastMove: null,
        chat: {},
        fmPlayer: { playing: false, trackId: 0, elapsed: 0 },
        winner: null,
        endReason: ''
      };

      await set(gameRef, gameData);
      await update(ref(rtdb), {
        [`bc_user_active_game/${whiteUid}`]: { gameId, createdAt: now },
        [`bc_user_active_game/${blackUid}`]: { gameId, createdAt: now }
      });
      return gameId;
    }

        rated: false,
        fen: new Chess().fen(),
        turn: 'w',
        whiteUid: myUid,
        blackUid: `bot_${bot.id}`,
        whiteNick: state.currentUser.nick,
        blackNick: bot.name,
        whiteElo: getUserRatingForTime(state.currentUser, 10),
        blackElo: bot.elo,
        whiteTime: 0,
        blackTime: 0,
        lastMoveAt: now,
        createdAt: now,
        moves: [],
        lastMove: null,
        chat: {},
        fmPlayer: { playing: false, trackId: 0, elapsed: 0 },
        winner: null,
        endReason: ''
      };

      await set(gameRef, gameData);
      handledGameRedirects.add(gameId);
      joinActiveGameListener(gameId);
    };

    function joinActiveGameListener(gameId) {
      if (activeGameUnsub) {
        activeGameUnsub();
        activeGameUnsub = null;
      }
      if (clockInterval) {
        clearInterval(clockInterval);
        clockInterval = null;
      }
      if (botMoveTimeout) {
        clearTimeout(botMoveTimeout);
        botMoveTimeout = null;
      }

      state.activeGameId = gameId;
      state.replayPly = null;
      state.selectedSquare = null;
      state.legalTargets = [];
      state.gameResultModalClosed = false;
      state.botIsThinking = false;
      lastSoundMoveCount = -1;

      if (state.path !== `/game/${gameId}`) {
        window.navigate(`/game/${gameId}`);
      }

      activeGameUnsub = onValue(ref(rtdb, `bc_games/${gameId}`), (snap) => {
        const g = snap.val();
        if (!g) return;
        const movesArr = Array.isArray(g.moves) ? g.moves : Object.values(g.moves || {});
        if (lastSoundMoveCount !== -1 && movesArr.length > lastSoundMoveCount) {
          const lastM = movesArr[movesArr.length - 1];
          playChessPieceSound(Boolean(lastM && lastM.captured));
        }
        lastSoundMoveCount = movesArr.length;
        state.activeGame = g;

        // Страховочная проверка: если по позиции на доске уже мат/пат/ничья, а статус ещё active — завершаем партию
        if (g.status === 'active' && g.fen) {
          try {
            const verifyChess = new Chess(g.fen);
            if (verifyChess.game_over()) {
              const winner = verifyChess.in_checkmate()
                ? (verifyChess.turn() === 'w' ? 'black' : 'white')
                : 'draw';
              const reason = verifyChess.in_checkmate()
                ? 'Мат'
                : (verifyChess.in_stalemate() ? 'Пат' : 'Ничья');
              finishGameWithResult(g, winner, reason);
            }
          } catch (e) {}
        }

        const wantTrackId = Number(g.fmPlayer?.trackId || 0);
        if (wantTrackId !== fmLocalState.trackId) {
          fmLocalState.trackId = wantTrackId;
        }
        syncLocalFmAudio(g.fmPlayer);

        if (g.status === 'active' && g.mode === 'bot' && g.turn === 'b' && !state.botIsThinking) {
          triggerBotTurn(g);
        }
        renderApp();
      });

      clockInterval = setInterval(() => {
        const g = state.activeGame;
        if (!g || g.status !== 'active' || g.mode === 'bot') return;
        const now = Date.now();
        const elapsedSinceMove = (now - (g.lastMoveAt || now)) / 1000;

        // Правило: если игрок не ходит более 30 секунд — автопоражение за бездействие
        if (elapsedSinceMove >= 30) {
          const loserIsWhite = g.turn === 'w';
          const amLoser = (loserIsWhite && state.currentUser?.uid === g.whiteUid) || (!loserIsWhite && state.currentUser?.uid === g.blackUid);
          if (amLoser) {
            finishGameWithResult(g, loserIsWhite ? 'black' : 'white', 'Поражение за бездействие (30 сек)');
          }
          return;
        }

        const wLeft = g.turn === 'w' ? Math.max(0, g.whiteTime - elapsedSinceMove) : g.whiteTime;
        const bLeft = g.turn === 'b' ? Math.max(0, g.blackTime - elapsedSinceMove) : g.blackTime;

        if (wLeft <= 0 && state.currentUser?.uid === g.whiteUid) {
          finishGameWithResult(g, 'black', 'Время вышло');
          return;
        }
        if (bLeft <= 0 && state.currentUser?.uid === g.blackUid) {
          finishGameWithResult(g, 'white', 'Время вышло');
          return;
        }

        const topEl = document.getElementById('clock-top');
        const botEl = document.getElementById('clock-bottom');
        const amWhite = state.currentUser?.uid === g.whiteUid;
        if (topEl) topEl.textContent = formatClock(amWhite ? bLeft : wLeft);
        if (botEl) botEl.textContent = formatClock(amWhite ? wLeft : bLeft);
      }, 250);
    }

    // =========================================================================
    // ИИ БОТОВ (МИНИМАКС + АЛЬФА-БЕТА ОТСЕЧЕНИЕ ДЛЯ ЛАРРИ, ГОБЛИНА, MITTENS, БОРИСА)
    // =========================================================================
    const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

    function evaluateBoard(chess) {
      if (chess.in_checkmate()) return chess.turn() === 'w' ? -99999 : 99999;
      if (chess.in_draw()) return 0;
      const board = chess.board();
      let score = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = board[r][c];
          if (!piece) continue;
          const centerBonus = (3.5 - Math.abs(3.5 - r)) * 4 + (3.5 - Math.abs(3.5 - c)) * 4;
          const val = (PIECE_VALUES[piece.type] || 0) + centerBonus;
          score += piece.color === 'w' ? val : -val;
        }
      }
      return score;
    }

    function minimax(chess, depth, alpha, beta, isMaximizing) {
      if (depth === 0 || chess.game_over()) {
        return evaluateBoard(chess);
      }
      const moves = chess.moves({ verbose: true });
      moves.sort((a, b) => (b.captured ? 10 : 0) - (a.captured ? 10 : 0));
      if (isMaximizing) {
        let maxEval = -Infinity;
        for (const m of moves) {
          chess.move(m);
          const ev = minimax(chess, depth - 1, alpha, beta, false);
          chess.undo();
          if (ev > maxEval) maxEval = ev;
          if (ev > alpha) alpha = ev;
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const m of moves) {
          chess.move(m);
          const ev = minimax(chess, depth - 1, alpha, beta, true);
          chess.undo();
          if (ev < minEval) minEval = ev;
          if (ev < beta) beta = ev;
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function pickBestBotMove(fen, bot) {
      const chess = new Chess(fen);
      const moves = chess.moves({ verbose: true });
      if (!moves.length) return null;
      if (bot.randomness > 0 && Math.random() < bot.randomness) {
        return moves[Math.floor(Math.random() * moves.length)];
      }
      let bestMove = moves[0];
      let bestScore = Infinity;
      moves.sort((a, b) => (b.captured ? 10 : 0) - (a.captured ? 10 : 0));
      for (const m of moves) {
        chess.move(m);
        const score = minimax(chess, (bot.depth || 2) - 1, -Infinity, Infinity, true);
        chess.undo();
        if (score < bestScore) {
          bestScore = score;
          bestMove = m;
        }
      }
      return bestMove;
    }

    function triggerBotTurn(g) {
      const bot = BOTS.find(b => b.id === g.botId) || BOTS[0];
      state.botIsThinking = true;
      const delayMs = state.botThinkDelayEnabled
        ? (bot.id === 'boris' ? 1400 : bot.id === 'mittens' ? 1050 : 750)
        : 120;

      botMoveTimeout = setTimeout(async () => {
        try {
          const curGame = state.activeGame;
          if (!curGame || curGame.id !== g.id || curGame.status !== 'active' || curGame.turn !== 'b') {
            state.botIsThinking = false;
            return;
          }
          const chosen = pickBestBotMove(curGame.fen, bot);
          if (!chosen) {
            state.botIsThinking = false;
            return;
          }
          const chess = new Chess(curGame.fen);
          const moveRes = chess.move({ from: chosen.from, to: chosen.to, promotion: 'q' });
          if (!moveRes) {
            state.botIsThinking = false;
            return;
          }
          const prevMoves = Array.isArray(curGame.moves) ? curGame.moves : Object.values(curGame.moves || {});
          const nextMoves = [
            ...prevMoves,
            {
              san: moveRes.san,
              from: moveRes.from,
              to: moveRes.to,
              fen: chess.fen(),
              captured: moveRes.captured || null,
              quality: bot.id === 'boris' ? 'brilliant' : 'best'
            }
          ];

          state.botIsThinking = false;
          if (chess.game_over()) {
            const winner = chess.in_checkmate() ? 'black' : 'draw';
            const reason = chess.in_checkmate() ? 'Мат' : 'Ничья / Пат';
            await finishGameWithResult({ ...curGame, moves: nextMoves }, winner, reason);
          } else {
            await update(ref(rtdb, `bc_games/${curGame.id}`), {
              fen: chess.fen(),
              turn: 'w',
              lastMoveAt: Date.now(),
              lastMove: { from: moveRes.from, to: moveRes.to },
              moves: nextMoves
            });
          }
        } catch (e) {
          state.botIsThinking = false;
        }
      }, delayMs);
    }

    // =========================================================================
    // ХОДЫ ИГРОКА, ПЕРЕТАСКИВАНИЕ ФИГУР И ЗАВЕРШЕНИЕ ПАРТИИ
    // =========================================================================
    window.handleBoardSquareClick = async function(sq) {
      const g = state.activeGame;
      if (!g || g.status !== 'active' || state.replayPly !== null) return;
      const myUid = state.currentUser?.uid;
      const amWhite = myUid === g.whiteUid;
      const amBlack = myUid === g.blackUid;
      if (!amWhite && !amBlack) return;
      if ((amWhite && g.turn !== 'w') || (amBlack && g.turn !== 'b')) return;

      const chess = new Chess(g.fen);
      if (state.selectedSquare) {
        const attempted = await tryExecutePlayerMove(state.selectedSquare, sq);
        if (attempted) return;
      }

      const piece = chess.get(sq);
      const myColor = amWhite ? 'w' : 'b';
      if (piece && piece.color === myColor) {
        state.selectedSquare = sq;
        state.legalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to);
      } else {
        state.selectedSquare = null;
        state.legalTargets = [];
      }
      renderApp();
    };

    window.startPieceDrag = function(event, sq) {
      const g = state.activeGame;
      if (!g || g.status !== 'active' || state.replayPly !== null) return;
      const myUid = state.currentUser?.uid;
      const amWhite = myUid === g.whiteUid;
      const amBlack = myUid === g.blackUid;
      if (!amWhite && !amBlack) return;
      if ((amWhite && g.turn !== 'w') || (amBlack && g.turn !== 'b')) return;

      const chess = new Chess(g.fen);
      const piece = chess.get(sq);
      const myColor = amWhite ? 'w' : 'b';
      if (!piece || piece.color !== myColor) return;

      state.draggingFrom = sq;
      state.selectedSquare = sq;
      state.legalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to);

      const ghost = document.getElementById('drag-ghost');
      const code = `${piece.color}${piece.type.toUpperCase()}`;
      if (ghost && PIECE_SVGS[code]) {
        ghost.innerHTML = PIECE_SVGS[code];
        ghost.style.display = 'block';
        ghost.style.left = `${event.clientX}px`;
        ghost.style.top = `${event.clientY}px`;
      }
      renderApp();
    };

    window.addEventListener('pointermove', (event) => {
      if (!state.draggingFrom) return;
      const ghost = document.getElementById('drag-ghost');
      if (ghost) {
        ghost.style.left = `${event.clientX}px`;
        ghost.style.top = `${event.clientY}px`;
      }
    });

    window.addEventListener('pointerup', async (event) => {
      if (!state.draggingFrom) return;
      const fromSq = state.draggingFrom;
      state.draggingFrom = null;
      const ghost = document.getElementById('drag-ghost');
      if (ghost) ghost.style.display = 'none';

      const elBelow = document.elementFromPoint(event.clientX, event.clientY);
      const sqCell = elBelow ? elBelow.closest('[data-square]') : null;
      const toSq = sqCell ? sqCell.getAttribute('data-square') : null;
      if (toSq && toSq !== fromSq) {
        await tryExecutePlayerMove(fromSq, toSq);
      } else {
        renderApp();
      }
    });

    async function tryExecutePlayerMove(fromSq, toSq) {
      const g = state.activeGame;
      if (!g || g.status !== 'active') return false;
      const chess = new Chess(g.fen);
      const moveRes = chess.move({ from: fromSq, to: toSq, promotion: 'q' });
      if (!moveRes) return false;

      state.selectedSquare = null;
      state.legalTargets = [];

      const now = Date.now();
      const elapsedSec = Math.max(0, (now - (g.lastMoveAt || now)) / 1000);
      const amWhite = state.currentUser?.uid === g.whiteUid;
      const nextWhiteTime = g.mode === 'bot' ? 0 : (amWhite ? Math.max(0, g.whiteTime - elapsedSec) : g.whiteTime);
      const nextBlackTime = g.mode === 'bot' ? 0 : (!amWhite ? Math.max(0, g.blackTime - elapsedSec) : g.blackTime);

      const prevMoves = Array.isArray(g.moves) ? g.moves : Object.values(g.moves || {});
      const quality = moveRes.captured ? 'brilliant' : (moveRes.san.includes('+') ? 'best' : 'good');
      const nextMoves = [
        ...prevMoves,
        {
          san: moveRes.san,
          from: moveRes.from,
          to: moveRes.to,
          fen: chess.fen(),
          captured: moveRes.captured || null,
          quality
        }
      ];

      if (chess.game_over()) {
        const winner = chess.in_checkmate() ? (amWhite ? 'white' : 'black') : 'draw';
        const reason = chess.in_checkmate()
          ? 'Мат'
          : (chess.in_stalemate() ? 'Пат' : 'Ничья');
        await finishGameWithResult({ ...g, moves: nextMoves }, winner, reason);
        return true;
      }

      await update(ref(rtdb, `bc_games/${g.id}`), {
        fen: chess.fen(),
        turn: amWhite ? 'b' : 'w',
        whiteTime: nextWhiteTime,
        blackTime: nextBlackTime,
        lastMoveAt: now,
        lastMove: { from: moveRes.from, to: moveRes.to },
        moves: nextMoves
      });
      return true;
    }

    async function finishGameWithResult(g, winner, reason) {
      if (!g || g.status === 'finished') return;
      const movesArr = Array.isArray(g.moves) ? g.moves : Object.values(g.moves || {});
      const finalFen = movesArr.length ? movesArr[movesArr.length - 1].fen : g.fen;
      const durationSec = Math.max(1, Math.round((Date.now() - (g.createdAt || Date.now())) / 1000));

      const updates = {
        [`bc_games/${g.id}/status`]: 'finished',
        [`bc_games/${g.id}/winner`]: winner,
        [`bc_games/${g.id}/endReason`]: reason,
        [`bc_games/${g.id}/fen`]: finalFen,
        [`bc_games/${g.id}/durationSec`]: durationSec
      };

      if (g.mode === 'pvp' && g.rated && g.timeControl) {
        const tc = Number(g.timeControl);
        const wUser = state.usersMap[g.whiteUid];
        const bUser = state.usersMap[g.blackUid];
        if (wUser && bUser) {
          const wScore = winner === 'white' ? 1 : winner === 'black' ? 0 : 0.5;
          const bScore = winner === 'black' ? 1 : winner === 'white' ? 0 : 0.5;
          const wDelta = computeEloDelta(getUserRatingForTime(wUser, tc), getUserRatingForTime(bUser, tc), wScore, wUser.gamesPlayed || 0);
          const bDelta = computeEloDelta(getUserRatingForTime(bUser, tc), getUserRatingForTime(wUser, tc), bScore, bUser.gamesPlayed || 0);
          updates[`bc_users/${g.whiteUid}/elo_${tc}`] = Math.max(100, getUserRatingForTime(wUser, tc) + wDelta);
          updates[`bc_users/${g.blackUid}/elo_${tc}`] = Math.max(100, getUserRatingForTime(bUser, tc) + bDelta);
          updates[`bc_users/${g.whiteUid}/gamesPlayed`] = (wUser.gamesPlayed || 0) + 1;
          updates[`bc_users/${g.blackUid}/gamesPlayed`] = (bUser.gamesPlayed || 0) + 1;
        }
      }

      const archiveSummary = {
        id: g.id,
        mode: g.mode,
        timeControl: g.timeControl || 0,
        rated: Boolean(g.rated),
        whiteUid: g.whiteUid,
        blackUid: g.blackUid,
        whiteNick: g.whiteNick,
        blackNick: g.blackNick,
        winner,
        endReason: reason,
        moves: movesArr,
        createdAt: g.createdAt || Date.now()
      };

      if (g.whiteUid && !String(g.whiteUid).startsWith('bot_')) {
        updates[`bc_archives/${g.whiteUid}/${g.id}`] = archiveSummary;
        updates[`bc_user_active_game/${g.whiteUid}`] = null;
      }
      if (g.blackUid && !String(g.blackUid).startsWith('bot_')) {
        updates[`bc_archives/${g.blackUid}/${g.id}`] = archiveSummary;
        updates[`bc_user_active_game/${g.blackUid}`] = null;
      }

      await update(ref(rtdb), updates);
    }

    window.resignCurrentGame = async function() {
      const g = state.activeGame;
      if (!g || g.status !== 'active') return;
      const amWhite = state.currentUser?.uid === g.whiteUid;
      await finishGameWithResult(g, amWhite ? 'black' : 'white', 'Сдача партии');
    };

    window.setReplayPly = function(ply) {
      const g = state.activeGame;
      if (!g) return;
      const movesArr = Array.isArray(g.moves) ? g.moves : Object.values(g.moves || {});
      if (ply >= movesArr.length) {
        state.replayPly = null;
      } else {
        state.replayPly = Math.max(0, ply);
      }
      renderApp();
    };

    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
      if (state.archiveReplayGame) {
        const mLen = (state.archiveReplayGame.moves || []).length;
        if (e.key === 'ArrowLeft') {
          state.archiveReplayPly = Math.max(0, state.archiveReplayPly - 1);
          renderApp();
        } else if (e.key === 'ArrowRight') {
          state.archiveReplayPly = Math.min(mLen, state.archiveReplayPly + 1);
          renderApp();
        }
        return;
      }
      if (state.activeGame && state.path.startsWith('/game/')) {
        const movesArr = Array.isArray(state.activeGame.moves) ? state.activeGame.moves : Object.values(state.activeGame.moves || {});
        const curPly = state.replayPly === null ? movesArr.length : state.replayPly;
        if (e.key === 'ArrowLeft') {
          window.setReplayPly(Math.max(0, curPly - 1));
        } else if (e.key === 'ArrowRight') {
          window.setReplayPly(Math.min(movesArr.length, curPly + 1));
        }
      }
    });

    window.togglePlayerMenuSide = function(side) {
      state.openPlayerMenuSide = state.openPlayerMenuSide === side ? null : side;
      renderApp();
    };

    window.sendGameChatMessage = async function(event) {
      if (event) event.preventDefault();
      const g = state.activeGame;
      if (!g || !state.currentUser) return;
      const input = document.getElementById('game-chat-input');
      const text = (input?.value || '').trim();
      if (!text) return;
      input.value = '';
      const msgRef = push(ref(rtdb, `bc_games/${g.id}/chat`));
      await set(msgRef, {
        uid: state.currentUser.uid,
        nick: state.currentUser.nick,
        text,
        createdAt: Date.now()
      });
    };

    window.rematchCurrentOpponent = async function() {
      const g = state.activeGame;
      if (!g || !state.currentUser) return;
      if (g.mode === 'bot') {
        state.selectedBotId = g.botId || 'larry';
        await window.startBotMatch();
        return;
      }
      const oppUid = state.currentUser.uid === g.whiteUid ? g.blackUid : g.whiteUid;
      const chRef = push(ref(rtdb, 'bc_challenges'));
      await set(chRef, {
        id: chRef.key,
        fromUid: state.currentUser.uid,
        fromNick: state.currentUser.nick,
        toUid: oppUid,
        timeControl: g.timeControl || 10,
        rated: Boolean(g.rated),
        status: 'pending',
        createdAt: Date.now()
      });
      showToast('Запрос на реванш отправлен сопернику!');
    };

    // =========================================================================
    // УПРАВЛЕНИЕ ПЛЕЕРОМ FM В ПАРТИИ
    // =========================================================================
    window.fmTogglePlay = async function() {
      const g = state.activeGame;
      if (!g) return;
      ensureAudioCtx();
      const nextPlaying = !(g.fmPlayer && g.fmPlayer.playing);
      await update(ref(rtdb, `bc_games/${g.id}/fmPlayer`), {
        playing: nextPlaying,
        trackId: fmLocalState.trackId,
        elapsed: fmLocalState.elapsed
      });
    };

    window.fmSelectTrack = async function(trackId) {
      const g = state.activeGame;
      if (!g) return;
      ensureAudioCtx();
      fmLocalState.trackId = Number(trackId);
      fmLocalState.elapsed = 0;
      await update(ref(rtdb, `bc_games/${g.id}/fmPlayer`), {
        playing: true,
        trackId: Number(trackId),
        elapsed: 0
      });
    };

    window.fmSeekTrack = async function(secondsVal) {
      const g = state.activeGame;
      if (!g) return;
      fmLocalState.elapsed = Number(secondsVal);
      await update(ref(rtdb, `bc_games/${g.id}/fmPlayer`), {
        elapsed: Number(secondsVal)
      });
    };

    // =========================================================================
    // КУРСЫ ОТ ТРЕНЕРА
    // =========================================================================
    window.selectLesson = function(lessonId) {
      if (lessonAutoNextTimer) {
        clearTimeout(lessonAutoNextTimer);
        lessonAutoNextTimer = null;
      }
      const lesson = LESSONS.find(l => l.id === Number(lessonId)) || LESSONS[0];
      state.selectedLessonId = lesson.id;
      state.lessonFen = lesson.fen;
      state.lessonStatus = 'neutral';
      state.lessonMessage = lesson.hint;
      state.selectedSquare = null;
      state.legalTargets = [];
      renderApp();
    };

    window.handleLessonSquareClick = async function(sq) {
      const lesson = LESSONS.find(l => l.id === state.selectedLessonId) || LESSONS[0];
      const chess = new Chess(state.lessonFen);
      if (state.selectedSquare) {
        const move = chess.move({ from: state.selectedSquare, to: sq, promotion: 'q' });
        if (move) {
          const uci = move.from + move.to;
          if (lesson.expected.includes(uci)) {
            state.lessonFen = chess.fen();
            state.lessonStatus = 'ok';
            state.lessonMessage = 'Отлично! Переходим к следующему уроку...';
            playChessPieceSound(Boolean(move.captured));
            if (state.currentUser?.uid) {
              const prevDone = state.currentUser.completedLessons || {};
              const nextDone = { ...prevDone, [lesson.id]: true };
              state.currentUser = { ...state.currentUser, completedLessons: nextDone };
              saveLocalSession(state.currentUser);
              update(ref(rtdb, `bc_users/${state.currentUser.uid}/completedLessons`), { [lesson.id]: true }).catch(() => {});
            }
            if (lessonAutoNextTimer) clearTimeout(lessonAutoNextTimer);
            const nextId = lesson.id < LESSONS.length ? lesson.id + 1 : 1;
            lessonAutoNextTimer = setTimeout(() => {
              window.selectLesson(nextId);
            }, 2000);
          } else {
            state.lessonStatus = 'error';
            state.lessonMessage = `Ошибка! Ход ${move.san} не подходит. Попробуйте снова: ${lesson.hint}`;
          }
          state.selectedSquare = null;
          state.legalTargets = [];
          renderApp();
          return;
        }
      }
      const p = chess.get(sq);
      if (p && p.color === chess.turn()) {
        state.selectedSquare = sq;
        state.legalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to);
      } else {
        state.selectedSquare = null;
        state.legalTargets = [];
      }
      renderApp();
    };

    // =========================================================================
    // РЕНДЕР ШАХМАТНОЙ ДОСКИ (8x8)
    // =========================================================================
    function renderChessBoard({ fen, flipped = false, lastMove = null, onClickFnName = 'handleBoardSquareClick', draggable = true }) {
      const chess = new Chess(fen);
      const board = chess.board();
      const theme = state.currentUser?.boardTheme || 'green';
      const lightCls = theme === 'wood' ? 'theme-wood-light' : 'theme-green-light';
      const darkCls = theme === 'wood' ? 'theme-wood-dark' : 'theme-green-dark';

      const rows = flipped ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
      const cols = flipped ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

      let cellsHtml = '';
      for (const r of rows) {
        for (const c of cols) {
          const sqName = `${files[c]}${8 - r}`;
          const isLight = (r + c) % 2 === 0;
          const isLastMove = lastMove && (lastMove.from === sqName || lastMove.to === sqName);
          const isSelected = state.selectedSquare === sqName;
          const isLegalTarget = state.legalTargets.includes(sqName);
          const piece = board[r][c];
          const pieceCode = piece ? `${piece.color}${piece.type.toUpperCase()}` : null;
          const hideDragged = state.draggingFrom === sqName;

          cellsHtml += `
            <div data-square="${sqName}"
                 onclick="window.${onClickFnName}('${sqName}')"
                 ${draggable && pieceCode ? `onpointerdown="window.startPieceDrag(event, '${sqName}')"` : ''}
                 class="sq-cell ${isLight ? lightCls : darkCls} ${isLastMove ? 'sq-last-move' : ''} ${isSelected ? 'sq-selected' : ''}">
              ${pieceCode && !hideDragged ? PIECE_SVGS[pieceCode] : ''}
              ${isLegalTarget ? (pieceCode ? '<div class="legal-ring"></div>' : '<div class="legal-dot"></div>') : ''}
            </div>
          `;
        }
      }

      return `<div class="board-grid border border-grayBorder">${cellsHtml}</div>`;
    }

                            class="font-bold text-white hover:text-tealBright cursor-pointer">${escapeHtml(pl.nick)}</button>
                  </div>
                  <span class="font-black text-tealAccent">${getUserRatingForTime(pl, tc)} Эло</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

        const q = normalizeNick(state.friendChallengeSearch);
        const candidates = Object.values(state.usersMap)
          .filter(u => u && u.uid !== state.currentUser?.uid && u.nick && (!q || normalizeNick(u.nick).includes(q)))
          .slice(0, 12);

        return `
          <div class="max-w-md mx-auto mt-8 rounded-2xl bg-grayNav border border-grayBorder p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="text-lg font-extrabold text-white">Играть с другом</h2>
              <button type="button" onclick="window.openFriendChallengePanel(false)"
                      class="px-3 py-1 rounded-xl bg-grayCard hover:bg-grayHover text-xs font-bold text-gray-200 cursor-pointer">← Назад</button>
            </div>

            <input id="friend-challenge-input" type="text" value="${escapeHtml(state.friendChallengeSearch)}"
                   oninput="window.setFriendChallengeSearch(this.value)"
                   placeholder="Поиск игрока по нику..."
                   class="w-full bg-grayBase border border-grayBorder rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-tealAccent" />

              ${candidates.map(cand => {

                  <button type="button" onclick="window.setFriendChallengeTarget('${escapeJsAttr(cand.uid)}')"
                          class="w-full p-2.5 rounded-xl border text-left flex items-center justify-between text-xs cursor-pointer ${

                          }">
                    <span class="flex items-center gap-2 font-bold">
                      <span class="w-2.5 h-2.5 rounded-full ${online ? 'bg-emerald-400' : 'bg-gray-600'}"></span>
                      ${renderTitleBadge(cand)}
                      <span>${escapeHtml(cand.nick)}</span>
                    </span>
                    <span class="text-[11px] ${online ? 'text-emerald-400' : 'text-gray-500'}">${online ? 'В сети' : 'Оффлайн'}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <div class="grid grid-cols-3 gap-2">
              ${[10, 3, 1].map(m => `
                <button type="button" onclick="window.setTimeControl(${m})"
                        class="py-2.5 rounded-xl font-extrabold text-xs cursor-pointer border ${
                          state.selectedTimeControl === m
                            ? 'bg-tealAccent text-black border-tealAccent'
                            : 'bg-grayBase text-gray-200 border-grayBorder'
                        }">${m} мин</button>
              `).join('')}
            </div>

            <div class="flex items-center justify-between p-3 rounded-xl bg-grayBase border border-grayBorder">
              <span class="text-xs font-bold text-gray-200">На рейтинг Эло</span>
              <button type="button" onclick="window.toggleRatedMode()"
                      class="w-12 h-6 rounded-full p-1 transition cursor-pointer ${state.selectedRated ? 'bg-tealAccent' : 'bg-gray-600'}">
                <div class="w-4 h-4 rounded-full bg-white transition-transform ${state.selectedRated ? 'translate-x-6' : ''}"></div>
              </button>
            </div>

            <button type="button" onclick="window.sendFriendChallenge()"
                    class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm cursor-pointer shadow-lg">
              Отправить вызов
            </button>
          </div>
        `;
      }

      const activeQueueObj = state.queueMap?.[state.selectedTimeControl] || {};
      const playersInQueueCount = Object.values(activeQueueObj).filter(
        q => q && Date.now() - (q.joinedAt || 0) < 120000
      ).length;

      return `
        <div class="max-w-md mx-auto mt-8 rounded-2xl bg-grayNav border border-grayBorder p-6 shadow-2xl space-y-5">
          <div class="text-center">
            <h1 class="text-xl font-extrabold text-white">Новая партия</h1>
            <p class="text-xs text-gray-400 mt-1">Выберите контроль времени и режим игры</p>
            <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-grayBase border border-grayBorder text-xs font-bold text-tealBright">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
              <span>В подборе (${state.selectedTimeControl} мин): ${playersInQueueCount} чел.</span>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2.5">
            ${[10, 3, 1].map(m => `
              <button type="button" onclick="window.setTimeControl(${m})"
                      class="py-3 rounded-xl font-black text-sm cursor-pointer border ${
                        state.selectedTimeControl === m
                          ? 'bg-tealAccent text-black border-tealAccent'
                          : 'bg-grayBase text-gray-200 border-grayBorder hover:bg-grayHover'
                      }">${m} мин</button>
            `).join('')}
          </div>

          <div class="flex items-center justify-between p-3.5 rounded-xl bg-grayBase border border-grayBorder">
            <span class="text-xs font-bold text-gray-200">Игра на рейтинг (Эло)</span>
            <button type="button" onclick="window.toggleRatedMode()"
                    class="w-12 h-6 rounded-full p-1 transition cursor-pointer ${state.selectedRated ? 'bg-tealAccent' : 'bg-gray-600'}">
              <div class="w-4 h-4 rounded-full bg-white transition-transform ${state.selectedRated ? 'translate-x-6' : ''}"></div>
            </button>
          </div>

          <button type="button" onclick="window.startMatchmaking()"
                  class="w-full py-3.5 rounded-xl ${state.isSearchingMatch ? 'bg-amber-500 text-black' : 'bg-blue-600 hover:bg-blue-500 text-white'} font-extrabold text-sm cursor-pointer shadow-lg">
            ${state.isSearchingMatch ? 'Поиск соперника... (нажмите для отмены)' : 'Начать партию'}
          </button>

          <button type="button" onclick="window.openFriendChallengePanel(true)"
                  class="w-full py-3 rounded-xl bg-grayCard hover:bg-grayHover border border-grayBorder text-white font-bold text-sm cursor-pointer">
            Играть с другом
          </button>
        </div>
      `;
    }

    function renderActiveGameScreen() {
      const g = state.activeGame;
      if (!g) {
        return `<div class="text-center text-gray-400 mt-16 text-sm">Загрузка шахматной партии...</div>`;
      }

      const myUid = state.currentUser?.uid;
      const amWhite = myUid === g.whiteUid;
      const flipped = myUid === g.blackUid;
      const movesArr = Array.isArray(g.moves) ? g.moves : Object.values(g.moves || {});
      const curPly = state.replayPly === null ? movesArr.length : state.replayPly;
      const displayFen = curPly === 0 ? new Chess().fen() : (movesArr[curPly - 1]?.fen || g.fen);
      const displayLastMove = curPly > 0 ? movesArr[curPly - 1] : null;

      const topUser = flipped
        ? { uid: g.whiteUid, nick: g.whiteNick, elo: g.whiteElo, titles: state.usersMap[g.whiteUid]?.titles }
        : { uid: g.blackUid, nick: g.blackNick, elo: g.blackElo, titles: state.usersMap[g.blackUid]?.titles, isBot: g.mode === 'bot' };

      const botUser = flipped
        ? { uid: g.blackUid, nick: g.blackNick, elo: g.blackElo, titles: state.usersMap[g.blackUid]?.titles }
        : { uid: g.whiteUid, nick: g.whiteNick, elo: g.whiteElo, titles: state.usersMap[g.whiteUid]?.titles };

      const hasFmTitle = getUserTitles(state.currentUser).includes('FM');
      const curTrack = FM_TRACKS[fmLocalState.trackId] || FM_TRACKS[0];
      const chatMsgs = g.chat ? Object.values(g.chat).sort((a, b) => a.createdAt - b.createdAt) : [];

      const brilliantCount = movesArr.filter(m => m.quality === 'brilliant').length;
      const bestCount = movesArr.filter(m => m.quality === 'best').length;
      const goodCount = movesArr.filter(m => m.quality === 'good').length;

      let resultHeadline = 'Партия завершена';
      if (g.status === 'finished') {
        if (g.winner === 'draw') resultHeadline = 'Ничья!';
        else if ((g.winner === 'white' && amWhite) || (g.winner === 'black' && flipped)) resultHeadline = 'Вы выиграли!';
        else resultHeadline = 'Вы проиграли';
      }

      return `
        <div class="max-w-7xl mx-auto mt-2 grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
          <!-- Левая колонка: плеер для обладателей титула FM -->
          <div class="lg:col-span-3 space-y-3">
            ${hasFmTitle ? `
              <div class="rounded-2xl bg-grayNav border border-tealAccent p-4 space-y-3 shadow-xl">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-black uppercase text-tealBright">FM Плеер (общий звук)</span>
                  <span class="px-1.5 py-0.5 rounded bg-[#b91c1c] text-white text-[10px] font-black">FM</span>
                </div>
                <select onchange="window.fmSelectTrack(this.value)"
                        class="w-full bg-grayBase border border-grayBorder rounded-xl px-2.5 py-2 text-xs text-white">
                  ${FM_TRACKS.map(t => `<option value="${t.id}" ${t.id === fmLocalState.trackId ? 'selected' : ''}>${escapeHtml(t.title)}</option>`).join('')}
                </select>
                <div class="space-y-1">
                  <input id="fm-seek-slider" type="range" min="0" max="${curTrack.duration}" value="${fmLocalState.elapsed}"
                         onchange="window.fmSeekTrack(this.value)"
                         class="w-full accent-teal-400 cursor-pointer" />
                  <div id="fm-time-label" class="text-[11px] text-gray-400 text-right">
                    ${formatClock(fmLocalState.elapsed)} / ${formatClock(curTrack.duration)}
                  </div>
                </div>
                <button type="button" onclick="window.fmTogglePlay()"
                        class="w-full py-2 rounded-xl bg-tealAccent text-black font-extrabold text-xs cursor-pointer">
                  ${g.fmPlayer?.playing ? '⏸ Пауза для обоих' : '▶ Включить для обоих'}
                </button>
              </div>
            ` : `
              <div class="hidden lg:block rounded-2xl bg-grayNav/60 border border-grayBorder p-4 text-xs text-gray-400 space-y-1.5">
                <div class="font-bold text-gray-200">BurmalChess Live</div>
                <div>Контроль: ${g.mode === 'bot' ? 'Без времени (Бот)' : `${g.timeControl} мин`}</div>
                <div>Правило 30 сек: ход должен быть сделан вовремя.</div>
              </div>
            `}
          </div>

          <!-- Центральная колонка: доска + игроки + кнопки ходов -->
          <div class="lg:col-span-6 flex flex-col items-center space-y-2.5">
            <!-- Верхний игрок (противник) -->
            <div class="w-full max-w-[520px] relative flex items-center justify-between px-3.5 py-2 rounded-xl bg-grayNav border border-grayBorder">
              <div class="flex items-center gap-2">
                ${renderTitleBadge(topUser)}
                <button type="button" onclick="window.togglePlayerMenuSide('top')"
                        class="text-sm font-extrabold text-white hover:text-tealBright cursor-pointer">${escapeHtml(topUser.nick)}</button>
                <span class="text-xs text-gray-400">(${topUser.elo})</span>
              </div>
              ${g.mode !== 'bot' ? `<div id="clock-top" class="px-3 py-1 rounded-lg bg-grayBase font-mono font-black text-sm text-white">${formatClock(flipped ? g.whiteTime : g.blackTime)}</div>` : `<span class="text-xs text-tealAccent font-bold">${state.botIsThinking ? 'Думает...' : 'Бот'}</span>`}

              ${state.openPlayerMenuSide === 'top' && !topUser.isBot ? `
                <div class="absolute left-3 top-12 z-30 w-52 rounded-xl bg-grayNav border border-grayBorder p-2 shadow-2xl space-y-1 text-xs">
                  <button type="button" onclick="window.navigate('/@${escapeJsAttr(topUser.nick)}')" class="w-full text-left px-3 py-1.5 rounded-lg hover:bg-grayHover text-white cursor-pointer">Профиль</button>
                  <button type="button" onclick="window.sendFriendRequestByUid('${escapeJsAttr(topUser.uid)}')" class="w-full text-left px-3 py-1.5 rounded-lg hover:bg-grayHover text-tealBright cursor-pointer">Добавить в друзья</button>
                  <button type="button" onclick="window.rematchCurrentOpponent()" class="w-full text-left px-3 py-1.5 rounded-lg hover:bg-grayHover text-white cursor-pointer">Играть снова</button>
                </div>
              ` : ''}
            </div>

            <!-- Шахматная доска -->
            <div class="relative w-full max-w-[520px]">
              ${renderChessBoard({ fen: displayFen, flipped, lastMove: displayLastMove, draggable: g.status === 'active' && state.replayPly === null })}

              ${g.status === 'finished' && !state.gameResultModalClosed ? `
                <div class="absolute inset-0 z-20 bg-black/75 backdrop-blur-xs rounded-xl flex items-center justify-center p-4">
                  <div class="w-full max-w-xs rounded-2xl bg-grayNav border border-tealAccent p-5 text-center space-y-3 shadow-2xl">
                    <div class="flex justify-end">
                      <button type="button" onclick="state.gameResultModalClosed = true; renderApp();"
                              class="text-xs text-gray-400 hover:text-white cursor-pointer">✕ Закрыть</button>
                    </div>
                    <div class="text-2xl font-black text-white">${resultHeadline}</div>
                    <div class="text-xs text-gray-400">${escapeHtml(g.endReason || '')}</div>
                    <div class="grid grid-cols-3 gap-2 pt-1 text-xs">
                      <div class="p-2 rounded-xl bg-grayBase"><div class="font-black text-cyan-400">${brilliantCount}</div><div class="text-[10px] text-gray-400">Бриллиант.</div></div>
                      <div class="p-2 rounded-xl bg-grayBase"><div class="font-black text-emerald-400">${bestCount}</div><div class="text-[10px] text-gray-400">Лучших</div></div>
                      <div class="p-2 rounded-xl bg-grayBase"><div class="font-black text-teal-400">${goodCount}</div><div class="text-[10px] text-gray-400">Хороших</div></div>
                    </div>
                    <div class="text-xs text-gray-300">Время партии: <b>${formatClock(g.durationSec || 0)}</b></div>
                    <button type="button" onclick="window.rematchCurrentOpponent()"
                            class="w-full py-2.5 rounded-xl bg-tealAccent text-black font-extrabold text-xs cursor-pointer">
                      Играть снова
                    </button>
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Нижний игрок (вы) -->
            <div class="w-full max-w-[520px] flex items-center justify-between px-3.5 py-2 rounded-xl bg-grayNav border border-grayBorder">
              <div class="flex items-center gap-2">
                ${renderTitleBadge(botUser)}
                <span class="text-sm font-extrabold text-white">${escapeHtml(botUser.nick)}</span>
                <span class="text-xs text-gray-400">(${botUser.elo})</span>
              </div>
              ${g.mode !== 'bot' ? `<div id="clock-bottom" class="px-3 py-1 rounded-lg bg-grayBase font-mono font-black text-sm text-tealBright">${formatClock(flipped ? g.blackTime : g.whiteTime)}</div>` : ''}
            </div>

            <!-- Навигация по ходам + Сдаться -->
            <div class="w-full max-w-[520px] flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5">
                <button type="button" onclick="window.setReplayPly(0)" class="px-3 py-1.5 rounded-xl bg-grayCard hover:bg-grayHover text-xs font-black cursor-pointer">⏮</button>
                <button type="button" onclick="window.setReplayPly(${Math.max(0, curPly - 1)})" class="px-3 py-1.5 rounded-xl bg-grayCard hover:bg-grayHover text-xs font-black cursor-pointer">◀</button>
                <button type="button" onclick="window.setReplayPly(${Math.min(movesArr.length, curPly + 1)})" class="px-3 py-1.5 rounded-xl bg-grayCard hover:bg-grayHover text-xs font-black cursor-pointer">▶</button>
                <button type="button" onclick="window.setReplayPly(${movesArr.length})" class="px-3 py-1.5 rounded-xl bg-grayCard hover:bg-grayHover text-xs font-black cursor-pointer">⏭</button>
              </div>
              ${g.status === 'active' ? `
                <button type="button" onclick="window.resignCurrentGame()"
                        class="px-3.5 py-1.5 rounded-xl bg-red-950 hover:bg-red-900 border border-red-700 text-red-200 text-xs font-bold cursor-pointer">
                  Сдаться
                </button>
              ` : `
                <button type="button" onclick="window.rematchCurrentOpponent()"
                        class="px-3.5 py-1.5 rounded-xl bg-tealAccent text-black text-xs font-extrabold cursor-pointer">
                  Играть снова
                </button>
              `}
            </div>
          </div>

          <!-- Правая колонка: живой чат партии -->
          <div class="lg:col-span-3 rounded-2xl bg-grayNav border border-grayBorder p-4 flex flex-col h-[520px]">
            <div class="text-xs font-extrabold uppercase text-gray-300 pb-2 border-b border-grayBorder">Чат партии</div>
            <div class="flex-1 overflow-y-auto py-3 space-y-2 text-xs">
              ${chatMsgs.length === 0 ? `<div class="text-gray-500 text-center mt-8">Сообщений пока нет</div>` : chatMsgs.map(m => `
                <div class="p-2 rounded-xl bg-grayBase border border-grayBorder">
                  <span class="font-bold text-tealBright">${escapeHtml(m.nick)}:</span>
                  <span class="text-gray-200 break-words">${escapeHtml(m.text)}</span>
                </div>
              `).join('')}
            </div>
            <form onsubmit="window.sendGameChatMessage(event)" class="pt-2 border-t border-grayBorder flex gap-1.5">
              <input id="game-chat-input" type="text" placeholder="Написать сообщение..."
                     class="flex-1 bg-grayBase border border-grayBorder rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-tealAccent" />
              <button type="submit" class="px-3 py-2 rounded-xl bg-tealAccent text-black font-extrabold text-xs cursor-pointer">➤</button>
            </form>
          </div>
        </div>
      `;
    }

    function renderCoursesScreen() {
      const u = state.currentUser;
      const coach = COACHES.find(c => c.id === u?.coachId) || COACHES[0];
      const lesson = LESSONS.find(l => l.id === state.selectedLessonId) || LESSONS[0];
      const completedMap = u?.completedLessons || {};

      return `
        <div class="max-w-6xl mx-auto mt-2 grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <div class="lg:col-span-5 rounded-2xl bg-grayNav border border-grayBorder p-5 space-y-4">
            <div class="flex items-center gap-3.5">
              <div class="shrink-0">${coach.svg}</div>
              <div>
                <div class="text-xs uppercase font-bold text-tealAccent">Ваш тренер</div>
                <div class="text-xl font-black text-white">${escapeHtml(coach.name)}</div>
              </div>
            </div>

            <div class="p-4 rounded-xl border ${
              state.lessonStatus === 'error'
                ? 'bg-red-950/50 border-red-500 text-red-200'
                : state.lessonStatus === 'ok'
                  ? 'bg-emerald-950/50 border-emerald-500 text-emerald-200'
                  : 'bg-grayBase border-grayBorder text-gray-100'
            }">
              <div class="text-base font-extrabold mb-1">${escapeHtml(lesson.title)}</div>
              <div class="text-sm leading-relaxed">${escapeHtml(state.lessonMessage)}</div>
            </div>

            <div>
              <div class="text-xs font-extrabold text-gray-300 mb-2">Шкала занятий (1 – 100):</div>
              <div class="grid grid-cols-10 gap-1.5 max-h-60 overflow-y-auto pr-1">
                ${LESSONS.map(l => {
                  const isCurrent = l.id === lesson.id;
                  const isDone = Boolean(completedMap[l.id]);
                  return `
                    <button type="button" onclick="window.selectLesson(${l.id})"
                            class="py-1.5 rounded-lg text-xs font-extrabold cursor-pointer ${
                              isCurrent
                                ? 'bg-tealAccent text-black ring-2 ring-white'
                                : (isDone
                                    ? 'bg-blue-600 text-white'
                                    : 'bg-grayBase hover:bg-grayHover text-gray-300')
                            }">
                      ${l.id}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <div class="lg:col-span-7 flex flex-col items-center space-y-3">
            ${renderChessBoard({ fen: state.lessonFen, flipped: false, onClickFnName: 'handleLessonSquareClick', draggable: false })}
            <button type="button" onclick="window.selectLesson(${lesson.id})"
                    class="px-4 py-2 rounded-xl bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">
              Сбросить позицию урока
            </button>
          </div>
        </div>
      `;
    }

    function renderBotsScreen() {
      return `
        <div class="max-w-3xl mx-auto mt-4 space-y-5">
          <div class="rounded-2xl bg-grayNav border border-grayBorder p-5 flex flex-wrap items-center justify-between gap-3">

              <h1 class="text-xl font-black text-white">Игра против ботов</h1>

                      class="w-11 h-6 rounded-full p-1 transition cursor-pointer ${state.botThinkDelayEnabled ? 'bg-tealAccent' : 'bg-gray-600'}">

              `;

          </div>

          <button type="button" onclick="window.startBotMatch()"
                  class="w-full py-3.5 rounded-2xl bg-tealAccent hover:bg-tealBright text-black font-black text-sm cursor-pointer shadow-xl">
