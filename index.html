      { title: 'Защита от детского мата', fen: 'r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 3 3', hint: 'Не пускайте ферзя на f7! Сыграйте g6 или Qe7.', goal: 'Защитите пункт f7 от мата.' },
      { title: 'Тактика: жертва на f7', fen: 'r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/2N2N2/PPPP1PPP/R1BQK2R w KQkq - 5 5', hint: 'Сделайте сильный развивающий ход d3 или рокировку.', goal: 'Укрепите позицию белых.' }
    ];

    function getLessonData(num) {
      const idx = (num - 1) % LESSON_TOPICS.length;
      const tier = Math.ceil(num / 10);
      const base = LESSON_TOPICS[idx];
      return {
        num,
        title: `Урок #${num}: ${base.title}`,
        level: `Ступень ${tier} из 10`,
        fen: base.fen,
        hint: base.hint,
        goal: base.goal
      };
    }

    // =========================================================================
    // СОСТОЯНИЕ ПРИЛОЖЕНИЯ И РЕАЛТАЙМ-БАЗА
    // =========================================================================
    const UNICODE_PIECES = {
      wP: '♙', wR: '♖', wN: '♘', wB: '♗', wQ: '♕', wK: '♔',
      bP: '♟', bR: '♜', bN: '♞', bB: '♝', bQ: '♛', bK: '♚'
    };

    const LS_SESSION_UID = 'burmalchess_uid_v1';
    const LS_BOARD_THEME = 'burmalchess_theme_v1';

    const state = {
      currentUser: null,
      usersMap: {},
      pendingGoogleUser: null,
      authMode: 'login', // 'login' | 'register_email'
      onboardingCoachIdx: 0,

      viewedProfileUid: null,

      boardTheme: localStorage.getItem(LS_BOARD_THEME) || 'green', // 'green' | 'wood'

      friendChallengeTargetUid: null,

      activeGame: null,
      selectedSquare: null,
      legalTargets: [],
      viewMoveIndex: null, // null = текущий ход, иначе индекс в истории [0..moves.length]
      gameOverModalDismissed: false,
      nickMenuOpen: null, // 'top' | 'bottom' | null

      // Архив партий и просмотр повтора
      userArchives: {},
      replayGame: null,
      replayMoveIndex: 0,

    let clockInterval = null;
    let unsubActiveGame = null;
    let unsubChallenges = null;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function normalizeNick(nick) {
      return String(nick || '').trim().toLowerCase().replace(/^@+/, '');
    }

    function getTimeCategoryKey(minutes) {
      if (Number(minutes) === 1) return 'bullet';
      if (Number(minutes) === 3) return 'blitz';
      return 'rapid';
    }

    function getUserRatingForTime(user, minutes) {
      if (!user || !user.ratings) return 1200;
      const key = getTimeCategoryKey(minutes);
      return Number(user.ratings[key]) || 1200;
    }

    function formatClock(ms) {
      const safe = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(safe / 60);
      const s = safe % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function showToast(text, type = 'info') {
      const box = document.getElementById('toast-box');
      if (!box) return;
      const el = document.createElement('div');
      el.className = `px-4 py-2.5 rounded-xl border text-xs font-semibold shadow-2xl animate-pop pointer-events-auto ${
        type === 'error'
          ? 'bg-red-950/95 border-red-500/50 text-red-200'
          : 'bg-grayNav/95 border-tealAccent/50 text-tealBright'
      }`;
      el.textContent = text;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 2600);
    }

    // =========================================================================
    // ИНИЦИАЛИЗАЦИЯ REALTIME DATABASE (МГНОВЕННЫЕ ХОДЫ, ПРОФИЛИ, ВЫЗОВЫ)
    // =========================================================================
    function initRealtimeListeners() {
      // Все профили игроков (мгновенная синхронизация)
      onValue(ref(rtdb, 'bc_users'), (snap) => {
        const val = snap.val() || {};
        state.usersMap = val;
        if (state.currentUser && val[state.currentUser.uid]) {
          state.currentUser = val[state.currentUser.uid];
          updateHeaderUserUI();
        }
        renderSearchPopoverContent();
        if (state.route === 'profile' || state.route === 'home' || state.route === 'settings') {
          renderApp();
        }
      });

      // Архивы всех партий
      onValue(ref(rtdb, 'bc_archives'), (snap) => {
        state.userArchives = snap.val() || {};
        if (state.route === 'profile') renderApp();
      });

      // Следим за активными партиями, где участвует текущий пользователь
      onValue(ref(rtdb, 'bc_games'), (snap) => {
        if (!state.currentUser) return;
        const games = snap.val() || {};
        const myUid = state.currentUser.uid;
        const myActive = Object.values(games).find(
          g => g && g.status === 'active' && (g.whiteUid === myUid || g.blackUid === myUid)
        );
        if (myActive && state.activeGameId !== myActive.id) {
          joinActiveGameListener(myActive.id);
        }
      });
    }

    function attachUserSpecificListeners(uid) {
      if (unsubChallenges) unsubChallenges();
      const chRef = ref(rtdb, `bc_challenges/${uid}`);
      unsubChallenges = onValue(chRef, (snap) => {
        state.incomingChallenges = snap.val() || {};
        renderIncomingChallenges();
      });

      // Онлайн-статус
      const onlineRef = ref(rtdb, `bc_users/${uid}/online`);
      set(onlineRef, true).catch(() => {});
      onDisconnect(onlineRef).set(false).catch(() => {});
    }

    function joinActiveGameListener(gameId) {
      if (unsubActiveGame) unsubActiveGame();
      state.activeGameId = gameId;
      state.viewMoveIndex = null;
      state.gameOverModalDismissed = false;
      state.selectedSquare = null;
      state.legalTargets = [];

      const gRef = ref(rtdb, `bc_games/${gameId}`);
      unsubActiveGame = onValue(gRef, (snap) => {
        const g = snap.val();
        if (!g) return;
        const prevMovesLen = state.activeGame?.moves?.length || 0;
        const newMovesLen = g.moves?.length || 0;
        state.activeGame = g;

        if (newMovesLen > prevMovesLen && state.viewMoveIndex !== null) {
          state.viewMoveIndex = null;
        }

        if (state.route !== 'game') {
          state.route = 'game';
        }
        renderApp();
      });
    }

    // =========================================================================
    // АВТОРИЗАЦИЯ (GOOGLE / ПОЧТА РЕГИСТРАЦИЯ И ВХОД / НИК И ПАРОЛЬ)
    // =========================================================================
    function setSessionUser(userObj) {
      state.currentUser = userObj;
      state.usersMap[userObj.uid] = userObj;
      localStorage.setItem(LS_SESSION_UID, userObj.uid);
      updateHeaderUserUI();
      attachUserSpecificListeners(userObj.uid);
    }

    window.switchAuthTab = function(mode) {
      state.authMode = mode;
      renderApp();
    };

    window.handleGoogleAuth = async function() {
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const res = await signInWithPopup(auth, provider);
        const gUser = res.user;

        const existing = Object.values(state.usersMap).find(u => u.authUid === gUser.uid);
        if (existing) {
          setSessionUser(existing);
          state.route = 'home';
          showToast(`Добро пожаловать, ${existing.nick}!`);
          renderApp();
          return;
        }

        // Проверяем напрямую в RTDB на случай первого запуска
        const snap = await get(ref(rtdb, `bc_users/g_${gUser.uid}`));
        if (snap.exists()) {
          const u = snap.val();
          setSessionUser(u);
          state.route = 'home';
          renderApp();
          return;
        }

        // Новый аккаунт через Google -> страница придумывания ника и пароля
        state.pendingGoogleUser = {
          uid: `g_${gUser.uid}`,
          authUid: gUser.uid,
          email: gUser.email || '',
          suggestedNick: (gUser.email ? gUser.email.split('@')[0] : '').replace(/[^a-zA-Z0-9_]/g, '')
        };
        state.onboardingCoachIdx = 0;
        renderApp();
      } catch (err) {
        showToast(err?.message || 'Ошибка входа через Google', 'error');
      }
    };

    window.handleEmailRegister = async function(event) {
      event.preventDefault();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-pass').value;
      const nickRaw = document.getElementById('reg-nick').value.trim();
      const norm = normalizeNick(nickRaw);

      if (!norm) {
        showToast('Введите корректный никнейм', 'error');
        return;
      }

      const taken = Object.values(state.usersMap).some(u => normalizeNick(u.nick) === norm);
      if (taken) {
        showToast('Этот никнейм уже занят!', 'error');
        return;
      }

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        const newUser = {
          uid: `e_${cred.user.uid}`,
          authUid: cred.user.uid,
          email,
          nick: nickRaw.replace(/^@+/, ''),
          nickLower: norm,
          password: pass,
          coachId: null, // Выберет на следующем шаге
          ratings: { bullet: 1200, blitz: 1200, rapid: 1200 },
          friends: {},
          friendRequests: {},
          showArchivePublic: true,
          completedLessons: {},
          createdAt: Date.now()
        };
        await set(ref(rtdb, `bc_users/${newUser.uid}`), newUser);
        setSessionUser(newUser);
        state.onboardingCoachIdx = 0;
        renderApp();
      } catch (err) {
        showToast(err?.message || 'Ошибка регистрации по почте', 'error');
      }
    };

    window.handleCompleteGoogleSetup = async function(event) {
      event.preventDefault();
      if (!state.pendingGoogleUser) return;
      const nickRaw = document.getElementById('gsetup-nick').value.trim();
      const pass = document.getElementById('gsetup-pass').value;
      const norm = normalizeNick(nickRaw);

      if (!norm) {
        showToast('Введите никнейм', 'error');
        return;
      }
      const taken = Object.values(state.usersMap).some(u => normalizeNick(u.nick) === norm);
      if (taken) {
        showToast('Этот ник уже занят', 'error');
        return;
      }

      const newUser = {
        uid: state.pendingGoogleUser.uid,
        authUid: state.pendingGoogleUser.authUid,
        email: state.pendingGoogleUser.email,
        nick: nickRaw.replace(/^@+/, ''),
        nickLower: norm,
        password: pass,
        coachId: null,
        ratings: { bullet: 1200, blitz: 1200, rapid: 1200 },
        friends: {},
        friendRequests: {},
        showArchivePublic: true,
        completedLessons: {},
        createdAt: Date.now()
      };

      await set(ref(rtdb, `bc_users/${newUser.uid}`), newUser);
      state.pendingGoogleUser = null;
      setSessionUser(newUser);
      state.onboardingCoachIdx = 0;
      renderApp();
    };

    window.handleLoginSubmit = async function(event) {
      event.preventDefault();
      const loginId = document.getElementById('login-id').value.trim();
      const pass = document.getElementById('login-pass').value;

      if (!loginId || !pass) return;

      // Если введена почта — пробуем вход через Firebase Email Auth или поиск в базе
      if (loginId.includes('@') && !loginId.startsWith('@')) {
        try {
          const cred = await signInWithEmailAndPassword(auth, loginId, pass);
          const found = Object.values(state.usersMap).find(u => u.authUid === cred.user.uid);
          if (found) {
            setSessionUser(found);
            state.route = 'home';
            showToast(`С возвращением, ${found.nick}!`);
            renderApp();
            return;
          }
        } catch (err) {
          // Проверим также по базе на случай смены пароля
        }
      }

      // Вход по нику и паролю
      const norm = normalizeNick(loginId);
      let user = Object.values(state.usersMap).find(
        u => normalizeNick(u.nick) === norm || (u.email && u.email.toLowerCase() === loginId.toLowerCase())
      );

      if (!user) {
        const snap = await get(ref(rtdb, 'bc_users'));
        const all = snap.val() || {};
        state.usersMap = all;
        user = Object.values(all).find(
          u => normalizeNick(u.nick) === norm || (u.email && u.email.toLowerCase() === loginId.toLowerCase())
        );
      }

      if (!user) {
        showToast('Аккаунт не найден. Зарегистрируйтесь через Google или почту.', 'error');
        return;
      }

      if (user.password !== pass) {
        showToast('Неверный пароль!', 'error');
        return;
      }

      setSessionUser(user);
      state.route = 'home';
      showToast(`Вход выполнен: ${user.nick}`);
      renderApp();
    };

    window.logoutAccount = async function() {
      state.currentUser = null;
      localStorage.removeItem(LS_SESSION_UID);
      try { await signOut(auth); } catch (e) {}
      updateHeaderUserUI();
      state.route = 'home';
      renderApp();
    };

    // =========================================================================

    window.shiftCoachCarousel = function(delta) {
      state.onboardingCoachIdx = (state.onboardingCoachIdx + delta + COACHES.length) % COACHES.length;
      renderApp();
    };

    window.confirmSelectCoach = async function() {
      if (!state.currentUser) return;
      const chosen = COACHES[state.onboardingCoachIdx];
      await update(ref(rtdb, `bc_users/${state.currentUser.uid}`), { coachId: chosen.id });
      state.currentUser.coachId = chosen.id;
      state.route = 'home';
      showToast(`Ваш тренер: ${chosen.name}`);
      renderApp();

    // =========================================================================
    // ПОИСК ИГРОКОВ, ДРУЗЬЯ И ЗАПРОСЫ (ВСПЛЫВАЮЩЕЕ МЕНЮ ПО ЛУПЕ)
    // =========================================================================
    window.toggleSearchPopover = function(event) {
      if (event) event.stopPropagation();
      state.searchPopoverOpen = !state.searchPopoverOpen;
      const pop = document.getElementById('search-popover');
      if (state.searchPopoverOpen) {
        pop.classList.remove('hidden');
        renderSearchPopoverContent();
      } else {
        pop.classList.add('hidden');
      }
    };

    window.setSearchPopoverTab = function(tab) {
      state.searchPopoverTab = tab;
      const tSearch = document.getElementById('sp-tab-search');
      const tReq = document.getElementById('sp-tab-requests');
      const sBox = document.getElementById('sp-search-box');

      if (tab === 'requests') {
        tReq.className = 'py-2.5 text-center border-b-2 border-tealAccent text-white bg-grayCard/60 cursor-pointer';
        tSearch.className = 'py-2.5 text-center border-b-2 border-transparent text-gray-400 hover:text-white cursor-pointer';
        sBox.classList.add('hidden');
      } else {
        tSearch.className = 'py-2.5 text-center border-b-2 border-tealAccent text-white bg-grayCard/60 cursor-pointer';
        tReq.className = 'py-2.5 text-center border-b-2 border-transparent text-gray-400 hover:text-white cursor-pointer';
        sBox.classList.remove('hidden');
      }
      renderSearchPopoverContent();
    };

    function renderSearchPopoverContent() {
      const listEl = document.getElementById('sp-list');
      const badgeEl = document.getElementById('friend-req-badge');
      const reqCountEl = document.getElementById('sp-req-count');
      if (!listEl) return;

      const reqs = state.currentUser?.friendRequests ? Object.keys(state.currentUser.friendRequests) : [];
      if (badgeEl) {
        if (reqs.length > 0) {
          badgeEl.textContent = String(reqs.length);
          badgeEl.classList.remove('hidden');
        } else {
          badgeEl.classList.add('hidden');
        }
      }
      if (reqCountEl) reqCountEl.textContent = reqs.length > 0 ? `(${reqs.length})` : '';

      if (state.searchPopoverTab === 'requests') {
        if (!state.currentUser || reqs.length === 0) {
          listEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">Входящих запросов в друзья нет</p>`;
          return;
        }
        listEl.innerHTML = reqs.map(fromUid => {
          const u = state.usersMap[fromUid] || { uid: fromUid, nick: 'Игрок' };
          return `
            <div class="p-2.5 rounded-xl bg-grayBase border border-grayBorder flex items-center justify-between gap-2">
              <button onclick="openUserProfile('${escapeHtml(u.uid)}')" class="text-xs font-bold text-white hover:text-tealAccent truncate cursor-pointer">
                ${escapeHtml(u.nick)}
              </button>
              <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="acceptFriendRequest('${escapeHtml(u.uid)}')"
                        class="px-2.5 py-1 rounded-lg bg-tealAccent text-black text-[11px] font-bold cursor-pointer">Принять</button>
                <button onclick="declineFriendRequest('${escapeHtml(u.uid)}')"
                        class="px-2 py-1 rounded-lg bg-grayCard text-gray-300 text-[11px] cursor-pointer">✕</button>
              </div>
            </div>
          `;
        }).join('');
        return;
      }

      const q = (document.getElementById('sp-search-input')?.value || '').trim().toLowerCase();
      const myUid = state.currentUser?.uid;
      const myFriends = state.currentUser?.friends || {};

      let candidates = Object.values(state.usersMap).filter(u => u && u.uid !== myUid && u.nick);
      if (q) {
        candidates = candidates.filter(u => normalizeNick(u.nick).includes(normalizeNick(q)));
      } else {
        // Если поиск пустой — показываем сначала друзей, потом остальных игроков
        candidates.sort((a, b) => (myFriends[b.uid] ? 1 : 0) - (myFriends[a.uid] ? 1 : 0));
      }

      if (candidates.length === 0) {
        listEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">Игроки не найдены</p>`;
        return;
      }

      listEl.innerHTML = candidates.slice(0, 15).map(u => {
        const isFriend = Boolean(myFriends[u.uid]);
        return `
          <div class="p-2.5 rounded-xl bg-grayBase hover:bg-grayCard border border-grayBorder flex items-center justify-between gap-2 transition-colors">
            <button onclick="openUserProfile('${escapeHtml(u.uid)}')" class="flex items-center gap-2.5 min-w-0 text-left cursor-pointer">
              <span class="w-7 h-7 rounded-lg bg-tealDeep/40 border border-tealAccent/40 text-tealBright font-bold text-xs flex items-center justify-center shrink-0">
                ${escapeHtml(u.nick.charAt(0).toUpperCase())}
              </span>
              <div class="min-w-0">
                <p class="text-xs font-bold text-white truncate">${escapeHtml(u.nick)}</p>
                <p class="text-[10px] text-gray-400">Рапид: ${getUserRatingForTime(u, 10)}</p>
              </div>
            </button>
            <div class="flex items-center gap-1 shrink-0">
              ${!isFriend ? `
                <button onclick="sendFriendRequest('${escapeHtml(u.uid)}')" title="Добавить в друзья"
                        class="px-2 py-1 rounded-lg bg-tealAccent/20 hover:bg-tealAccent/30 text-tealBright text-[11px] font-semibold cursor-pointer">
                  + Друг
                </button>
              ` : `
                <span class="px-2 py-0.5 rounded bg-grayCard text-[10px] text-tealAccent">Друг</span>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    window.sendFriendRequest = async function(targetUid) {
      if (!state.currentUser) {
        showToast('Сначала войдите в аккаунт', 'error');
        return;
      }
      if (targetUid === state.currentUser.uid) return;
      await set(ref(rtdb, `bc_users/${targetUid}/friendRequests/${state.currentUser.uid}`), true);
      showToast('Запрос в друзья отправлен!');
    };

    window.acceptFriendRequest = async function(fromUid) {
      if (!state.currentUser) return;
      const myUid = state.currentUser.uid;
      await update(ref(rtdb), {
        [`bc_users/${myUid}/friends/${fromUid}`]: true,
        [`bc_users/${fromUid}/friends/${myUid}`]: true,
        [`bc_users/${myUid}/friendRequests/${fromUid}`]: null
      });
      showToast('Игрок добавлен в друзья!');
      renderSearchPopoverContent();
    };

    window.declineFriendRequest = async function(fromUid) {
      if (!state.currentUser) return;
      await remove(ref(rtdb, `bc_users/${state.currentUser.uid}/friendRequests/${fromUid}`));
      renderSearchPopoverContent();
    };

    // =========================================================================
    // ПОДБОР СОПЕРНИКА И ВЫЗОВ ДРУГА НА ПАРТИЮ
    // =========================================================================
    window.selectTimeControl = function(mins) {
      state.selectedTimeControl = mins;
      renderApp();
    };

    window.toggleRatedMode = function() {
      state.selectedRated = !state.selectedRated;
      renderApp();
    };

    window.openFriendChallengeSearch = function() {
      if (!state.currentUser) {
        showToast('Сначала войдите в аккаунт', 'error');
        return;
      }
      state.friendChallengeMode = true;
      state.friendChallengeTargetUid = null;
      state.friendSearchQuery = '';
      renderApp();
    };

    window.selectChallengeTarget = function(uid) {
      state.friendChallengeTargetUid = uid;
      renderApp();
    };

    window.sendChallengeToUser = async function() {
      if (!state.currentUser || !state.friendChallengeTargetUid) return;
      const targetUid = state.friendChallengeTargetUid;
      const chId = 'ch_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const timeMins = state.selectedTimeControl;
      const elo = getUserRatingForTime(state.currentUser, timeMins);

      await set(ref(rtdb, `bc_challenges/${targetUid}/${chId}`), {
        id: chId,
        fromUid: state.currentUser.uid,
        fromNick: state.currentUser.nick,
        fromElo: elo,
        timeMinutes: timeMins,
        rated: state.selectedRated,
        createdAt: Date.now()
      });

      state.friendChallengeMode = false;
      state.friendChallengeTargetUid = null;
      showToast('Вызов отправлен игроку!');
      renderApp();
    };

    function renderIncomingChallenges() {
      const box = document.getElementById('challenge-popup-container');
      if (!box) return;
      const list = Object.values(state.incomingChallenges || {});
      if (list.length === 0) {
        box.innerHTML = '';
        return;
      }

      box.innerHTML = list.map(ch => `
        <div class="pointer-events-auto rounded-2xl bg-grayNav border-2 border-tealAccent p-4 shadow-2xl animate-pop">
          <div class="flex items-start justify-between gap-2">
            <div>
              <p class="text-xs text-tealBright font-bold uppercase tracking-wider">Вызов на партию</p>
              <p class="text-sm font-bold text-white mt-1">
                Вас приглашает <span class="text-tealAccent">${escapeHtml(ch.fromNick)}</span> (${ch.fromElo})
              </p>
              <p class="text-xs text-gray-300 mt-0.5">
                ${ch.timeMinutes} мин • ${ch.rated ? 'Рейтинговая' : 'Товарищеская'}
              </p>
            </div>
          </div>
          <div class="mt-3 flex gap-2">
            <button onclick="acceptChallenge('${escapeHtml(ch.id)}')"
                    class="flex-1 py-2 rounded-xl bg-tealAccent hover:bg-tealBright text-black text-xs font-extrabold cursor-pointer">
              Принять
            </button>
            <button onclick="declineChallenge('${escapeHtml(ch.id)}')"
                    class="px-3 py-2 rounded-xl bg-grayCard hover:bg-grayHover text-gray-300 text-xs font-semibold cursor-pointer">

            </button>
          </div>
        </div>
      `).join('');
    }

    window.declineChallenge = async function(chId) {
      if (!state.currentUser) return;
      await remove(ref(rtdb, `bc_challenges/${state.currentUser.uid}/${chId}`));
    };

    window.acceptChallenge = async function(chId) {
      if (!state.currentUser) return;
      const ch = state.incomingChallenges[chId];
      if (!ch) return;
      await remove(ref(rtdb, `bc_challenges/${state.currentUser.uid}/${chId}`));

      const challenger = state.usersMap[ch.fromUid] || { uid: ch.fromUid, nick: ch.fromNick, ratings: { bullet: ch.fromElo, blitz: ch.fromElo, rapid: ch.fromElo } };
      await createAndStartMatch(challenger, state.currentUser, ch.timeMinutes, ch.rated);
    };

    window.startQuickMatchmaking = async function() {
      if (!state.currentUser) {
        showToast('Войдите в аккаунт, чтобы играть', 'error');
        return;
      }
      const timeMins = state.selectedTimeControl;
      const rated = state.selectedRated;
      const queueKey = `${timeMins}_${rated ? 'rated' : 'casual'}`;
      const queueRef = ref(rtdb, `bc_queue/${queueKey}`);

      state.matchmakingStatus = 'searching';
      renderApp();

      const snap = await get(queueRef);
      const queue = snap.val() || {};
      const myUid = state.currentUser.uid;
      const now = Date.now();

      // Ищем живого соперника в очереди (не старше 60 сек)
      const opponentEntry = Object.values(queue).find(
        entry => entry && entry.uid !== myUid && (now - (entry.createdAt || 0)) < 60000
      );

      if (opponentEntry) {
        await remove(ref(rtdb, `bc_queue/${queueKey}/${opponentEntry.uid}`));
        await remove(ref(rtdb, `bc_queue/${queueKey}/${myUid}`));
        state.matchmakingStatus = null;
        const oppUser = state.usersMap[opponentEntry.uid] || { uid: opponentEntry.uid, nick: opponentEntry.nick };
        await createAndStartMatch(oppUser, state.currentUser, timeMins, rated);
      } else {
        const myQueueRef = ref(rtdb, `bc_queue/${queueKey}/${myUid}`);
        await set(myQueueRef, {
          uid: myUid,
          nick: state.currentUser.nick,
          elo: getUserRatingForTime(state.currentUser, timeMins),
          createdAt: now
        });
        onDisconnect(myQueueRef).remove().catch(() => {});
      }
    };

    window.cancelMatchmaking = async function() {
      state.matchmakingStatus = null;
      if (state.currentUser) {
        const queueKey = `${state.selectedTimeControl}_${state.selectedRated ? 'rated' : 'casual'}`;
        await remove(ref(rtdb, `bc_queue/${queueKey}/${state.currentUser.uid}`)).catch(() => {});
      }
      renderApp();
    };

    async function createAndStartMatch(playerA, playerB, timeMinutes, rated) {
      const whiteFirst = Math.random() < 0.5;
      const white = whiteFirst ? playerA : playerB;
      const black = whiteFirst ? playerB : playerA;

      const gameId = 'game_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
      const initialMs = Number(timeMinutes) * 60 * 1000;
      const startFen = new Chess().fen();

      const gameObj = {
        id: gameId,
        status: 'active',
        timeMinutes: Number(timeMinutes),
        rated: Boolean(rated),
        whiteUid: white.uid,
        whiteNick: white.nick,
        whiteElo: getUserRatingForTime(white, timeMinutes),
        blackUid: black.uid,
        blackNick: black.nick,
        blackElo: getUserRatingForTime(black, timeMinutes),
        fen: startFen,
        fens: [startFen],
        moves: [],
        turn: 'w',
        whiteTimeMs: initialMs,
        blackTimeMs: initialMs,
        lastMoveAt: Date.now(),
        startedAt: Date.now(),
        winnerUid: null,
        resultText: '',
        stats: {
          white: { brilliant: 0, best: 0, good: 0 },
          black: { brilliant: 0, best: 0, good: 0 }
        }
      };

      await set(ref(rtdb, `bc_games/${gameId}`), gameObj);
      joinActiveGameListener(gameId);
    }

    // =========================================================================
    // ИГРОВАЯ ЛОГИКА ШАХМАТ (МГНОВЕННЫЕ ХОДЫ, ЧАСЫ, НАВИГАЦИЯ ХОДОВ, РЕВАНШ)
    // =========================================================================
    function classifyMoveQuality(chessBefore, moveObj, chessAfter) {
      if (chessAfter.in_checkmate() || moveObj.flags.includes('p') || (moveObj.captured && ['q', 'r'].includes(moveObj.captured))) {
        return 'brilliant';
      }
      if (chessAfter.in_check() || moveObj.captured || moveObj.flags.includes('k') || moveObj.flags.includes('q')) {
        return 'best';
      }
      return 'good';
    }

    window.onBoardSquareClick = async function(sq) {
      const g = state.activeGame;
      if (!g || g.status !== 'active' || !state.currentUser) return;

      // Если игрок просматривает прошлый ход — возвращаем к актуальной позиции
      if (state.viewMoveIndex !== null && state.viewMoveIndex < (g.moves?.length || 0)) {
        state.viewMoveIndex = null;
        renderApp();
        return;
      }

      const myColor = g.whiteUid === state.currentUser.uid ? 'w' : (g.blackUid === state.currentUser.uid ? 'b' : null);
      if (!myColor || g.turn !== myColor) return;

      const chess = new Chess(g.fen);
      const piece = chess.get(sq);

      // Если уже выбрана фигура и кликнули по допустимому ходу
      if (state.selectedSquare && state.legalTargets.includes(sq)) {
        const moveResult = chess.move({ from: state.selectedSquare, to: sq, promotion: 'q' });
        if (!moveResult) return;

        const now = Date.now();
        const elapsed = now - (g.lastMoveAt || now);
        let wMs = g.whiteTimeMs;
        let bMs = g.blackTimeMs;
        if (myColor === 'w') wMs = Math.max(0, wMs - elapsed);
        else bMs = Math.max(0, bMs - elapsed);

        const quality = classifyMoveQuality(null, moveResult, chess);
        const sideKey = myColor === 'w' ? 'white' : 'black';
        const newStats = {
          white: { ...(g.stats?.white || { brilliant: 0, best: 0, good: 0 }) },
          black: { ...(g.stats?.black || { brilliant: 0, best: 0, good: 0 }) }
        };
        newStats[sideKey][quality] = (newStats[sideKey][quality] || 0) + 1;

        const nextMoves = [...(g.moves || []), moveResult.san];
        const nextFens = [...(g.fens || [g.fen]), chess.fen()];

        state.selectedSquare = null;
        state.legalTargets = [];

        const patch = {
          fen: chess.fen(),
          fens: nextFens,
          moves: nextMoves,
          turn: chess.turn(),
          whiteTimeMs: wMs,
          blackTimeMs: bMs,
          lastMoveAt: now,
          stats: newStats
        };

        // Оптимистичное мгновенное обновление локально до ответа сервера
        state.activeGame = { ...g, ...patch };
        renderApp();

        if (chess.game_over()) {
          let winnerUid = 'draw';
          let reason = 'Ничья';
          if (chess.in_checkmate()) {
            winnerUid = myColor === 'w' ? g.whiteUid : g.blackUid;
            reason = 'Мат';
          } else if (chess.in_stalemate()) {
            reason = 'Пат';
          }
          await finalizeGame({ ...g, ...patch }, winnerUid, reason);
        } else {
          await update(ref(rtdb, `bc_games/${g.id}`), patch);
        }
        return;
      }

      // Выбор своей фигуры
      if (piece && piece.color === myColor) {
        state.selectedSquare = sq;
        const moves = chess.moves({ square: sq, verbose: true });
        state.legalTargets = moves.map(m => m.to);
      } else {
        state.selectedSquare = null;
        state.legalTargets = [];
      }
      renderApp();
    };

    window.resignActiveGame = async function() {
      const g = state.activeGame;
      if (!g || g.status !== 'active' || !state.currentUser) return;
      const isWhite = g.whiteUid === state.currentUser.uid;
      const winnerUid = isWhite ? g.blackUid : g.whiteUid;
      await finalizeGame(g, winnerUid, 'Сдача');
    };

    async function finalizeGame(g, winnerUid, reasonText) {
      if (g.status === 'finished') return;
      const finishedAt = Date.now();
      const durationSec = Math.max(1, Math.floor((finishedAt - (g.startedAt || finishedAt)) / 1000));

      let whiteDelta = 0;
      let blackDelta = 0;
      if (g.rated && winnerUid !== 'draw') {
        if (winnerUid === g.whiteUid) { whiteDelta = 12; blackDelta = -12; }
        else { whiteDelta = -12; blackDelta = 12; }
      }

      const finalData = {
        ...g,
        status: 'finished',
        winnerUid,
        resultText: reasonText,
        finishedAt,
        durationSec,
        whiteDelta,
        blackDelta
      };

      await update(ref(rtdb, `bc_games/${g.id}`), finalData);

      // Обновляем рейтинг и сохраняем партию в архив обоих игроков
      const cat = getTimeCategoryKey(g.timeMinutes);
      const wUser = state.usersMap[g.whiteUid];
      const bUser = state.usersMap[g.blackUid];

      if (wUser && g.rated) {
        const nextW = Math.max(100, getUserRatingForTime(wUser, g.timeMinutes) + whiteDelta);
        await set(ref(rtdb, `bc_users/${g.whiteUid}/ratings/${cat}`), nextW);
      }
      if (bUser && g.rated) {
        const nextB = Math.max(100, getUserRatingForTime(bUser, g.timeMinutes) + blackDelta);
        await set(ref(rtdb, `bc_users/${g.blackUid}/ratings/${cat}`), nextB);
      }

      await set(ref(rtdb, `bc_archives/${g.whiteUid}/${g.id}`), finalData);
      await set(ref(rtdb, `bc_archives/${g.blackUid}/${g.id}`), finalData);
    }

    // Таймер часов раз в секунду
    if (clockInterval) clearInterval(clockInterval);
    clockInterval = setInterval(async () => {
      const g = state.activeGame;
      if (!g || g.status !== 'active' || state.route !== 'game') return;

      const now = Date.now();
      const elapsed = now - (g.lastMoveAt || now);
      const curW = g.turn === 'w' ? Math.max(0, g.whiteTimeMs - elapsed) : g.whiteTimeMs;
      const curB = g.turn === 'b' ? Math.max(0, g.blackTimeMs - elapsed) : g.blackTimeMs;

      const topClockEl = document.getElementById('clock-top');
      const botClockEl = document.getElementById('clock-bottom');
      const isWhiteMe = state.currentUser && g.whiteUid === state.currentUser.uid;
      if (topClockEl) topClockEl.textContent = formatClock(isWhiteMe ? curB : curW);
      if (botClockEl) botClockEl.textContent = formatClock(isWhiteMe ? curW : curB);

      if (curW <= 0 && g.turn === 'w') {
        await finalizeGame(g, g.blackUid, 'Время вышло');
      } else if (curB <= 0 && g.turn === 'b') {
        await finalizeGame(g, g.whiteUid, 'Время вышло');
      }
    }, 500);

    // Кнопки просмотра ходов (первый, прошлый, следующий, последний)
    window.stepGameMove = function(mode) {
      const g = state.activeGame;
      if (!g) return;
      const total = (g.fens?.length || 1) - 1;
      const cur = state.viewMoveIndex === null ? total : state.viewMoveIndex;
      if (mode === 'first') state.viewMoveIndex = 0;
      else if (mode === 'prev') state.viewMoveIndex = Math.max(0, cur - 1);
      else if (mode === 'next') state.viewMoveIndex = Math.min(total, cur + 1);
      else if (mode === 'last') state.viewMoveIndex = null;
      renderApp();
    };

    window.togglePlayerNickMenu = function(pos) {
      state.nickMenuOpen = state.nickMenuOpen === pos ? null : pos;
      renderApp();
    };

    window.rematchSameSettings = async function() {
      const g = state.activeGame;
      if (!g || !state.currentUser) return;
      const oppUid = g.whiteUid === state.currentUser.uid ? g.blackUid : g.whiteUid;
      const oppUser = state.usersMap[oppUid] || { uid: oppUid, nick: g.whiteUid === oppUid ? g.whiteNick : g.blackNick };
      state.gameOverModalDismissed = true;
      await createAndStartMatch(state.currentUser, oppUser, g.timeMinutes, g.rated);
    };

    // =========================================================================
    // КУРСЫ ТРЕНЕРА (ШКАЛА 1..100 + ИНТЕРАКТИВНАЯ ДОСКА УРОКА)
    // =========================================================================
    window.selectLessonNumber = function(num) {
      const n = Math.min(100, Math.max(1, Number(num) || 1));
      state.selectedLessonNum = n;
      const data = getLessonData(n);
      state.lessonChess = new Chess(data.fen);
      state.lessonSelectedSq = null;
      state.lessonLegalTargets = [];
      state.lessonFeedback = '';
      renderApp();
    };

    window.onLessonSquareClick = async function(sq) {
      if (!state.lessonChess) {
        const data = getLessonData(state.selectedLessonNum);
        state.lessonChess = new Chess(data.fen);
      }
      const chess = state.lessonChess;
      const turn = chess.turn();
      const piece = chess.get(sq);

      if (state.lessonSelectedSq && state.lessonLegalTargets.includes(sq)) {
        const mv = chess.move({ from: state.lessonSelectedSq, to: sq, promotion: 'q' });
        state.lessonSelectedSq = null;
        state.lessonLegalTargets = [];
        if (mv) {
          state.lessonFeedback = `Отличный ход (${mv.san})! Урок #${state.selectedLessonNum} пройден.`;
          if (state.currentUser) {
            await set(ref(rtdb, `bc_users/${state.currentUser.uid}/completedLessons/${state.selectedLessonNum}`), true);
          }
        }
        renderApp();
        return;
      }

      if (piece && piece.color === turn) {
        state.lessonSelectedSq = sq;
        state.lessonLegalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to);
      } else {
        state.lessonSelectedSq = null;
        state.lessonLegalTargets = [];
      }
      renderApp();
    };

    // =========================================================================
    // НАСТРОЙКИ И ПРОФИЛЬ ИГРОКА (С ПРОСМОТРОМ АРХИВА ПАРТИЙ)
    // =========================================================================
    window.setBoardTheme = function(theme) {
      state.boardTheme = theme;
      localStorage.setItem(LS_BOARD_THEME, theme);
      showToast(theme === 'wood' ? 'Выбрана деревянная доска' : 'Выбрана стандартная зеленоватая доска');
      renderApp();
    };

    window.saveNewNickname = async function(event) {
      event.preventDefault();
      if (!state.currentUser) return;
      const newNickRaw = document.getElementById('settings-nick-input').value.trim();
      const norm = normalizeNick(newNickRaw);
      if (!norm) return;

      const taken = Object.values(state.usersMap).some(
        u => u.uid !== state.currentUser.uid && normalizeNick(u.nick) === norm
      );
      if (taken) {
        showToast('Этот ник уже занят', 'error');
        return;
      }

      await update(ref(rtdb, `bc_users/${state.currentUser.uid}`), {
        nick: newNickRaw.replace(/^@+/, ''),
        nickLower: norm
      });
      showToast('Никнейм обновлён!');
    };

    window.togglePublicArchiveSetting = async function() {
      if (!state.currentUser) return;
      const current = state.currentUser.showArchivePublic !== false;
      await update(ref(rtdb, `bc_users/${state.currentUser.uid}`), {
        showArchivePublic: !current
      });
      showToast(!current ? 'Архив партий открыт для всех' : 'Архив партий скрыт от других');
    };

    window.openUserProfile = function(uid) {
      state.searchPopoverOpen = false;
      const pop = document.getElementById('search-popover');
      if (pop) pop.classList.add('hidden');
      state.viewedProfileUid = uid;
      state.route = 'profile';
      renderApp();
    };

    window.openArchiveReplay = function(gameObj) {
      state.replayGame = gameObj;
      state.replayMoveIndex = 0;
      state.route = 'replay';
      renderApp();
    };

    window.stepReplayMove = function(mode) {
      const g = state.replayGame;
      if (!g) return;
      const total = (g.fens?.length || 1) - 1;
      if (mode === 'first') state.replayMoveIndex = 0;
      else if (mode === 'prev') state.replayMoveIndex = Math.max(0, state.replayMoveIndex - 1);
      else if (mode === 'next') state.replayMoveIndex = Math.min(total, state.replayMoveIndex + 1);
      else if (mode === 'last') state.replayMoveIndex = total;
      renderApp();
    };

    // =========================================================================
    // РЕНДЕР ДОСКИ (СТАНДАРТНАЯ ЗЕЛЕНОВАТАЯ ИЛИ ДЕРЕВЯННАЯ)
    // =========================================================================
    function renderChessBoardHtml({ fen, flipped = false, selectedSq = null, legalTargets = [], onSquareClickFn = 'onBoardSquareClick' }) {
      const chess = new Chess(fen);
      const board = chess.board();
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      const ranks = [8, 7, 6, 5, 4, 3, 2, 1];

      const rowOrder = flipped ? [...ranks].reverse() : ranks;
      const colOrder = flipped ? [...files].reverse() : files;

      const lightSq = state.boardTheme === 'wood' ? 'bg-[#ebd3b0]' : 'bg-[#dee3e6]';
      const darkSq = state.boardTheme === 'wood' ? 'bg-[#a9784f]' : 'bg-[#4b8b7a]';

      let cells = '';
      rowOrder.forEach((rank, rIdx) => {
        colOrder.forEach((file, cIdx) => {
          const sq = `${file}${rank}`;
          const fileNum = files.indexOf(file);
          const rankNum = 8 - rank;
          const isLight = (fileNum + rankNum) % 2 === 0;
          const piece = board[rankNum][fileNum];
          const isSelected = selectedSq === sq;
          const isTarget = legalTargets.includes(sq);

          const symbol = piece ? UNICODE_PIECES[piece.color + piece.type.toUpperCase()] : '';
          const pieceColorClass = piece?.color === 'w'
            ? 'text-white drop-shadow-[0_2px_2px_rgba(0,0,0,0.85)]'
            : 'text-[#141617] drop-shadow-[0_1px_1px_rgba(255,255,255,0.35)]';

          cells += `
            <div onclick="${onSquareClickFn}('${sq}')"
                 class="relative flex items-center justify-center ${isLight ? lightSq : darkSq} ${isSelected ? 'ring-4 ring-inset ring-tealBright' : ''} cursor-pointer">
              ${cIdx === 0 ? `<span class="absolute top-0.5 left-1 text-[9px] font-bold ${isLight ? 'text-black/60' : 'text-white/75'}">${rank}</span>` : ''}
              ${rIdx === 7 ? `<span class="absolute bottom-0.5 right-1 text-[9px] font-bold ${isLight ? 'text-black/60' : 'text-white/75'}">${file}</span>` : ''}
              ${symbol ? `<span class="text-3xl sm:text-5xl leading-none select-none ${pieceColorClass}">${symbol}</span>` : ''}
              ${isTarget ? `<span class="absolute w-3.5 h-3.5 rounded-full ${piece ? 'ring-4 ring-black/45 bg-transparent w-full h-full rounded-none' : 'bg-black/30'}"></span>` : ''}
            </div>
          `;
        });
      });

      return `<div class="board-grid w-full rounded-xl overflow-hidden border-2 border-grayBorder shadow-2xl">${cells}</div>`;
    }

    // =========================================================================
    // НАВИГАЦИЯ И РЕНДЕР ВСЕХ ЭКРАНОВ
    // =========================================================================
    window.navigate = function(route, param = null) {

        state.lessonChess = new Chess(data.fen);

    function updateHeaderUserUI() {

      const nickEl = document.getElementById('header-user-nick');

        nickEl.textContent = state.currentUser.nick;
      } else {

        nickEl.textContent = 'Войти';
      }
    }

    function renderAuthScreen() {
      if (state.pendingGoogleUser) {
        return `
          <div class="max-w-md mx-auto mt-6 rounded-2xl bg-grayNav border border-tealAccent/40 p-6 shadow-2xl animate-pop">
            <h1 class="text-xl font-extrabold text-white">Завершите регистрацию</h1>
            <p class="text-xs text-gray-400 mt-1">Придумайте никнейм и пароль — они сохранятся в памяти и будут работать всегда.</p>
            <form onsubmit="handleCompleteGoogleSetup(event)" class="mt-5 space-y-3">
              <div>
                <label class="block text-xs text-gray-300 mb-1">Никнейм</label>
                <input id="gsetup-nick" type="text" required maxlength="24" value="${escapeHtml(state.pendingGoogleUser.suggestedNick)}"
                       placeholder="Ваш ник"
                       class="w-full bg-grayBase border border-grayBorder focus:border-tealAccent rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs text-gray-300 mb-1">Пароль</label>
                <input id="gsetup-pass" type="password" required maxlength="64" placeholder="Придумайте пароль"
                       class="w-full bg-grayBase border border-grayBorder focus:border-tealAccent rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none" />

    function renderActiveGameScreen() {
      const g = state.activeGame;
      if (!g) return renderPlayLobbyScreen();

      const myUid = state.currentUser?.uid;
      const isWhiteMe = g.whiteUid === myUid;
      const flipped = !isWhiteMe;

      const topNick = isWhiteMe ? g.blackNick : g.whiteNick;
      const topElo = isWhiteMe ? g.blackElo : g.whiteElo;
      const topUid = isWhiteMe ? g.blackUid : g.whiteUid;
      const topTime = isWhiteMe ? g.blackTimeMs : g.whiteTimeMs;

      const botNick = isWhiteMe ? g.whiteNick : g.blackNick;
      const botElo = isWhiteMe ? g.whiteElo : g.blackElo;
      const botUid = isWhiteMe ? g.whiteUid : g.blackUid;
      const botTime = isWhiteMe ? g.whiteTimeMs : g.blackTimeMs;

      const fens = g.fens || [g.fen];
      const activeIdx = state.viewMoveIndex === null ? (fens.length - 1) : state.viewMoveIndex;
      const displayedFen = fens[activeIdx] || g.fen;

      const isFinished = g.status === 'finished';
      const didIWin = isFinished && g.winnerUid === myUid;
      const isDraw = isFinished && g.winnerUid === 'draw';
      const mySideStats = isWhiteMe ? (g.stats?.white || { brilliant: 0, best: 0, good: 0 }) : (g.stats?.black || { brilliant: 0, best: 0, good: 0 });
      const oppUid = isWhiteMe ? g.blackUid : g.whiteUid;

      return `
        <div class="max-w-4xl mx-auto flex flex-col lg:flex-row items-center lg:items-start justify-center gap-5 animate-pop">

            <!-- Плашка противника сверху -->
            <div class="relative flex items-center justify-between px-3.5 py-2 rounded-xl bg-grayNav border border-grayBorder">
              <button onclick="togglePlayerNickMenu('top')" class="flex items-center gap-2 text-left cursor-pointer hover:text-tealAccent">
                <span class="w-7 h-7 rounded-lg bg-grayCard text-white font-bold text-xs flex items-center justify-center">
                  ${escapeHtml(topNick.charAt(0).toUpperCase())}
                </span>
                <div>
                  <span class="text-sm font-bold text-white">${escapeHtml(topNick)}</span>
                  <span class="text-xs text-tealAccent font-semibold ml-1">(${topElo})</span>

                  <button onclick="sendFriendRequest('${escapeHtml(topUid)}'); state.nickMenuOpen=null; renderApp();"
                          class="w-full text-left px-3 py-2 rounded-lg hover:bg-grayHover text-white cursor-pointer">+ Добавить в друзья</button>
                  <button onclick="openUserProfile('${escapeHtml(topUid)}')"
                          class="w-full text-left px-3 py-2 rounded-lg hover:bg-grayHover text-white cursor-pointer">Просмотреть профиль</button>
                  <button onclick="rematchSameSettings()"
                          class="w-full text-left px-3 py-2 rounded-lg hover:bg-grayHover text-tealBright font-semibold cursor-pointer">Пригласить / Играть снова</button>
                </div>
              ` : ''}
            </div>

            <!-- Сама шахматная доска на весь доступный блок -->
            <div class="relative">
              ${renderChessBoardHtml({
                fen: displayedFen,
                flipped,
                selectedSq: state.selectedSquare,
                legalTargets: state.legalTargets,
                onSquareClickFn: 'onBoardSquareClick'
              })}

              <!-- Окно окончания партии посередине (можно закрыть и смотреть доску дальше) -->
              ${isFinished && !state.gameOverModalDismissed ? `
                <div class="absolute inset-0 z-30 flex items-center justify-center p-4 bg-black/70 backdrop-blur-xs rounded-xl">
                  <div class="w-full max-w-xs rounded-2xl bg-grayNav border-2 border-tealAccent p-5 text-center shadow-2xl relative animate-pop">
                    <button onclick="state.gameOverModalDismissed=true; renderApp();"
                            class="absolute top-3 right-3 w-7 h-7 rounded-lg bg-grayCard hover:bg-grayHover text-gray-300 text-xs cursor-pointer">✕</button>
                    <h2 class="text-xl font-extrabold ${didIWin ? 'text-tealBright' : (isDraw ? 'text-gray-200' : 'text-red-400')}">

                      <div class="flex justify-between">
                        <span class="text-cyan-300 font-semibold">💎 Бриллиантовые ходы:</span>
                        <span class="font-bold text-white">${mySideStats.brilliant || 0}</span>
                      </div>
                      <div class="flex justify-between">
                        <span class="text-tealAccent font-semibold">★ Лучшие ходы:</span>
                        <span class="font-bold text-white">${mySideStats.best || 0}</span>

                <span class="w-7 h-7 rounded-lg bg-tealAccent/20 text-tealAccent font-bold text-xs flex items-center justify-center">
                  ${escapeHtml(botNick.charAt(0).toUpperCase())}
                </span>
                <div>
                  <span class="text-sm font-bold text-white">${escapeHtml(botNick)}</span>
                  <span class="text-xs text-tealAccent font-semibold ml-1">(${botElo})</span>
                </div>
              </button>
              <div id="clock-bottom" class="px-3 py-1 rounded-lg bg-grayBase border border-tealAccent/40 font-mono font-bold text-base text-tealBright">
                ${formatClock(botTime)}
              </div>

              ${state.nickMenuOpen === 'bottom' ? `
                <div class="absolute left-3 bottom-12 z-30 w-52 rounded-xl bg-grayNav border border-tealAccent/40 shadow-2xl p-1.5 text-xs animate-pop">
                  <button onclick="openUserProfile('${escapeHtml(botUid)}')"
                          class="w-full text-left px-3 py-2 rounded-lg hover:bg-grayHover text-white cursor-pointer">Мой профиль</button>
                  <button onclick="rematchSameSettings()"
                          class="w-full text-left px-3 py-2 rounded-lg hover:bg-grayHover text-tealBright font-semibold cursor-pointer">Играть снова</button>
                </div>
              ` : ''}
            </div>

            <!-- Кнопки навигации ходов снизу как на chess.com: первый, прошлый, следующий, последний -->
            <div class="flex items-center justify-between gap-2 p-2 rounded-xl bg-grayNav border border-grayBorder">
              <div class="flex items-center gap-1.5">
                <button onclick="stepGameMove('first')" title="Первый ход"
                        class="px-3 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">|◀</button>
                <button onclick="stepGameMove('prev')" title="Прошлый ход"
                        class="px-3 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">◀</button>
                <button onclick="stepGameMove('next')" title="Следующий ход"
                        class="px-3 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">▶</button>
                <button onclick="stepGameMove('last')" title="Последний ход"
                        class="px-3 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">▶|</button>
              </div>
              <div class="flex items-center gap-2">
                ${!isFinished ? `
                  <button onclick="resignActiveGame()"
                          class="px-3 py-1.5 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-300 text-xs font-semibold cursor-pointer">
                    Сдаться
                  </button>
                ` : `
                  <button onclick="rematchSameSettings()"
                          class="px-3 py-1.5 rounded-lg bg-tealAccent text-black text-xs font-extrabold cursor-pointer">
                    Играть снова
                  </button>
                `}
              </div>
            </div>
          </div>

          <!-- Боковая панель записи ходов -->
          <div class="w-full max-w-[540px] lg:w-64 rounded-2xl bg-grayNav border border-grayBorder p-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-tealAccent mb-2">Ходы партии</h3>
            <div class="max-h-72 overflow-y-auto space-y-1 text-xs font-mono">
              ${(g.moves || []).length === 0 ? `<p class="text-gray-400 font-sans">Сделайте первый ход...</p>` : (g.moves || []).map((m, i) => `
                <div class="px-2 py-1 rounded ${activeIdx === i + 1 ? 'bg-tealAccent/20 text-tealBright font-bold' : 'text-gray-300'}">
                  ${Math.floor(i / 2) + 1}${i % 2 === 0 ? '.' : '...'} ${escapeHtml(m)}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderCoursesScreen() {
      const coach = COACHES.find(c => c.id === state.currentUser?.coachId) || COACHES[0];
      const lesson = getLessonData(state.selectedLessonNum);
      if (!state.lessonChess) state.lessonChess = new Chess(lesson.fen);
      const completedMap = state.currentUser?.completedLessons || {};
      const completedCount = Object.keys(completedMap).length;

      return `
        <div class="max-w-5xl mx-auto space-y-5 animate-pop">
          <!-- Шапка тренера и шкала занятий с 1 по 100 -->
          <div class="rounded-2xl bg-grayNav border border-grayBorder p-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-grayBorder">
              <div class="flex items-center gap-3.5">
                <div class="w-16 h-16 shrink-0 [&>svg]:w-16 [&>svg]:h-16">${coach.svg}</div>
                <div>
                  <span class="text-[11px] font-bold uppercase text-tealAccent">Ваш тренер: ${escapeHtml(coach.name)}</span>
                  <h1 class="text-lg font-extrabold text-white">${escapeHtml(lesson.title)}</h1>
                  <p class="text-xs text-gray-300 mt-0.5">«${escapeHtml(coach.quote)}»</p>
                </div>
              </div>
              <div class="text-right shrink-0">
                <span class="text-xs text-gray-400">Пройдено уроков:</span>
                <p class="text-lg font-extrabold text-tealAccent">${completedCount} / 100</p>
              </div>
            </div>

            <!-- Шкала выбора занятия с 1 по 100 -->
            <div class="mt-4 space-y-2.5">
              <div class="flex items-center justify-between text-xs">
                <span class="font-bold text-gray-300">Шкала занятий (1 — 100): <b class="text-tealBright">Урок #${state.selectedLessonNum}</b></span>
                <div class="flex gap-1.5">
                  <button onclick="selectLessonNumber(${state.selectedLessonNum - 1})"
                          class="px-2.5 py-1 rounded-lg bg-grayCard hover:bg-grayHover text-white cursor-pointer">◀ Пред.</button>
                  <button onclick="selectLessonNumber(${state.selectedLessonNum + 1})"
                          class="px-2.5 py-1 rounded-lg bg-grayCard hover:bg-grayHover text-white cursor-pointer">След. ▶</button>
                </div>
              </div>
              <input type="range" min="1" max="100" value="${state.selectedLessonNum}"
                     oninput="selectLessonNumber(this.value)"
                     class="w-full accent-teal-400 cursor-pointer" />
              <div class="flex gap-1.5 overflow-x-auto pb-1">
                ${Array.from({ length: 100 }, (_, i) => i + 1).map(n => `
                  <button onclick="selectLessonNumber(${n})"
                          class="w-8 h-8 rounded-lg shrink-0 text-xs font-bold cursor-pointer ${
                            n === state.selectedLessonNum
                              ? 'bg-tealAccent text-black'
                              : (completedMap[n] ? 'bg-tealDeep/40 border border-tealAccent/50 text-tealBright' : 'bg-grayCard text-gray-300 hover:bg-grayHover')
                          }">
                    ${n}
                  </button>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Интерактивная доска занятия -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5 items-start">
            <div class="max-w-[440px] w-full mx-auto">
              ${renderChessBoardHtml({
                fen: state.lessonChess.fen(),
                flipped: state.lessonChess.turn() === 'b',
                selectedSq: state.lessonSelectedSq,
                legalTargets: state.lessonLegalTargets,
                onSquareClickFn: 'onLessonSquareClick'
              })}
            </div>

            <div class="rounded-2xl bg-grayNav border border-grayBorder p-5 space-y-4">
              <div class="inline-block px-2.5 py-1 rounded-lg bg-tealAccent/15 text-tealBright text-xs font-bold">
                ${escapeHtml(lesson.level)}
              </div>
              <h2 class="text-base font-extrabold text-white">${escapeHtml(lesson.goal)}</h2>
              <p class="text-xs text-gray-300 leading-relaxed bg-grayBase p-3.5 rounded-xl border border-grayBorder">
                💡 Подсказка от ${escapeHtml(coach.name)}: ${escapeHtml(lesson.hint)}
              </p>
              ${state.lessonFeedback ? `
                <div class="p-3.5 rounded-xl bg-tealAccent/20 border border-tealAccent text-xs font-bold text-tealBright">
                  ${escapeHtml(state.lessonFeedback)}
                </div>
              ` : ''}
              <div class="flex gap-2">
                <button onclick="selectLessonNumber(${state.selectedLessonNum})"
                        class="px-4 py-2 rounded-xl bg-grayCard hover:bg-grayHover text-xs font-semibold text-gray-200 cursor-pointer">
                  Сбросить позицию
                </button>
                <button onclick="selectLessonNumber(${Math.min(100, state.selectedLessonNum + 1)})"
                        class="px-4 py-2 rounded-xl bg-tealAccent hover:bg-tealBright text-black text-xs font-extrabold cursor-pointer">
                  Следующий урок →
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderSettingsScreen() {
      if (!state.currentUser) return renderAuthScreen();
      const showPublic = state.currentUser.showArchivePublic !== false;

      return `
        <div class="max-w-xl mx-auto mt-4 space-y-5 animate-pop">
          <h1 class="text-2xl font-extrabold text-white">Настройки</h1>

          <!-- Выбор стиля доски -->
          <div class="rounded-2xl bg-grayNav border border-grayBorder p-5 space-y-3">
            <h2 class="text-sm font-bold text-white">Стиль шахматной доски</h2>
            <div class="grid grid-cols-2 gap-3">
              <button onclick="setBoardTheme('green')"
                      class="p-3.5 rounded-xl border text-left cursor-pointer ${state.boardTheme === 'green' ? 'border-tealAccent bg-tealAccent/15' : 'border-grayBorder bg-grayBase'}">
                <div class="flex gap-1 mb-2">
                  <span class="w-5 h-5 rounded bg-[#dee3e6]"></span>
                  <span class="w-5 h-5 rounded bg-[#4b8b7a]"></span>
                </div>
                <p class="text-xs font-bold text-white">Стандартный зеленоватый</p>
              </button>

              <button onclick="setBoardTheme('wood')"
                      class="p-3.5 rounded-xl border text-left cursor-pointer ${state.boardTheme === 'wood' ? 'border-tealAccent bg-tealAccent/15' : 'border-grayBorder bg-grayBase'}">
                <div class="flex gap-1 mb-2">
                  <span class="w-5 h-5 rounded bg-[#ebd3b0]"></span>
                  <span class="w-5 h-5 rounded bg-[#a9784f]"></span>
                </div>
                <p class="text-xs font-bold text-white">Деревянный</p>
              </button>
            </div>
          </div>

          <!-- Поменять никнейм -->
          <div class="rounded-2xl bg-grayNav border border-grayBorder p-5">
            <h2 class="text-sm font-bold text-white mb-3">Сменить никнейм</h2>
            <form onsubmit="saveNewNickname(event)" class="flex gap-2">
              <input id="settings-nick-input" type="text" required maxlength="24" value="${escapeHtml(state.currentUser.nick)}"
                     class="flex-1 bg-grayBase border border-grayBorder focus:border-tealAccent rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none" />
              <button type="submit" class="px-4 py-2 rounded-xl bg-tealAccent hover:bg-tealBright text-black text-xs font-extrabold cursor-pointer">
                Сохранить
              </button>
            </form>
          </div>

          <!-- Показ архива партий для всех (по умолчанию ВКЛ) -->
          <div class="rounded-2xl bg-grayNav border border-grayBorder p-5 flex items-center justify-between gap-4">
            <div>
              <h2 class="text-sm font-bold text-white">Показ архива партий для всех</h2>
              <p class="text-xs text-gray-400 mt-0.5">Другие игроки смогут смотреть ваши сыгранные партии в профиле</p>
            </div>
            <button onclick="togglePublicArchiveSetting()"
                    class="w-12 h-6 rounded-full transition-colors p-0.5 shrink-0 cursor-pointer ${showPublic ? 'bg-tealAccent' : 'bg-grayCard'}">
              <div class="w-5 h-5 rounded-full bg-black transition-transform ${showPublic ? 'translate-x-6' : 'translate-x-0'}"></div>
            </button>
          </div>

          <button onclick="logoutAccount()"
                  class="w-full py-2.5 rounded-xl bg-red-500/15 hover:bg-red-500/25 border border-red-500/30 text-red-300 text-xs font-bold cursor-pointer">
            Выйти из аккаунта
          </button>
        </div>
      `;
    }

    function renderProfileScreen() {
      const targetUid = state.viewedProfileUid || state.currentUser?.uid;
      const profile = targetUid ? state.usersMap[targetUid] : null;
      if (!profile) {
        return `<div class="max-w-xl mx-auto p-8 rounded-2xl bg-grayNav text-center text-sm text-gray-400">Профиль не найден</div>`;
      }

      const isMe = state.currentUser && state.currentUser.uid === profile.uid;
      const isFriend = state.currentUser && Boolean(state.currentUser.friends?.[profile.uid]);
      const friendsList = Object.keys(profile.friends || {}).map(id => state.usersMap[id]).filter(Boolean);
      const rawArchive = state.userArchives[profile.uid] || {};
      const gamesList = Object.values(rawArchive).sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
      const canSeeArchive = isMe || (profile.showArchivePublic !== false);

      window.__archiveCache = rawArchive;

      return `
        <div class="max-w-4xl mx-auto space-y-5 animate-pop">
          <div class="rounded-2xl bg-grayNav border border-grayBorder p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
              <div class="w-16 h-16 rounded-2xl bg-tealAccent/20 border border-tealAccent/40 text-tealBright font-extrabold text-2xl flex items-center justify-center">
                ${escapeHtml(profile.nick.charAt(0).toUpperCase())}
              </div>
              <div>
                <h1 class="text-2xl font-extrabold text-white">${escapeHtml(profile.nick)}</h1>
                <p class="text-xs text-gray-400 mt-0.5">Всего партий: <b class="text-white">${gamesList.length}</b> • Друзей: <b class="text-white">${friendsList.length}</b></p>
              </div>
            </div>

            ${!isMe && state.currentUser ? `
              <div>
                ${isFriend
                  ? `<span class="px-4 py-2 rounded-xl bg-tealAccent/20 border border-tealAccent/40 text-tealBright text-xs font-bold">В друзьях</span>`
                  : `<button onclick="sendFriendRequest('${escapeHtml(profile.uid)}')" class="px-4 py-2 rounded-xl bg-tealAccent hover:bg-tealBright text-black text-xs font-extrabold cursor-pointer">+ Добавить в друзья</button>`
                }
              </div>
            ` : ''}
          </div>

          <!-- Эло по каждому контролю: 1 мин, 3 мин, 10 мин -->
          <div class="grid grid-cols-3 gap-3">
            <div class="rounded-2xl bg-grayNav border border-grayBorder p-4 text-center">
              <p class="text-xs text-gray-400">⚡ 1 минута (Пуля)</p>
              <p class="text-xl font-extrabold text-tealAccent mt-1">${getUserRatingForTime(profile, 1)}</p>
            </div>
            <div class="rounded-2xl bg-grayNav border border-grayBorder p-4 text-center">
              <p class="text-xs text-gray-400">🔥 3 минуты (Блиц)</p>
              <p class="text-xl font-extrabold text-tealAccent mt-1">${getUserRatingForTime(profile, 3)}</p>
            </div>
            <div class="rounded-2xl bg-grayNav border border-grayBorder p-4 text-center">
              <p class="text-xs text-gray-400">⏱ 10 минут (Рапид)</p>
              <p class="text-xl font-extrabold text-tealAccent mt-1">${getUserRatingForTime(profile, 10)}</p>
            </div>
          </div>

          <!-- Список друзей -->
          <div class="rounded-2xl bg-grayNav border border-grayBorder p-5">
            <h2 class="text-sm font-bold text-white mb-3">Друзья (${friendsList.length})</h2>
            ${friendsList.length === 0 ? `<p class="text-xs text-gray-400">Список друзей пуст</p>` : `
              <div class="flex flex-wrap gap-2">
                ${friendsList.map(f => `
                  <button onclick="openUserProfile('${escapeHtml(f.uid)}')"
                          class="px-3 py-1.5 rounded-xl bg-grayBase hover:bg-grayCard border border-grayBorder text-xs font-semibold text-white cursor-pointer">
                    ${escapeHtml(f.nick)}
                  </button>
                `).join('')}
              </div>
            `}
          </div>

          <!-- Архив партий -->
          <div class="rounded-2xl bg-grayNav border border-grayBorder p-5">
            <h2 class="text-sm font-bold text-white mb-3">Архив партий</h2>
            ${!canSeeArchive ? `<p class="text-xs text-gray-400">Игрок скрыл свой архив партий в настройках.</p>` : (
              gamesList.length === 0 ? `<p class="text-xs text-gray-400">Сыгранных партий пока нет</p>` : `
                <div class="space-y-2">
                  ${gamesList.map(gm => {
                    const isWhite = gm.whiteUid === profile.uid;
                    const oppUid = isWhite ? gm.blackUid : gm.whiteUid;
                    const oppNick = isWhite ? gm.blackNick : gm.whiteNick;
                    const won = gm.winnerUid === profile.uid;
                    const draw = gm.winnerUid === 'draw';
                    return `
                      <div class="p-3 rounded-xl bg-grayBase border border-grayBorder flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div class="flex items-center gap-2.5 text-xs">
                          <span class="px-2 py-0.5 rounded font-bold ${won ? 'bg-tealAccent/20 text-tealBright' : (draw ? 'bg-grayCard text-gray-300' : 'bg-red-500/20 text-red-300')}">
                            ${won ? 'Победа' : (draw ? 'Ничья' : 'Поражение')}
                          </span>
                          <span class="text-gray-400">Против:</span>
                          <button onclick="openUserProfile('${escapeHtml(oppUid)}')" class="font-bold text-white hover:text-tealAccent underline cursor-pointer">
                            ${escapeHtml(oppNick)}
                          </button>
                          <span class="text-gray-500">• ${gm.timeMinutes} мин</span>
                        </div>
                        <button onclick="openArchiveReplay(window.__archiveCache['${escapeHtml(gm.id)}'])"
                                class="px-3 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-tealBright text-xs font-semibold cursor-pointer">
                          Смотреть партию →
                        </button>
                      </div>
                    `;
                  }).join('')}
                </div>
              `
            )}
          </div>
        </div>
      `;
    }

    function renderReplayScreen() {
      const g = state.replayGame;
      if (!g) return renderProfileScreen();
      const fens = g.fens || [g.fen];
      const fen = fens[state.replayMoveIndex] || fens[0];

      return `
        <div class="max-w-lg mx-auto space-y-3 animate-pop">
          <div class="flex items-center justify-between">
            <button onclick="navigate('profile', state.viewedProfileUid)" class="text-xs text-gray-400 hover:text-white cursor-pointer">← Назад в профиль</button>
            <span class="text-xs text-tealAccent font-bold">Ход ${state.replayMoveIndex} из ${fens.length - 1}</span>
          </div>

          <div class="p-3 rounded-xl bg-grayNav border border-grayBorder flex justify-between text-xs font-bold">
            <span>Чёрные: <button onclick="openUserProfile('${escapeHtml(g.blackUid)}')" class="text-tealAccent underline cursor-pointer">${escapeHtml(g.blackNick)}</button></span>
            <span>Белые: <button onclick="openUserProfile('${escapeHtml(g.whiteUid)}')" class="text-tealAccent underline cursor-pointer">${escapeHtml(g.whiteNick)}</button></span>
          </div>

          ${renderChessBoardHtml({ fen, flipped: false, onSquareClickFn: 'void' })}

          <div class="flex items-center justify-center gap-2 p-2.5 rounded-xl bg-grayNav border border-grayBorder">
            <button onclick="stepReplayMove('first')" class="px-3.5 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">|◀ В начало</button>
            <button onclick="stepReplayMove('prev')" class="px-3.5 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">◀ Назад</button>
            <button onclick="stepReplayMove('next')" class="px-3.5 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">Вперёд ▶</button>
            <button onclick="stepReplayMove('last')" class="px-3.5 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-xs font-bold text-white cursor-pointer">В конец ▶|</button>
          </div>
        </div>
      `;
    }

    function renderApp() {
      const main = document.getElementById('app-main');
      if (!main) return;

      // Если пользователь не вошёл — экран регистрации / входа
      if (!state.currentUser) {
        main.innerHTML = renderAuthScreen();
        return;
      }

      // Если вошёл, но ещё не выбрал тренера — экран выбора тренера
      if (!state.currentUser.coachId) {
        main.innerHTML = renderCoachPickerScreen();
        return;
      }

      if (state.route === 'play') main.innerHTML = renderPlayLobbyScreen();
      else if (state.route === 'game') main.innerHTML = renderActiveGameScreen();
      else if (state.route === 'courses') main.innerHTML = renderCoursesScreen();
      else if (state.route === 'settings') main.innerHTML = renderSettingsScreen();
      else if (state.route === 'profile') main.innerHTML = renderProfileScreen();
      else if (state.route === 'replay') main.innerHTML = renderReplayScreen();
      else main.innerHTML = renderHomeScreen();
    }

    document.addEventListener('click', (e) => {
      const wrap = document.getElementById('search-popover-wrapper');
      const pop = document.getElementById('search-popover');
      if (wrap && pop && !wrap.contains(e.target)) {
        state.searchPopoverOpen = false;
        pop.classList.add('hidden');
      }
    });

    // Запуск и восстановление сессии
    initRealtimeListeners();
    const savedUid = localStorage.getItem(LS_SESSION_UID);
    if (savedUid) {
      get(ref(rtdb, `bc_users/${savedUid}`)).then((snap) => {
        if (snap.exists()) {
          setSessionUser(snap.val());
          renderApp();
        }
      }).catch(() => {});
    }
    renderApp();

    onAuthStateChanged(auth, async (fbUser) => {
      if (!fbUser || state.currentUser) return;
      const snap = await get(ref(rtdb, `bc_users/g_${fbUser.uid}`)).catch(() => null);
      if (snap && snap.exists()) {
        setSessionUser(snap.val());
        renderApp();
      }
    });
  </script>
</body>
</html>
