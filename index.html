      `;
    }

    function renderProfileScreen(nickParam) {
      const target = Object.values(state.usersMap).find(
        u => u && u.nick && u.nick.toLowerCase() === nickParam.toLowerCase()
      );
      if (!target) {
        return `<div class="max-w-md mx-auto mt-16 p-6 rounded-2xl bg-grayNav border border-red-500 text-center text-sm text-red-300 font-bold">Пользователь @${escapeHtml(nickParam)} не найден</div>`;
      }

      const isMe = target.uid === state.currentUser?.uid;
      const isFriend = Boolean(state.currentUser?.friends && state.currentUser.friends[target.uid]);
      const isPendingReq = Object.values(state.friendRequestsMap || {}).some(
        r => r && r.status === 'pending' && r.fromUid === state.currentUser?.uid && r.toUid === target.uid
      );
      const friendUids = Object.keys(target.friends || {});
      const archives = state.userArchives[target.uid] ? Object.values(state.userArchives[target.uid]).sort((a, b) => b.createdAt - a.createdAt) : [];
      const canSeeArchive = isMe || target.publicArchive !== false;

      return `
        <div class="max-w-4xl mx-auto mt-3 space-y-5">
          <div class="rounded-2xl bg-grayNav border border-grayBorder p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1.5">
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full ${isUserOnline(target) ? 'bg-emerald-400' : 'bg-gray-600'}"></span>
                ${renderTitleBadge(target)}
                <h1 class="text-2xl font-black text-white">${escapeHtml(target.nick)}</h1>
              </div>
              <div class="flex flex-wrap gap-3 text-xs text-gray-300">
                <span>10 мин: <b class="text-tealAccent">${getUserRatingForTime(target, 10)}</b></span>
                <span>3 мин: <b class="text-tealAccent">${getUserRatingForTime(target, 3)}</b></span>
                <span>1 мин: <b class="text-tealAccent">${getUserRatingForTime(target, 1)}</b></span>
                <span>Партий: <b class="text-white">${target.gamesPlayed || archives.length}</b></span>
                <span>Друзей: <b class="text-white">${friendUids.length}</b></span>
              </div>
            </div>

            ${!isMe ? (
              isFriend
                ? `<button type="button" onclick="window.removeFriendByUid('${escapeJsAttr(target.uid)}')" class="px-4 py-2 rounded-xl bg-red-950 text-red-200 text-xs font-extrabold cursor-pointer">Удалить из друзей</button>`
                : (isPendingReq
                    ? `<span class="px-4 py-2 rounded-xl bg-grayCard text-gray-300 text-xs font-extrabold">Запрос отправлен</span>`
                    : `<button type="button" onclick="window.sendFriendRequestByUid('${escapeJsAttr(target.uid)}')" class="px-4 py-2 rounded-xl bg-tealAccent text-black text-xs font-extrabold cursor-pointer">Добавить в друзья</button>`)
            ) : ''}
          </div>

          ${state.archiveReplayGame ? (() => {
            const ag = state.archiveReplayGame;
            const mList = ag.moves || [];
            const ply = Math.min(mList.length, Math.max(0, state.archiveReplayPly));
            const fen = ply === 0 ? new Chess().fen() : (mList[ply - 1]?.fen || new Chess().fen());
            return `
              <div class="rounded-2xl bg-grayNav border border-tealAccent p-5 flex flex-col items-center space-y-3">
                <div class="w-full flex items-center justify-between text-xs">
                  <span class="font-bold text-white">${escapeHtml(ag.whiteNick)} vs ${escapeHtml(ag.blackNick)}</span>
                  <button type="button" onclick="state.archiveReplayGame = null; renderApp();" class="text-gray-400 hover:text-white cursor-pointer">✕ Закрыть просмотр</button>
                </div>
                ${renderChessBoard({ fen, flipped: ag.blackUid === target.uid, lastMove: ply > 0 ? mList[ply - 1] : null, draggable: false })}
                <div class="flex gap-2">
                  <button type="button" onclick="state.archiveReplayPly = 0; renderApp();" class="px-3 py-1.5 rounded-xl bg-grayCard text-xs font-black cursor-pointer">⏮</button>
                  <button type="button" onclick="state.archiveReplayPly = Math.max(0, ${ply - 1}); renderApp();" class="px-3 py-1.5 rounded-xl bg-grayCard text-xs font-black cursor-pointer">◀</button>
                  <button type="button" onclick="state.archiveReplayPly = Math.min(${mList.length}, ${ply + 1}); renderApp();" class="px-3 py-1.5 rounded-xl bg-grayCard text-xs font-black cursor-pointer">▶</button>
                  <button type="button" onclick="state.archiveReplayPly = ${mList.length}; renderApp();" class="px-3 py-1.5 rounded-xl bg-grayCard text-xs font-black cursor-pointer">⏭</button>
                </div>
              </div>
            `;
          })() : ''}

          <div class="rounded-2xl bg-grayNav border border-grayBorder p-5 space-y-3">
            <h2 class="text-base font-extrabold text-white">Архив партий</h2>
            ${!canSeeArchive ? `<p class="text-xs text-gray-400">Пользователь скрыл свой архив партий.</p>` : (
              archives.length === 0 ? `<p class="text-xs text-gray-400">Сыгранных партий пока нет.</p>` : archives.map((ag, idx) => {
                const isWhite = ag.whiteUid === target.uid;
                const oppNick = isWhite ? ag.blackNick : ag.whiteNick;
                const won = (ag.winner === 'white' && isWhite) || (ag.winner === 'black' && !isWhite);
                const label = ag.winner === 'draw' ? 'Ничья' : (won ? 'Победа' : 'Поражение');
                return `
                  <div class="p-3 rounded-xl bg-grayBase border border-grayBorder flex items-center justify-between gap-2 text-xs">
                    <div class="flex items-center gap-2">
                      <span class="px-2 py-0.5 rounded font-extrabold ${ag.winner === 'draw' ? 'bg-gray-700 text-gray-200' : (won ? 'bg-emerald-900 text-emerald-300' : 'bg-red-950 text-red-300')}">${label}</span>
                      <span class="text-gray-300">против</span>
                      ${ag.mode === 'bot' ? `<b class="text-white">${escapeHtml(oppNick)}</b>` : `<button type="button" onclick="window.navigate('/@${escapeJsAttr(oppNick)}')" class="font-bold text-tealBright hover:underline cursor-pointer">${escapeHtml(oppNick)}</button>`}
                    </div>
                    <button type="button" onclick="state.archiveReplayGame = state.userArchives['${escapeJsAttr(target.uid)}']['${escapeJsAttr(ag.id)}']; state.archiveReplayPly = 0; renderApp();"
                            class="px-3 py-1.5 rounded-lg bg-grayCard hover:bg-grayHover text-white font-bold cursor-pointer">Смотреть</button>
                  </div>
                `;
              }).join('')
            )}
          </div>
        </div>
      `;
    }

    function renderSettingsScreen() {
      const u = state.currentUser;
      const isAdmin = isCurrentUserAdmin();
      const allUsersList = Object.values(state.usersMap).filter(x => x && x.nick);

      const banCandidates = allUsersList.filter(x => !state.adminBanSearch || normalizeNick(x.nick).includes(normalizeNick(state.adminBanSearch))).slice(0, 6);
      const titleCandidates = allUsersList.filter(x => !state.adminTitleSearch || normalizeNick(x.nick).includes(normalizeNick(state.adminTitleSearch))).slice(0, 6);
      const eloCandidates = allUsersList.filter(x => !state.adminEloSearch || normalizeNick(x.nick).includes(normalizeNick(state.adminEloSearch))).slice(0, 6);
      const delCandidates = allUsersList.filter(x => !state.adminDeleteSearch || normalizeNick(x.nick).includes(normalizeNick(state.adminDeleteSearch))).slice(0, 6);

      const selectedTitleUser = state.adminTitleTargetUid ? state.usersMap[state.adminTitleTargetUid] : null;
      const activeBans = Object.values(state.bansMap || {});

      return `
        <div class="max-w-3xl mx-auto mt-3 space-y-6 pb-10">
          <!-- Обычные настройки -->
          <div class="rounded-2xl bg-grayNav border border-grayBorder p-6 space-y-4">
            <div class="flex items-center justify-between">
              <h1 class="text-xl font-black text-white">Настройки аккаунта</h1>
              <button type="button" onclick="window.logoutUser()"
                      class="px-3 py-1.5 rounded-xl bg-red-950 hover:bg-red-900 text-red-200 text-xs font-bold cursor-pointer">Выйти</button>
            </div>

            <form onsubmit="window.saveUserSettings(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-gray-300 mb-1">Никнейм (3–10 символов)</label>
                <input id="settings-nick" type="text" maxlength="10" value="${escapeHtml(u.nick)}"
                       class="w-full bg-grayBase border border-grayBorder rounded-xl px-3.5 py-2.5 text-sm text-white" />
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-bold text-gray-300 mb-1">Стиль доски</label>
                  <select id="settings-theme" class="w-full bg-grayBase border border-grayBorder rounded-xl px-3 py-2.5 text-sm text-white">
                    <option value="green" ${u.boardTheme !== 'wood' ? 'selected' : ''}>Стандартный зеленоватый</option>
                    <option value="wood" ${u.boardTheme === 'wood' ? 'selected' : ''}>Деревянный</option>
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-bold text-gray-300 mb-1">Тренер в курсах</label>
                  <select id="settings-coach" class="w-full bg-grayBase border border-grayBorder rounded-xl px-3 py-2.5 text-sm text-white">
                    ${COACHES.map(c => `<option value="${c.id}" ${u.coachId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
                  </select>
                </div>
              </div>

              <label class="flex items-center gap-2.5 text-xs font-bold text-gray-200 cursor-pointer">
                <input id="settings-archive" type="checkbox" ${u.publicArchive !== false ? 'checked' : ''} class="w-4 h-4 accent-teal-400" />
                <span>Показывать архив моих партий всем пользователям</span>
              </label>

              <button type="submit" class="px-5 py-2.5 rounded-xl bg-tealAccent text-black font-extrabold text-xs cursor-pointer">
                Сохранить настройки
              </button>
            </form>
          </div>

          <!-- Админ-панель только для zoneboren@gmail.com -->
          ${isAdmin ? `
            <div class="rounded-2xl bg-grayNav border-2 border-red-600/80 p-6 space-y-6">
              <div class="flex flex-wrap items-center justify-between gap-3 border-b border-grayBorder pb-4">
                <div>
                  <h2 class="text-lg font-black text-red-400">Админ-панель BurmalChess</h2>
                  <p class="text-xs text-gray-400">Полное управление сервером, банами, приписками и рейтингами</p>
                </div>
                <button type="button" onclick="window.adminToggleMaintenance()"
                        class="px-4 py-2 rounded-xl font-extrabold text-xs cursor-pointer ${
                          state.siteSettings?.maintenance
                            ? 'bg-emerald-500 text-black'
                            : 'bg-red-600 text-white'
                        }">
                  ${state.siteSettings?.maintenance ? 'Включить сайт для всех' : 'Выключить сайт (Техработы)'}
                </button>
              </div>

              <!-- 1. Баны и разбаны -->
              <div class="space-y-3">
                <h3 class="text-sm font-extrabold text-white">Блокировка пользователя</h3>
                <form onsubmit="window.adminIssueBan(event)" class="space-y-2.5">
                  <input type="text" value="${escapeHtml(state.adminBanSearch)}"
                         oninput="state.adminBanSearch = this.value; state.adminBanTargetUid = ''; renderApp();"
                         placeholder="Введите никнейм для бана..."
                         class="w-full bg-grayBase border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                  <div class="flex flex-wrap gap-1.5">
                    ${banCandidates.map(c => `
                      <button type="button" onclick="window.adminSetBanTarget('${escapeJsAttr(c.uid)}', '${escapeJsAttr(c.nick)}')"
                              class="px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer ${state.adminBanTargetUid === c.uid ? 'bg-red-600 text-white' : 'bg-grayCard text-gray-300'}">
                        ${escapeHtml(c.nick)} (${escapeHtml(c.email || 'без почты')})
                      </button>
                    `).join('')}
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input id="admin-ban-reason" type="text" placeholder="Причина бана (по желанию)"
                           class="bg-grayBase border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                    <select id="admin-ban-duration" class="bg-grayBase border border-grayBorder rounded-xl px-3 py-2 text-xs text-white">
                      <option value="1h">1 час</option>
                      <option value="1d">1 день</option>
                      <option value="7d">7 дней</option>
                      <option value="12d">12 дней</option>
                      <option value="30d">30 дней</option>
                      <option value="forever" selected>Навсегда</option>
                    </select>
                  </div>
                  <button type="submit" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs cursor-pointer">
                    Забанить игрока
                  </button>
                </form>

                <div class="space-y-1.5 pt-2">
                  <div class="text-xs font-bold text-gray-400">Забаненные пользователи (${activeBans.length}):</div>
                  ${activeBans.map(b => `
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-grayBase border border-grayBorder text-xs">
                      <span><b>${escapeHtml(b.nick)}</b> — ${escapeHtml(b.reason)}</span>
                      <button type="button" onclick="window.adminUnbanUser('${escapeJsAttr(b.uid)}')"
                              class="px-2.5 py-1 rounded-lg bg-emerald-700 text-white font-bold cursor-pointer">Разбанить</button>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- 2. Выдача и снятие любых приписок (GM, IM, FM, CM, NM и т.д.) -->
              <div class="space-y-3 border-t border-grayBorder pt-4">
                <h3 class="text-sm font-extrabold text-white">Выдача / снятие приписок (GM, IM, FM, CM, NM...)</h3>
                <input type="text" value="${escapeHtml(state.adminTitleSearch)}"
                       oninput="state.adminTitleSearch = this.value; renderApp();"
                       placeholder="Поиск игрока по нику..."
                       class="w-full bg-grayBase border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                <div class="flex flex-wrap gap-1.5">
                  ${titleCandidates.map(c => `
                    <button type="button" onclick="window.adminSetTitleTarget('${escapeJsAttr(c.uid)}', '${escapeJsAttr(c.nick)}')"
                            class="px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer ${state.adminTitleTargetUid === c.uid ? 'bg-tealAccent text-black' : 'bg-grayCard text-gray-300'}">
                      ${escapeHtml(c.nick)}
                    </button>
                  `).join('')}
                </div>
                ${selectedTitleUser ? `
                  <div class="p-3 rounded-xl bg-grayBase border border-grayBorder space-y-2">
                    <div class="text-xs text-gray-300">Нажмите на приписку, чтобы выдать или убрать у <b>${escapeHtml(selectedTitleUser.nick)}</b>:</div>
                    <div class="flex flex-wrap gap-1.5">
                      ${ALL_TITLES.map(t => {
                        const active = Boolean(selectedTitleUser.titles && selectedTitleUser.titles[t]);
                        return `
                          <button type="button" onclick="window.adminToggleUserTitle('${escapeJsAttr(selectedTitleUser.uid)}', '${t}')"
                                  class="px-2.5 py-1 rounded text-xs font-black cursor-pointer ${
                                    active ? 'bg-[#b91c1c] text-white ring-2 ring-white' : 'bg-grayCard text-gray-400'
                                  }">${t}</button>
                        `;
                      }).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>

              <!-- 3. Изменение Эло по нику -->
              <div class="space-y-2.5 border-t border-grayBorder pt-4">
                <h3 class="text-sm font-extrabold text-white">Изменить рейтинг Эло игрока</h3>
                <form onsubmit="window.adminUpdateUserElo(event)" class="space-y-2">
                  <input type="text" value="${escapeHtml(state.adminEloSearch)}"
                         oninput="state.adminEloSearch = this.value; state.adminEloTargetUid = ''; renderApp();"
                         placeholder="Никнейм игрока..."
                         class="w-full bg-grayBase border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                  <div class="flex flex-wrap gap-1.5">
                    ${eloCandidates.map(c => `
                      <button type="button" onclick="window.adminSetEloTarget('${escapeJsAttr(c.uid)}', '${escapeJsAttr(c.nick)}')"
                              class="px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer ${state.adminEloTargetUid === c.uid ? 'bg-tealAccent text-black' : 'bg-grayCard text-gray-300'}">
                        ${escapeHtml(c.nick)}
                      </button>
                    `).join('')}
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <select id="admin-elo-tc" class="bg-grayBase border border-grayBorder rounded-xl px-3 py-2 text-xs text-white">
                      <option value="10">10 мин</option>
                      <option value="3">3 мин</option>
                      <option value="1">1 мин</option>
                    </select>
                    <input id="admin-elo-val" type="number" value="500" placeholder="Новое Эло"
                           class="bg-grayBase border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                  </div>
                  <button type="submit" class="px-4 py-2 rounded-xl bg-tealAccent text-black font-extrabold text-xs cursor-pointer">
                    Установить Эло
                  </button>
                </form>
              </div>

              <!-- 4. Принудительная смена ника или удаление аккаунта -->
              <div class="space-y-3 border-t border-grayBorder pt-4">
                <h3 class="text-sm font-extrabold text-white">Смена ника / Удаление аккаунта</h3>
                <form onsubmit="window.adminForceNickChange(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <input id="admin-old-nick" type="text" placeholder="Текущий ник" class="bg-grayBase border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                  <input id="admin-new-nick" type="text" placeholder="Новый ник (любой)" class="bg-grayBase border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                  <button type="submit" class="px-3 py-2 rounded-xl bg-grayCard hover:bg-grayHover text-white font-bold text-xs cursor-pointer">Поменять ник</button>
                </form>

                <div class="space-y-2 pt-2">
                  <input type="text" value="${escapeHtml(state.adminDeleteSearch)}"
                         oninput="state.adminDeleteSearch = this.value; state.adminDeleteTargetUid = ''; renderApp();"
                         placeholder="Ник аккаунта для полного удаления..."
                         class="w-full bg-grayBase border border-grayBorder rounded-xl px-3 py-2 text-xs text-white" />
                  <div class="flex flex-wrap gap-1.5">
                    ${delCandidates.map(c => `
                      <button type="button" onclick="window.adminSetDeleteTarget('${escapeJsAttr(c.uid)}', '${escapeJsAttr(c.nick)}')"
                              class="px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer ${state.adminDeleteTargetUid === c.uid ? 'bg-red-600 text-white' : 'bg-grayCard text-gray-300'}">
                        ${escapeHtml(c.nick)}
                      </button>
                    `).join('')}
                  </div>
                  <button type="button" onclick="window.adminDeleteAccount()"
                          class="px-4 py-2 rounded-xl bg-red-900 hover:bg-red-800 text-red-100 font-extrabold text-xs cursor-pointer">
                    Удалить аккаунт и освободить ник
                  </button>
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // =========================================================================
    // ГЛАВНЫЙ РЕНДЕР ПРИЛОЖЕНИЯ
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      // Проверка активного бана
      if (state.currentUser && state.bansMap && state.bansMap[state.currentUser.uid] && !isCurrentUserAdmin()) {
        const ban = state.bansMap[state.currentUser.uid];
        if (!ban.expiresAt || ban.expiresAt > Date.now()) {
          root.innerHTML = renderBannedScreen(ban);
          return;
        }
      }

      // Проверка режима технических работ (кроме админа zoneboren@gmail.com)
      if (state.siteSettings?.maintenance && !isCurrentUserAdmin()) {
        root.innerHTML = renderMaintenanceScreen();
        return;
      }

      let bodyHtml = '';
      if (!state.currentUser) {
        bodyHtml = renderAuthScreen();
      } else if (state.onboardingStep) {
        bodyHtml = renderOnboardingScreen();
      } else {
        const p = state.path || '/';
        if (p.startsWith('/play')) bodyHtml = renderPlayScreen();
        else if (p.startsWith('/courses')) bodyHtml = renderCoursesScreen();
        else if (p.startsWith('/bots')) bodyHtml = renderBotsScreen();
        else if (p.startsWith('/settings')) bodyHtml = renderSettingsScreen();
        else if (p.startsWith('/game/')) bodyHtml = renderActiveGameScreen();
        else if (p.startsWith('/@')) bodyHtml = renderProfileScreen(decodeURIComponent(p.slice(2)));
        else bodyHtml = renderHomeScreen();
      }

      root.innerHTML = `
        ${renderTopBar()}
        <main class="flex-1 px-3 sm:px-6 py-4">
          ${bodyHtml}
        </main>
      `;
    }
    window.renderApp = renderApp;

    initRealtimeListeners();
    renderApp();
  </script>
</body>
</html>
